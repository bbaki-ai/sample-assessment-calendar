    ]);

    openLayer(drawer, 'FILTERS');
  }

  /* ---------- 14.3 Entry detail and its menu ---------- */

  function findEntry(id) {
    var all = (env.data && env.data.entries) || [];
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }

  function openEntryDetail(id) {
    var a = findEntry(id);
    if (!a) return;
    var body = el('div', { cls: 'ac-drawer__body' }, [buildCard(a, a.startDate)]);

    if (a.notes) {
      body.appendChild(el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: 'NOTES' }));
      body.appendChild(el('p', { text: a.notes }));
    }

    body.appendChild(el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: 'HISTORY' }));
    body.appendChild(el('p', { cls: 'ac-u-muted',
      text: 'Added by ' + (a.createdBy || 'unknown') +
            (a.updatedByName ? ', last changed by ' + a.updatedByName : '') +
            (a.updatedAt ? ' ' + fmt.relativeTime(Date.now() - (fmt.isoToMs(a.updatedAt) || Date.now())) : '') }));

    var actions = el('footer', { cls: 'ac-drawer__actions' });

    if (env.confirmDeleteId === a.id) {
      actions.appendChild(el('p', { cls: 'ac-field__hint ac-field__hint--strong',
        text: 'Delete “' + a.title + '”? It comes off the calendar, and ' +
              ((env.config && env.config.supportLabel) || 'Teaching & Learning') +
              ' keep a record of the change.' }));
      actions.appendChild(el('button', { cls: 'ac-btn ac-btn--primary', text: 'Delete it',
        attrs: { type: 'button', 'data-ac-action': 'delete-confirm', 'data-ac-id': a.id } }));
      actions.appendChild(el('button', { cls: 'ac-btn ac-btn--secondary', text: 'Keep it',
        attrs: { type: 'button', 'data-ac-action': 'delete-cancel', 'data-ac-id': a.id } }));
      actions.appendChild(el('button', { cls: 'ac-btn ac-btn--ghost', text: 'Close',
        attrs: { type: 'button', 'data-ac-action': 'close-layer' } }));
      openLayer(buildEntryShell(a, body, actions), 'DETAIL');
      return;
    }

    if (a.canEdit) {
      actions.appendChild(el('button', { cls: 'ac-btn ac-btn--primary', text: 'Edit',
        attrs: { type: 'button', 'data-ac-action': 'edit-entry', 'data-ac-id': a.id } }));
    }
    if (env.caps && env.caps.canWrite) {
      actions.appendChild(el('button', { cls: 'ac-btn ac-btn--secondary', text: 'Duplicate',
        attrs: { type: 'button', 'data-ac-action': 'duplicate-entry', 'data-ac-id': a.id } }));
    }
    if (a.canDelete) {
      actions.appendChild(el('button', { cls: 'ac-btn ac-btn--ghost', text: 'Delete',
        attrs: { type: 'button', 'data-ac-action': 'delete-entry', 'data-ac-id': a.id } }));
    }
    /* A locked entry explains itself rather than showing nothing. */
    if (a.lockReason) {
      actions.appendChild(el('p', { cls: 'ac-field__hint', text: lockReasonText(a.lockReason) }));
    }
    actions.appendChild(el('button', { cls: 'ac-btn ac-btn--ghost', text: 'Close',
      attrs: { type: 'button', 'data-ac-action': 'close-layer' } }));

    openLayer(buildEntryShell(a, body, actions), 'DETAIL');
  }

  function buildEntryShell(a, body, actions) {
    return el('aside', { id: 'ac-entry-detail', cls: 'ac-drawer ac-drawer--day',
      attrs: { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'ac-entry-title' } }, [
      el('header', { cls: 'ac-drawer__head' }, [
        el('h2', { id: 'ac-entry-title', cls: 'ac-drawer__title', text: a.title,
                   attrs: { tabindex: '-1' } }),
        el('p', { cls: 'ac-drawer__sub',
                  text: dt.formatHuman(a.startDate, 'EEEE d MMMM yyyy') + ' · ' +
                        ((a.gradeLabels && a.gradeLabels.join(', ')) || '') }),
        el('button', { cls: 'ac-drawer__close', text: '×',
          attrs: { type: 'button', 'data-ac-action': 'close-layer', 'aria-label': 'Close' } })
      ]),
      body, actions
    ]);
  }

  function lockReasonText(reason) {
    var c = env.config || {};
    return {
      PAST_EDIT_LOCK: 'This is now locked because the date has passed. ' +
                      (c.supportEmail ? 'Email ' + c.supportEmail + ' if it needs changing.' : ''),
      NOT_YOUR_ENTRY: 'Only the teacher who added this, or a grade lead, can change it.',
      DIVISION_INACTIVE: 'This division is not live in the calendar yet.',
      APPROVED_LOCKED: 'This has been approved and can no longer be edited directly.'
    }[reason] || 'This entry cannot be changed.';
  }

  function deleteEntry(id) {
    var a = findEntry(id);
    if (!a) return;
    /* Asked in the drawer, for the same reason as the discard question above:
       a blocked window.confirm made the Delete button silently dead. */
    env.confirmDeleteId = id;
    openEntryDetail(id);
    var btn = document.querySelector('[data-ac-action="delete-confirm"]');
    if (btn) btn.focus();
    a11y.announce('Delete “' + a.title + '”? Confirm below.', true);
  }

  function reallyDeleteEntry(id) {
    var a = findEntry(id);
    if (!a) return;
    net.call('apiDelete', { id: a.id, expectedVersion: a.version, reason: '',
                            clientRequestId: newRequestId() },
      function () {
        env.ranges = {};
        closeLayer();
        toast('Deleted. ' + fmt.cohortLabel(state.cohortKey) + '’s load has been updated.', 'OK');
        a11y.announce('Deleted.');
        fetchRange({ force: true });
      },
      function (err) {
        if (err.code === 'CONFLICT') {
          toast('Someone else changed this a moment ago. Refreshing so you can see it.', 'WARN');
          fetchRange({ force: true });
        } else { toastFromError(err); }
      });
  }

  /* ==========================================================================
     15. Toasts — COMPONENTS.md §14
     There is no ERROR tone. Errors are inline, never a toast alone.
     ========================================================================== */

  function toast(text, tone, extras) {
    var root = $('ac-toast-root');
    if (!root) return;
    while (root.children.length >= 2) root.removeChild(root.firstChild);

    var node = el('div', { cls: 'ac-toast',
      attrs: { role: 'status', 'data-ac-tone': tone || 'INFO' } }, [
      el('p', { cls: 'ac-toast__text', text: text })
    ]);
    (extras || []).forEach(function (b) { node.appendChild(b); });
    node.appendChild(el('button', { cls: 'ac-toast__close', text: '×',
      attrs: { type: 'button', 'data-ac-action': 'dismiss-toast', 'aria-label': 'Dismiss' } }));
    root.appendChild(node);

    /* Visual life 5 s, but it stays in the tab order for 10 s so a keyboard
       user is not raced to the Undo. */
    window.setTimeout(function () { node.classList.add('is-dimmed'); }, 5000);
    window.setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 10000);
    return node;
  }

  function toastSaved(sentence, a) {
    var cohort = fmt.cohortLabel(state.cohortKey);
    toast(sentence, 'OK', [
      el('button', { cls: 'ac-btn ac-btn--link', text: 'Undo',
        attrs: { type: 'button', 'data-ac-action': 'undo', 'data-ac-id': a.id } }),
      el('button', { cls: 'ac-btn ac-btn--link', text: 'Add another for ' + cohort,
        attrs: { type: 'button', 'data-ac-action': 'add-another',
                 'data-ac-date': a.startDate } })
    ]);
  }

  function toastFromError(err) {
    if (!err) return;
    var ref = err.code + '/' + ((env.meta && env.meta.requestId) || '');
    toast(err.message + '  (Ref: ' + ref + ')', 'WARN');
  }

  function flashEntry(id) {
    var node = document.querySelector('[data-ac-id="' + id + '"]');
    if (!node) return;
    node.classList.add('is-flash');
    if (node.focus) { try { node.focus(); } catch (e) {} }
    var hold = prefersReducedMotion() ? 3000 : 1200;
    window.setTimeout(function () { node.classList.remove('is-flash'); }, hold);
    node.scrollIntoView({ block: 'nearest' });
  }

  /* Write affordances are DISABLED with a visible reason when offline, never
     hidden — hiding makes a teacher think the feature vanished. */
  function syncOfflineControls() {
    var off = state.ui.offline;
    $$('[data-ac-action="add"],[data-ac-action="add-here"],[data-ac-action="save"]').forEach(function (b) {
      b.setAttribute('aria-disabled', off ? 'true' : 'false');
    });
  }

  /* ==========================================================================
     16. Freshness polling — COMPONENTS.md §3.1
     Paused while the tab is hidden, resumed with an immediate poll. The common
     case is a teacher returning to a tab left open since period 2, and that tab
     must not show yesterday's calendar without saying so.
     ========================================================================== */

  var pollTimer = null;

  function startFreshnessPolling() {
    stopFreshnessPolling();
    var secs = (env.config && env.config.freshnessPollSeconds) || 90;
    pollTimer = window.setInterval(function () {
      if (document.visibilityState === 'hidden') return;
      pollSync();
    }, secs * 1000);

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') pollSync();
    });

    /* The relative label re-renders on a 30 s tick so "2 minutes ago" does not
       silently become an hour old. */
    window.setInterval(function () {
      if (document.visibilityState === 'visible') { evaluateStaleness(); renderFreshness(); }
    }, 30000);
  }

  function stopFreshnessPolling() {
    if (pollTimer) window.clearInterval(pollTimer);
    pollTimer = null;
  }

  function pollSync() {
    net.call('apiGetSyncStatus', {}, function (data) {
      env.lastServerWriteAt = data.lastWriteAt || env.lastServerWriteAt;
      if (typeof data.dataVersion === 'number' && data.dataVersion > env.dataVersion) {
        env.freshnessState = 'NEW';
        /* Auto-apply ONLY when the user is idle, has no layer open and is not
           scrolled away. Never re-sort the grid under someone's finger. */
        if (!env.layerStack.length && !env.booking && window.pageYOffset < 40) {
          env.dataVersion = data.dataVersion;
          env.ranges = {};
          fetchRange({ force: true });
          env.freshnessState = 'FRESH';
          a11y.announce('The calendar has been updated.');
        }
      } else {
        evaluateStaleness();
      }
      renderFreshness();
    }, function () { /* a failed poll is not worth interrupting anyone over */ },
    { quiet: true });
  }

  function evaluateStaleness() {
    if (env.freshnessState === 'NEW') return;
    var limit = ((env.config && env.config.staleAfterSeconds) || 300) * 1000;
    var age = env.lastSyncAt ? (Date.now() - env.lastSyncAt) : 0;
    env.freshnessState = age > limit ? 'STALE' : 'FRESH';
    state.ui.stale = env.freshnessState === 'STALE';
  }

  function refreshNow() {
    env.freshnessState = 'REFRESHING';
    renderFreshness();
    env.ranges = {};
    env.metrics = null;
    fetchRange({ force: true });
    pollSync();
    window.setTimeout(function () {
      env.freshnessState = 'FRESH';
      state.ui.stale = false;
      renderFreshness();
      a11y.announce('Updated just now.');
    }, 400);
  }

  /* ==========================================================================
     17. AC.print — COMPONENTS.md §15
     The explicit button exists because the app runs in a sandboxed iframe: the
     browser's own Ctrl+P prints the Apps Script wrapper, while window.print()
     from inside the frame prints the frame's own document.
     ========================================================================== */

  var print = (function () {

    function fillPrintHeader() {
      var head = $('ac-print-header');
      if (!head) return;
      clear(head);
      var c = env.config || {};
      head.appendChild(el('p', { cls: 'ac-eyebrow ac-eyebrow--gold',
                                 text: 'AISA · TEACHING & LEARNING' }));
      head.appendChild(el('h1', { cls: 'ac-print-header__title',
        text: 'Assessment Calendar — ' + fmt.cohortLabel(state.cohortKey) +
              ' — ' + periodLabel() }));

      var f = state.filters;
      var filterBits = [];
      if (f.subjects.length) filterBits.push('Subjects: ' + f.subjects.map(function (s) {
        var x = fmt.findSubject(s); return x ? x.label : s; }).join(', '));
      if (f.types.length) filterBits.push('Types: ' + f.types.map(function (t) {
        var x = fmt.findType(t); return x ? x.label : t; }).join(', '));
      if (f.q) filterBits.push('Search: “' + f.q + '”');
      head.appendChild(el('p', { cls: 'ac-print-header__filters',
        text: filterBits.length ? filterBits.join(' · ') : 'All subjects and types' }));

      var iso = (env.meta && env.meta.serverTimeIso) || null;
      head.appendChild(el('p', { cls: 'ac-print-header__stamp',
        text: 'Data as of ' + (fmt.isoToClockAndDate(iso) || 'this session') +
              ' (' + (c.timezone || 'Asia/Dubai') + '). Printed by ' +
              ((env.user && env.user.displayName) || 'a member of staff') + '.' }));

      /* These two lines are MANDATORY when true. A printed calendar outlives
         the tab it came from; an undated one is a future clash. */
      var ageMin = env.lastSyncAt ? Math.round((Date.now() - env.lastSyncAt) / 60000) : 0;
      var warn = el('p', { cls: 'ac-print-header__warn',
        text: '⚠ This calendar may be out of date — it was last refreshed ' +
              ageMin + ' minutes before printing.' });
      warn.hidden = ageMin < 10;
      head.appendChild(warn);

      var provisional = ((env.lookups && env.lookups.terms) || [])
        .some(function (t) { return t.confirmed === false; });
      var prov = el('p', { cls: 'ac-print-header__prov',
        text: 'Term dates are provisional — confirm with Teaching & Learning.' });
      prov.hidden = !provisional;
      head.appendChild(prov);

      head.hidden = false;
    }

    function fillPrintFooter() {
      var foot = $('ac-print-footer');
      if (!foot) return;
      clear(foot);
      var url = '';
      try {
        if (typeof google !== 'undefined' && google.script && google.script.url) {
          google.script.url.getLocation(function (loc) {
            foot.appendChild(el('span', { text: (loc && loc.hash ? loc.hash : '') }));
          });
        }
      } catch (e) {}
      foot.appendChild(el('span', { text: 'AISA Assessment Calendar · ' +
        ((env.meta && env.meta.configVersion) || '') }));
      foot.hidden = false;
    }

    function run() {
      document.body.classList.add('is-printing');
      fillPrintHeader();
      fillPrintFooter();
      /* Force every disclosure open so the data tables print. */
      $$('details.ac-disclosure').forEach(function (d) { d.open = true; });
      window.requestAnimationFrame(function () {
        window.setTimeout(function () {
          try { window.print(); } catch (e) { toast('Printing isn’t available here.', 'WARN'); }
        }, 150);
      });
    }

    function cleanup() {
      document.body.classList.remove('is-printing');
      var h = $('ac-print-header'), f = $('ac-print-footer');
      if (h) h.hidden = true;
      if (f) f.hidden = true;
    }

    return { run: run, cleanup: cleanup };
  })();

  /* ==========================================================================
     18. Event delegation — ONE listener on #ac-app, plus a few document-level
     ones for layers that live outside it.
     Every interactive element declares data-ac-action; nothing here queries
     for specific elements.
     ========================================================================== */

  var searchTimer = null;

  function onClick(e) {
    var target = closestAction(e.target);
    if (!target) return;
    var action = target.getAttribute('data-ac-action');
    var date = target.getAttribute('data-ac-date');
    var id = target.getAttribute('data-ac-id');
    var value = target.getAttribute('data-ac-value');
    var cohort = target.getAttribute('data-ac-cohort');

    switch (action) {

      case 'skip':
        e.preventDefault();
        var main = $('ac-main'); if (main) main.focus();
        break;

      case 'set-cohort':
        e.preventDefault();
        if (cohort === state.cohortKey) break;
        setState({ cohortKey: cohort });
        env.metrics = null;
        fetchRange({});
        a11y.announce(fmt.cohortLabel(cohort) + ' selected.');
        syncUrl();
        break;

      case 'set-cohort-keep-date':
        e.preventDefault();
        setState({ cohortKey: cohort, selection: { dayDate: date } });
        fetchRange({});
        a11y.announce(fmt.cohortLabel(cohort) + ', ' + dt.formatHuman(date, 'EEEE d MMMM') + '.');
        syncUrl();
        break;

      case 'set-view':
        e.preventDefault();
        if (value === state.view) break;
        setState({ view: value });
        if (value === 'METRICS') env.metrics = null;
        fetchRange({});
        syncUrl();
        break;

      case 'prev':
      case 'next':
        e.preventDefault();
        stepPeriod(action === 'next' ? 1 : -1);
        break;

      case 'today':
        e.preventDefault();
        setState({ anchorDate: dt.today(), selection: { dayDate: dt.today() } });
        fetchRange({});
        a11y.announce('Showing today, ' + dt.formatHuman(dt.today(), 'EEEE d MMMM') + '.');
        break;

      case 'next-school-week':
        e.preventDefault();
        setState({ anchorDate: dt.addDays(state.anchorDate, 7) });
        fetchRange({});
        break;

      case 'open-day':
        e.preventDefault();
        if (!date) date = target.getAttribute('data-ac-date') ||
                          (target.closest ? (target.closest('[data-ac-date]') || {}).getAttribute &&
                           target.closest('[data-ac-date]').getAttribute('data-ac-date') : null);
        if (date) { state.selection.dayDate = date; openDaySheet(date); }
        break;

      case 'open-week':
        e.preventDefault();
        closeLayer();
        setState({ view: 'WEEK', anchorDate: date || state.anchorDate });
        fetchRange({});
        break;

      case 'open-entry':
        e.preventDefault();
        if (id) openEntryDetail(id);
        break;

      case 'entry-menu':
        e.preventDefault();
        if (id) openEntryDetail(id);
        break;

      case 'edit-entry':
        e.preventDefault();
        startEdit(id);
        break;

      case 'duplicate-entry':
        e.preventDefault();
        startDuplicate(id);
        break;

      case 'delete-entry':
        e.preventDefault();
        deleteEntry(id);
        break;

      case 'add':
      case 'add-here':
      case 'add-another':
        e.preventDefault();
        if (state.ui.offline) { toast('You’re offline — you can’t add anything ' +
                                      'until you reconnect.', 'WARN'); break; }
        if (!(env.caps && env.caps.canWrite)) break;
        if (env.layerStack.length) closeLayer();
        openBooking({ date: date || state.selection.dayDate || dt.today() });
        break;

      case 'continue':
        e.preventDefault();
        advanceStep();
        break;

      case 'goto-step':
        e.preventDefault();
        env.booking.step = parseInt(value, 10) || 1;
        renderBookingDrawer();
        focusStepHeading();
        break;

      case 'save':
        e.preventDefault();
        if (target.getAttribute('aria-disabled') === 'true') {
          /* The control stays focusable and explains itself rather than being
             a dead button a screen-reader user tabs past. */
          var why = $('ac-save-why');
          if (why) a11y.announce(why.textContent, true);
          break;
        }
        doSave(false);
        break;

      case 'request-approval':
        e.preventDefault();
        doSave(true);
        break;

      case 'use-date':
        e.preventDefault();
        if (!date || !env.booking) break;
        env.booking.draft.startDate = date;
        if (env.booking.draft.endDate && env.booking.draft.endDate < date) {
          env.booking.draft.endDate = date;
        }
        env.booking.dirty = true;
        if (env.booking.evaluation && env.booking.evaluation.checkId) {
          /* The teacher moved the date after a warning. That is the signal the
             whole tool exists to produce, so it is reported explicitly. */
          net.call('apiReportOutcome', { checkId: env.booking.evaluation.checkId,
            outcome: 'CHANGED_DATE', finalStartDate: date, assessmentId: null },
            null, function () {}, { quiet: true });
        }
        scheduleEvaluate();
        a11y.announce('Date changed to ' + dt.formatHuman(date, 'EEEE d MMMM') + '. Re-checking.');
        break;

      case 'toggle-grade':
        e.preventDefault();
        toggleInArray(env.booking.draft.grades, value);
        /* Sections belong to a grade; dropping the grade must drop them too. */
        env.booking.draft.sections = env.booking.draft.sections.filter(function (s) {
          return env.booking.draft.grades.indexOf(s.split('-')[0]) >= 0;
        });
        env.booking.dirty = true;
        scheduleEvaluate();
        break;

      case 'toggle-section':
        e.preventDefault();
        if (value === '') env.booking.draft.sections = [];
        else toggleInArray(env.booking.draft.sections, value);
        env.booking.dirty = true;
        scheduleEvaluate();
        break;

      case 'toggle-multiday':
        /* The checkbox's own change event does the work; this keeps the
           delegated handler from swallowing it. */
        break;

      case 'expand-findings':
        e.preventDefault();
        env.booking.findingsExpanded = true;
        renderBookingDrawer();
        break;

      case 'focus-field':
        e.preventDefault();
        var f = $(value || '');
        if (f && f.focus) f.focus();
        break;

      case 'filter-menu':
        e.preventDefault();
        if (popoverNode && popoverNode.anchor === target) closePopover();
        else openPopover(target, target.getAttribute('data-ac-facet'));
        break;

      case 'open-filters':
        e.preventDefault();
        openFiltersDrawer();
        break;

      case 'toggle-facet':
        /* Checkbox inputs fire change; token buttons fire click. */
        if (target.tagName === 'BUTTON') {
          e.preventDefault();
          applyFacet(target.getAttribute('data-ac-facet'), target.getAttribute('data-ac-value'));
          var on = state.filters[target.getAttribute('data-ac-facet')]
                     .indexOf(target.getAttribute('data-ac-value')) >= 0;
          target.setAttribute('aria-pressed', on ? 'true' : 'false');
        }
        break;

      case 'remove-facet':
        e.preventDefault();
        removeFacet(target.getAttribute('data-ac-facet'), target.getAttribute('data-ac-value'));
        break;

      case 'clear-filters':
        e.preventDefault();
        setState({ filters: { subjects: [], types: [], teachers: [], statuses: [], q: '' },
                   show: { cancelled: false, uncounted: true } });
        a11y.announce('Filters cleared. ' + visibleCount() + ' assessments shown.');
        break;

      case 'show-hidden':
        e.preventDefault();
        var dimmedList = target.parentNode.querySelector('.ac-list--dimmed');
        if (dimmedList) { dimmedList.hidden = false; target.hidden = true; }
        break;

      case 'dismiss-banner':
        e.preventDefault();
        env.dismissedBanners[id] = true;
        renderBanners();
        break;

      case 'dismiss-toast':
        e.preventDefault();
        var t = target.parentNode;
        if (t && t.parentNode) t.parentNode.removeChild(t);
        break;

      case 'undo':
        e.preventDefault();
        deleteEntry(id);
        break;

      case 'close-layer':
        e.preventDefault();
        if (state.ui.drawer === 'BOOKING') confirmDiscardThenClose();
        else { env.confirmDeleteId = null; closeLayer(); }
        break;

      case 'discard-confirm':
        e.preventDefault();
        env.booking = null;
        closeLayer();
        break;

      case 'discard-cancel':
        e.preventDefault();
        env.booking.confirmDiscard = false;
        renderBookingDrawer();
        break;

      case 'delete-confirm':
        e.preventDefault();
        env.confirmDeleteId = null;
        reallyDeleteEntry(id);
        break;

      case 'delete-cancel':
        e.preventDefault();
        env.confirmDeleteId = null;
        openEntryDetail(id);
        break;

      case 'keep-mine':
        e.preventDefault();
        /* Re-save against the CURRENT version, having shown the teacher both. */
        if (env.booking) { env.booking.expectedVersion = null; doSave(false); }
        break;

      case 'use-theirs':
        e.preventDefault();
        env.booking = null;
        closeLayer();
        fetchRange({ force: true });
        break;

      case 'refresh':
        e.preventDefault();
        refreshNow();
        break;

      case 'copy-link':
        e.preventDefault();
        copyViewLink();
        break;

      case 'print':
        e.preventDefault();
        print.run();
        break;

      case 'retry':
        e.preventDefault();
        fetchRange({ force: true });
        break;

      case 'export':
        e.preventDefault();
        doExport();
        break;
    }
  }

  function onChange(e) {
    var target = e.target;
    var action = target.getAttribute && target.getAttribute('data-ac-action');
    if (!action) return;

    if (action === 'toggle-facet' && target.type === 'checkbox') {
      applyFacet(target.getAttribute('data-ac-facet'), target.getAttribute('data-ac-value'));
      return;
    }
    if (action === 'toggle-show') {
      var which = target.getAttribute('data-ac-value');
      var patch = {};
      patch[which] = target.checked;
      setState({ show: patch });
      return;
    }
    if (action === 'change-date' && env.booking) {
      var b = env.booking;
      if (target.id === 'ac-f-start') {
        b.draft.startDate = target.value;
        if (!b.draft.endDate || b.draft.endDate < target.value) b.draft.endDate = target.value;
      } else if (target.id === 'ac-f-end') {
        b.draft.endDate = target.value;
      }
      b.dirty = true;
      scheduleEvaluate();
      return;
    }
    if (action === 'toggle-multiday' && env.booking) {
      var wrap = $('ac-f-end-wrap');
      if (wrap) wrap.hidden = !target.checked;
      if (!target.checked) {
        env.booking.draft.endDate = env.booking.draft.startDate;
        scheduleEvaluate();
      }
      return;
    }
    if (action === 'change-type' && env.booking) {
      env.booking.draft.typeId = target.value;
      env.booking.dirty = true;
      /* Weights differ by type, so the verdict can change. Re-check. */
      scheduleEvaluate();
      return;
    }
    if (action === 'change-field' && env.booking) {
      var field = target.getAttribute('data-ac-field');
      var v = target.value;
      if (field === 'durationMinutes') v = v ? parseInt(v, 10) : null;
      if (field === 'overrideReason') env.booking.overrideReason = v;
      else env.booking.draft[field] = v;
      env.booking.dirty = true;
      if (field === 'title') {
        var counter = $('ac-f-title-count');
        var max = (env.config && env.config.maxTitleLen) || 120;
        if (counter) counter.textContent = String(v.length) + ' of ' + max;
      }
      target.removeAttribute('aria-invalid');
      return;
    }
  }

  function onInput(e) {
    var target = e.target;
    var action = target.getAttribute && target.getAttribute('data-ac-action');
    if (action === 'search') {
      if (searchTimer) window.clearTimeout(searchTimer);
      var v = target.value;
      searchTimer = window.setTimeout(function () {
        state.filters.q = v;
        render();
        a11y.announce(visibleCount() + ' of ' +
          (((env.data && env.data.entries) || []).length) + ' assessments shown.');
      }, SEARCH_DEBOUNCE_MS);
      return;
    }
    if (action === 'change-field' || action === 'change-type') onChange(e);
  }

  function toggleInArray(arr, value) {
    var i = arr.indexOf(value);
    if (i >= 0) arr.splice(i, 1); else arr.push(value);
  }

  function applyFacet(facet, value) {
    var arr = state.filters[facet];
    if (!arr) return;
    var next = arr.slice();
    var i = next.indexOf(value);
    if (i >= 0) next.splice(i, 1); else next.push(value);
    var patch = {}; patch[facet] = next;
    setState({ filters: patch });
    a11y.announce(visibleCount() + ' of ' +
      (((env.data && env.data.entries) || []).length) + ' assessments shown.');
  }

  function removeFacet(facet, value) {
    if (facet === 'q') { setState({ filters: { q: '' } }); return; }
    if (facet === 'show-cancelled') { setState({ show: { cancelled: false } }); return; }
    if (facet === 'show-uncounted') { setState({ show: { uncounted: true } }); return; }
    applyFacet(facet, value);
  }

  function stepPeriod(delta) {
    var anchor = state.view === 'WEEK'
      ? dt.addDays(state.anchorDate, 7 * delta)
      : dt.addMonths(state.anchorDate, delta);
    setState({ anchorDate: anchor });
    fetchRange({});
    prefetchNeighbours();
    a11y.announce(periodLabel() + '.');
    syncUrl();
  }

  function advanceStep() {
    var b = env.booking;
    if (b.step === 1) {
      if (!b.draft.startDate || !(b.draft.grades || []).length) {
        showFormErrors(validateDraft().filter(function (p) {
          return ['grades', 'startDate', 'endDate'].indexOf(p.field) >= 0; }));
        return;
      }
      b.step = 2;
    } else if (b.step === 2) {
      var det = validateDraft().filter(function (p) {
        return ['title', 'typeId', 'subjectId'].indexOf(p.field) >= 0; });
      if (det.length) { showFormErrors(det); return; }
      b.step = 3;
    }
    renderBookingDrawer();
    focusStepHeading();
  }

  function focusStepHeading() {
    var title = $('ac-booking-title');
    if (title) title.focus();
  }

  function startEdit(id) {
    var a = findEntry(id);
    if (!a || !a.canEdit) return;
    closeLayer();
    openBooking({
      mode: 'EDIT', id: a.id, expectedVersion: a.version, date: a.startDate,
      draft: {
        id: a.id, title: a.title, typeId: a.typeId, subjectId: a.subjectId,
        grades: a.grades.slice(), sections: (a.sections || []).slice(),
        startDate: a.startDate, endDate: a.endDate,
        durationMinutes: a.durationMinutes, periodOrBlock: a.periodOrBlock,
        notes: a.notes, teacherName: a.teacherName, teacherEmail: a.teacherEmail
      }
    });
  }

  function startDuplicate(id) {
    var a = findEntry(id);
    if (!a) return;
    closeLayer();
    /* Duplicate copies everything EXCEPT the dates — the whole reason to
       duplicate is to place the same assessment on a different day. */
    openBooking({
      mode: 'CREATE', date: state.selection.dayDate || dt.today(),
      draft: {
        title: a.title, typeId: a.typeId, subjectId: a.subjectId,
        grades: a.grades.slice(), sections: (a.sections || []).slice(),
        durationMinutes: a.durationMinutes, notes: a.notes
      }
    });
  }

  function doExport() {
    var r = rangeForView(state.view, state.anchorDate);
    net.call('apiExport', { start: r.start, end: r.end, cohort: state.cohortKey,
                            includeCancelled: true, format: 'CSV' },
      function (data) {
        /* The server returns a link; it never streams bytes, because downloads
           started inside the sandboxed iframe are unreliable. Opening it from
           the click handler keeps the user gesture. */
        toast(data.note || 'Export ready.', 'OK', [
          el('a', { cls: 'ac-btn ac-btn--link', text: 'Open ' + data.fileName,
                    attrs: { href: data.url, target: '_blank', rel: 'noopener' } })
        ]);
      }, toastFromError);
  }

  function copyViewLink() {
    function done(url) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () {
            toast('Link copied. It opens on ' + fmt.cohortLabel(state.cohortKey) +
                  ', ' + periodLabel() + '.', 'OK');
          }, function () { promptCopy(url); });
        } else { promptCopy(url); }
      } catch (e) { promptCopy(url); }
    }
    function promptCopy(url) { window.prompt('Copy this link:', url); }

    try {
      if (typeof google !== 'undefined' && google.script && google.script.url) {
        google.script.url.getLocation(function (loc) {
          var base = (loc && loc.parameters && loc.parameters.__base) ? loc.parameters.__base[0] : '';
          done((base || window.location.href.split('?')[0]) + '?' + viewParams());
        });
        return;
      }
    } catch (e) {}
    done(window.location.href.split('?')[0] + '?' + viewParams());
  }

  function viewParams() {
    return 'view=' + encodeURIComponent(state.view.toLowerCase()) +
           '&date=' + encodeURIComponent(state.anchorDate) +
           '&cohort=' + encodeURIComponent(state.cohortKey);
  }

  /* google.script.history.replaceState is the ONLY way to change the parent
     frame's query string from inside the IFRAME sandbox. popstate is not
     available, so Back never navigates within the app — which is why every
     layer closes by an explicit control and the view switcher is always
     visible. */
  function syncUrl() {
    try {
      if (typeof google !== 'undefined' && google.script && google.script.history) {
        google.script.history.replaceState(
          { view: state.view, date: state.anchorDate, cohort: state.cohortKey },
          { view: state.view.toLowerCase(), date: state.anchorDate, cohort: state.cohortKey });
      }
    } catch (e) {}
  }

  /* ---------- 18.1 Keyboard ---------- */

  function onKeydown(e) {
    if (e.key === 'Escape') {
      if (popoverNode) { closePopover(); return; }
      if (env.shortcutsOpen) { closeLayer(); env.shortcutsOpen = false; return; }
      if (env.layerStack.length) {
        /* Escape closes the TOPMOST layer only. */
        if (state.ui.drawer === 'BOOKING') confirmDiscardThenClose();
        else closeLayer();
      }
      return;
    }

    /* Ctrl/Cmd+P is intercepted so it prints the frame, not the Apps Script
       wrapper around it. */
    if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
      e.preventDefault();
      print.run();
      return;
    }

    if (env.layerStack.length || popoverNode) return;
    if (isTypingTarget(e.target)) return;

    if (e.key === '?') { e.preventDefault(); openShortcuts(); return; }
    if (e.key === 'a' || e.key === 'A') {
      if (env.caps && env.caps.canWrite) {
        e.preventDefault();
        var focused = document.activeElement;
        var d = focused && focused.getAttribute ? focused.getAttribute('data-ac-date') : null;
        openBooking({ date: d || state.selection.dayDate || dt.today() });
      }
      return;
    }
    if (e.key === 'Enter' || e.key === ' ') {
      var cell = document.activeElement;
      if (cell && cell.getAttribute && cell.getAttribute('role') === 'gridcell') {
        var date = cell.getAttribute('data-ac-date');
        if (date && cell.hasAttribute('data-ac-action')) {
          e.preventDefault();
          state.selection.dayDate = date;
          openDaySheet(date);
        }
      }
    }
  }

  function isTypingTarget(t) {
    if (!t || !t.tagName) return false;
    var tag = t.tagName.toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || t.isContentEditable;
  }

  function moveGridFocus(fromDate, how) {
    var nDays = gridDays();
    var target = fromDate;

    function nextSchoolDay(ymd, dir) {
      /* Arrow keys move between SCHOOL days, skipping the suppressed weekend
         and wrapping across week rows. */
      var d = ymd, guard = 0;
      do { d = dt.addDays(d, dir); guard++; } while (dt.isoDow(d) > nDays && guard < 10);
      return d;
    }

    switch (how) {
      case 'next-day':  target = nextSchoolDay(fromDate, 1); break;
      case 'prev-day':  target = nextSchoolDay(fromDate, -1); break;
      case 'next-week': target = dt.addDays(fromDate, 7); break;
      case 'prev-week': target = dt.addDays(fromDate, -7); break;
      case 'row-start': target = dt.weekStartOf(fromDate, weekStart()); break;
      case 'row-end':   target = dt.addDays(dt.weekStartOf(fromDate, weekStart()), nDays - 1); break;
      case 'next-month': target = dt.addMonths(fromDate, 1); break;
      case 'prev-month': target = dt.addMonths(fromDate, -1); break;
      case 'next-year':  target = dt.addMonths(fromDate, 12); break;
      case 'prev-year':  target = dt.addMonths(fromDate, -12); break;
    }

    var sameMonth = dt.startOfMonth(target) === dt.startOfMonth(state.anchorDate);
    state.selection.dayDate = target;

    if (!sameMonth) {
      /* Crossing a month boundary loads the new month and restores focus to the
         equivalent day, announcing the month politely. */
      setState({ anchorDate: target });
      fetchRange({});
      a11y.announce(dt.formatHuman(target, 'MMMM yyyy') + '.');
      window.setTimeout(function () { focusCell(target); }, 60);
    } else {
      focusCell(target);
    }
  }

  function focusCell(ymd) {
    var grid = $('ac-month-grid');
    if (!grid) return;
    var cell = $('ac-cell-' + ymd);
    if (!cell) return;
    a11y.setRovingFocus(grid, ymd);
    cell.focus();
  }

  function openShortcuts() {
    env.shortcutsOpen = true;
    var rows = [
      ['← →', 'Previous or next school day'],
      ['↑ ↓', 'Same weekday, previous or next week'],
      ['Home / End', 'First or last school day of the row'],
      ['Page Up / Page Down', 'Previous or next month (with Shift, year)'],
      ['Enter or Space', 'Open the day'],
      ['a', 'Add an assessment on the focused day'],
      ['Escape', 'Close whatever is open'],
      ['?', 'This list']
    ];
    var dl = el('dl', { cls: 'ac-difflist' });
    rows.forEach(function (r) {
      dl.appendChild(el('dt', { text: r[0] }));
      dl.appendChild(el('dd', { text: r[1] }));
    });
    openLayer(el('aside', { cls: 'ac-drawer ac-drawer--day',
      attrs: { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'ac-shortcuts-title' } }, [
      el('header', { cls: 'ac-drawer__head' }, [
        el('h2', { id: 'ac-shortcuts-title', cls: 'ac-drawer__title', text: 'Keyboard shortcuts',
                   attrs: { tabindex: '-1' } }),
        el('button', { cls: 'ac-drawer__close', text: '×',
          attrs: { type: 'button', 'data-ac-action': 'close-layer', 'aria-label': 'Close' } })
      ]),
      el('div', { cls: 'ac-drawer__body' }, [dl])
    ]), 'DETAIL');
  }

  /* ==========================================================================
     19. AC.boot
     Reads the inlined bootstrap payload, applies URL params, first render.
     FIRST PAINT COSTS ZERO RPCs — the payload is already in the page.
     ========================================================================== */

  function boot() {
    var payload = readBootstrap();

    if (!payload) {
      /* No inlined payload: either a misconfigured deployment, or the preview
         harness before its mock has installed one. Ask the server directly. */
      net.call('apiBootstrap', {}, function (data, meta) {
        applyBootstrap(data, meta);
        finishBoot();
      }, function (err) {
        renderBootFailure(err);
      });
      return;
    }

    applyBootstrap(payload, payload.meta || null);
    finishBoot();
  }

  function readBootstrap() {
    var node = $('ac-bootstrap-data');
    if (!node) return null;
    var raw = node.textContent;
    if (!raw || raw === 'null') return null;
    try { return JSON.parse(raw); } catch (e) {
      if (window.console) console.error('Bootstrap payload could not be parsed.', e);
      return null;
    }
  }

  function applyBootstrap(p, meta) {
    env.boot = p;
    env.user = p.user || { role: 'VIEWER' };
    env.caps = p.capabilities || {};
    env.config = p.config || {};
    env.lookups = p.lookups || {};
    if (meta) net.absorbMeta(meta);
    env.lastSyncAt = Date.now();
    env.lastServerWriteAt = p.freshness && p.freshness.lastWriteAt;

    state.ui.density = (p.prefs && p.prefs.density) || 'COMFORTABLE';
    state.cohortKey = env.config.defaultCohort || 'all';
    state.anchorDate = dt.today();

    /* Precedence: server prefs, then localStorage, then config defaults... */
    prefs.apply(p.prefs);

    /* ...and URL params win over all of them, because a link someone was sent
       must open on what the sender was looking at. */
    applyUrlParams(p.urlParams || (p.meta && p.meta.urlParams) || null);

    if (state.view === 'AUTO' || !state.view) state.view = 'MONTH';
    if (env.config.defaultView && env.config.defaultView !== 'AUTO' && !(p.prefs && p.prefs.view)) {
      state.view = env.config.defaultView;
    }
    if (state.view === 'METRICS' && !env.caps.canViewMetrics) state.view = 'MONTH';

    if (p.initial) {
      var r = rangeForView(state.view, state.anchorDate);
      env.ranges[cacheKey(state.cohortKey, r)] = p.initial;
      env.data = p.initial;
    }
  }

  function applyUrlParams(fromServer) {
    var params = fromServer;
    if (!params) {
      params = {};
      var qs = window.location.search || '';
      qs.replace(/^\?/, '').split('&').forEach(function (pair) {
        if (!pair) return;
        var kv = pair.split('=');
        params[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
      });
    }
    if (params.view) {
      var v = String(params.view).toUpperCase();
      if (['MONTH', 'WEEK', 'METRICS'].indexOf(v) >= 0) state.view = v;
    }
    if (params.date && dt.isValidYmd(params.date)) {
      state.anchorDate = params.date;
      state.selection.dayDate = params.date;
    }
    if (params.cohort) state.cohortKey = params.cohort;
    if (params.subj) state.filters.subjects = String(params.subj).split(',').filter(Boolean);
    if (params.type) state.filters.types = String(params.type).split(',').filter(Boolean);
    if (params.teacher) state.filters.teachers = String(params.teacher).split(',').filter(Boolean);
    if (params.status) state.filters.statuses = String(params.status).split(',').filter(Boolean);
    if (params.q) state.filters.q = String(params.q);
    if (params.id) env.pendingFocusId = String(params.id);
  }

  function finishBoot() {
    /* ONE listener per event type, on document.

       There used to be a second pair on #ac-app, with the document handlers
       skipping anything inside it. That double-fired: a handler such as
       "Continue" re-renders the drawer, which DETACHES the clicked button, so by
       the time the event bubbled to document the `app.contains(e.target)` guard
       was false and the same action ran a second time - pressing Continue once
       advanced two steps and raised spurious validation errors.

       document alone is sufficient: the drawer root sits inside #ac-app, and the
       filter popover is appended to document.body, so both are covered. */
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', onKeydown);
    window.addEventListener('afterprint', print.cleanup);
    window.addEventListener('online', function () { net.setOffline(false); pollSync(); });
    window.addEventListener('offline', function () { net.setOffline(true); });
    window.addEventListener('resize', debounceResize);

    renderNow();

    if (!env.data) fetchRange({});
    else prefetchNeighbours();

    startFreshnessPolling();

    if (env.pendingFocusId) {
      window.setTimeout(function () {
        flashEntry(env.pendingFocusId);
        env.pendingFocusId = null;
      }, 300);
    }
  }

  var resizeTimer = null;
  var wasPhone = null;
  function debounceResize() {
    if (resizeTimer) window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      var now = isPhone();
      /* Only re-render when the breakpoint actually crossed — the desktop and
         phone day cells are structurally different, everything else is CSS. */
      if (now !== wasPhone) { wasPhone = now; render(); }
    }, 200);
  }

  function renderBootFailure(err) {
    var root = $('ac-view-root');
    if (!root) return;
    var code = (err && err.code) || 'BACKEND';
    if (code === 'NOT_SIGNED_IN') {
      replaceChildrenWith(root, [ errorBlock(code, 'Please sign in with your AISA account.',
        'This calendar is only available to signed-in AISA staff. Sign in to your school ' +
        'Google account in this browser and reload the page.') ]);
      return;
    }
    if (code === 'NOT_AUTHORISED' || code === 'ACCESS_DEACTIVATED') {
      replaceChildrenWith(root, [ errorBlock(code, 'This calendar is for AISA staff.',
        'If you think you should have access, email ' +
        ((err.details && err.details.supportEmail) || 'Teaching & Learning') + '.') ]);
      return;
    }
    replaceChildrenWith(root, [ errorBlock(code, 'We couldn’t load the calendar.',
      (err && err.message) || 'Nothing was changed.',
      code + '/' + ((env.meta && env.meta.requestId) || 'no-id')) ]);
  }

  /* ==========================================================================
     20. Public surface — exactly the members CONTRACT.md §9.4 permits.
     ========================================================================== */

  var api = {
    state: state,
    setState: setState,
    net: net,
    dt: dt,
    fmt: fmt,
    a11y: a11y,
    prefs: prefs,
    print: print,
    boot: boot,
    render: {
      month: renderMonth, week: renderWeek, dayCell: buildDayCell, chip: buildChip,
      daySheet: openDaySheet, booking: openBooking, evalPanel: buildEvalPanel,
      metrics: renderMetrics, states: renderView
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { api.boot(); });
  } else {
    api.boot();
  }

  return api;
})();
</script>


</body>
</html>
