      /* The proration note MUST render whenever the week is short, or the cap
         looks arbitrary and teachers stop believing the numbers. */
      var pro = el('p', { cls: 'ac-week-head__proration' });
      if (wl.prorated) {
        pro.textContent = 'Short week — ' + wl.segmentDays + ' school days, so the weekly ' +
          'limit is ' + wl.cap + ' instead of ' + wl.baseCap + '.';
        pro.hidden = false;
      } else { pro.hidden = true; }
      head.appendChild(pro);
    }

    head.appendChild(buildWeekStrip(ws, true));

    var holidays = [];
    for (var i = 0; i < gridDays(); i++) {
      var d = dt.addDays(ws, i);
      var dl = dayLoad(d);
      if (dl && dl.isSchoolDay === false) holidays.push((dl.dayTypeLabel || dayTypeWord(dl.dayType)));
    }
    head.appendChild(el('p', { cls: 'ac-week-head__meta' }, [
      el('span', { text: 'Holidays this week: ' + (holidays.length ? holidays.join(', ') : 'none') }),
      el('span', { text: wl && wl.schoolWeekLabel ? wl.schoolWeekLabel : '' })
    ]));

    var cols = el('div', { cls: 'ac-week__cols' });
    for (var j = 0; j < gridDays(); j++) {
      cols.appendChild(buildWeekColumn(dt.addDays(ws, j)));
    }

    replaceChildrenWith(root, [
      el('section', { id: 'ac-week', cls: 'ac-week',
                      attrs: { 'aria-labelledby': 'ac-view-heading' } }, [head, cols])
    ]);
  }

  function buildWeekColumn(ymd) {
    var dl = dayLoad(ymd);
    var level = dl ? dl.level : 'NONE';
    var isSchool = dl ? dl.isSchoolDay !== false : dt.isoDow(ymd) <= gridDays();
    var shown = entriesForDate(ymd, true);
    var all = entriesForDate(ymd, false);
    var headingId = 'ac-weekcol-' + ymd;

    var colHead = el('header', { cls: 'ac-week-col__head' }, [
      el('h3', { id: headingId, cls: 'ac-week-col__title' }, [
        el('span', { cls: 'ac-week-col__dow', text: dt.formatHuman(ymd, 'EEEE') }),
        el('span', { cls: 'ac-week-col__date', text: dt.formatHuman(ymd, 'd MMM') })
      ])
    ]);

    var dayTypeNote = el('p', { cls: 'ac-week-col__daytype' });
    if (!isSchool) {
      dayTypeNote.textContent = (dl && dl.dayTypeLabel) || dayTypeWord(dl ? dl.dayType : 'UNKNOWN');
      dayTypeNote.hidden = false;
    } else { dayTypeNote.hidden = true; }
    colHead.appendChild(dayTypeNote);

    if (isSchool) {
      colHead.appendChild(buildMeter(level, dl ? dl.counted : 0, dl ? dl.cap : null,
                                     { visibleText: true }));
      if (env.caps && env.caps.canWrite) {
        colHead.appendChild(el('button', {
          cls: 'ac-btn ac-btn--ghost ac-btn--sm ac-u-no-print', text: 'Add here',
          attrs: { type: 'button', 'data-ac-action': 'add-here', 'data-ac-date': ymd }
        }));
      }
    }

    /* A list per day with NORMAL tab order: role="grid" is the wrong model once
       each cell holds several interactive cards. */
    var list = el('ul', { cls: 'ac-week-col__list', attrs: { role: 'list' } });
    shown.forEach(function (a) {
      list.appendChild(el('li', { attrs: { role: 'listitem' } }, [buildCard(a, ymd)]));
    });
    if (filtersActive() && all.length !== shown.length) {
      list.appendChild(el('li', { attrs: { role: 'listitem' } }, [
        el('p', { cls: 'ac-day-cell__filtered',
                  text: shown.length + ' of ' + all.length + ' shown — the load above is ' +
                        'the true figure' })
      ]));
    }

    return el('section', { cls: 'ac-week-col',
      attrs: { 'data-ac-date': ymd, 'data-ac-level': level,
               'aria-labelledby': headingId } }, [colHead, list]);
  }

  /* ---------- 11.9 Assessment card — COMPONENTS.md §8.3 ---------- */

  function buildCard(a, contextDate) {
    var titleId = 'ac-card-t-' + fmt.safeKey(a.id);
    var counts = a.countsTowardLoad !== false;
    var spanned = a.spanDays && a.spanDays > 1;

    var head = el('div', { cls: 'ac-card__head' }, [
      el('span', { cls: 'ac-chip__badge', text: a.typeShortCode || '?',
                   attrs: { 'data-ac-color': a.typeColorToken || 'type-other',
                            'aria-hidden': 'true' } }),
      el('span', { cls: 'ac-card__typelabel', text: a.typeLabel || a.typeId })
    ]);
    var pending = el('span', { cls: 'ac-pill ac-pill--pending', text: 'Pending' });
    pending.hidden = a.status !== 'PENDING';
    head.appendChild(pending);

    var cohorts = (a.gradeLabels && a.gradeLabels.join(', ')) || '';
    if (a.sections && a.sections.length) {
      cohorts += ' · ' + a.sections.map(function (s) { return s.replace('-', ''); }).join(', ');
    }

    var spanEl = el('span', { cls: 'ac-card__span',
      text: spanned ? (dt.formatHuman(a.startDate, 'EEE d') + ' – ' +
                       dt.formatHuman(a.endDate, 'EEE d MMM') + ' · ' +
                       a.spanSchoolDays + ' school days') : '' });
    spanEl.hidden = !spanned;

    var uncounted = el('p', { cls: 'ac-card__uncounted', text: 'Not counted toward load' });
    uncounted.hidden = counts;

    var kids = [
      el('span', { cls: 'ac-card__accent', attrs: { 'aria-hidden': 'true' } }),
      head,
      el('h4', { id: titleId, cls: 'ac-card__title', text: a.title }),
      el('p', { cls: 'ac-card__meta' }, [
        el('span', { cls: 'ac-card__subject', text: a.subjectLabel || a.subjectId }),
        el('span', { cls: 'ac-card__cohorts', text: cohorts })
      ]),
      el('p', { cls: 'ac-card__meta ac-u-muted' }, [
        el('span', { cls: 'ac-card__teacher', text: a.teacherName || '' }),
        el('span', { cls: 'ac-card__duration',
                     text: a.durationMinutes ? (a.durationMinutes + ' min') : '' }),
        spanEl
      ]),
      uncounted
    ];

    /* The overflow menu is rendered only when there is at least one thing the
       caller may actually do. A locked entry shows the reason instead. */
    if (a.canEdit || a.canDelete || a.lockReason || (env.caps && env.caps.canWrite)) {
      kids.push(el('button', {
        cls: 'ac-card__menu ac-u-no-print', text: '⋯',
        attrs: { type: 'button', 'data-ac-action': 'entry-menu', 'data-ac-id': a.id,
                 'aria-haspopup': 'menu', 'aria-expanded': 'false',
                 'aria-label': 'Actions for ' + a.title }
      }));
    }

    return el('article', {
      cls: 'ac-card' + (spanned ? ' ac-card--span' : '') + (a.lockReason ? ' is-locked' : ''),
      attrs: {
        'data-ac-id': a.id, 'data-ac-type': a.typeId, 'data-ac-status': a.status,
        'data-ac-counts': counts ? 'true' : 'false',
        'data-ac-span': spanned ? String(a.spanDays) : null,
        'aria-labelledby': titleId
      }
    }, kids);
  }

  /* ---------- 11.10 Day sheet — COMPONENTS.md §9 ----------
     On desktop this is a 420px right-hand drawer that leaves the month grid
     visible behind it, deliberately: comparing the chosen day to its
     neighbours is the task. */

  function openDaySheet(ymd) {
    var dl = dayLoad(ymd);
    var shown = entriesForDate(ymd, true);
    var all = entriesForDate(ymd, false);
    var hidden = all.length - shown.length;
    var isSchool = dl ? dl.isSchoolDay !== false : dt.isoDow(ymd) <= gridDays();

    var body = el('div', { cls: 'ac-drawer__body' });

    var dayTypeNote = el('p', { cls: 'ac-daytype' });
    if (!isSchool) {
      dayTypeNote.textContent = ((dl && dl.dayTypeLabel) || dayTypeWord(dl ? dl.dayType : 'UNKNOWN')) +
                                ' — not a school day';
      dayTypeNote.hidden = false;
    } else { dayTypeNote.hidden = true; }
    body.appendChild(dayTypeNote);

    body.appendChild(buildMeter(dl ? dl.level : 'NONE', dl ? dl.counted : 0,
                                dl ? dl.cap : null, { large: true, visibleText: true }));

    body.appendChild(el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: 'SCHEDULED THIS DAY' }));
    var list = el('ul', { cls: 'ac-list', attrs: { role: 'list' } });
    if (shown.length) {
      shown.forEach(function (a) {
        list.appendChild(el('li', { attrs: { role: 'listitem' } }, [buildCard(a, ymd)]));
      });
    } else {
      list.appendChild(el('li', { attrs: { role: 'listitem' } }, [
        el('p', { cls: 'ac-u-muted',
                  text: all.length ? 'Everything on this day is hidden by your filters.'
                                   : 'Nothing scheduled for ' + fmt.cohortLabel(state.cohortKey) +
                                     ' on this day.' })
      ]));
    }
    body.appendChild(list);

    /* Hidden entries are one tap away and dimmed, never silently absent. */
    var showHidden = el('button', { cls: 'ac-btn ac-btn--link',
      text: 'Show ' + hidden + ' hidden by filters',
      attrs: { type: 'button', 'data-ac-action': 'show-hidden' } });
    showHidden.hidden = hidden <= 0;
    body.appendChild(showHidden);

    var dimmed = el('ul', { cls: 'ac-list ac-list--dimmed', attrs: { role: 'list' } });
    all.filter(function (a) { return !entryVisible(a); }).forEach(function (a) {
      dimmed.appendChild(el('li', { attrs: { role: 'listitem' } }, [buildCard(a, ymd)]));
    });
    dimmed.hidden = true;
    body.appendChild(dimmed);

    body.appendChild(el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: 'THAT WEEK' }));
    body.appendChild(buildWeekStrip(ymd, true));

    var actions = el('footer', { cls: 'ac-drawer__actions' });
    if (env.caps && env.caps.canWrite && isSchool) {
      actions.appendChild(el('button', { cls: 'ac-btn ac-btn--primary', text: 'Add for this day',
        attrs: { type: 'button', 'data-ac-action': 'add-here', 'data-ac-date': ymd } }));
    }
    actions.appendChild(el('button', { cls: 'ac-btn ac-btn--ghost', text: 'Open this week',
      attrs: { type: 'button', 'data-ac-action': 'open-week', 'data-ac-date': ymd } }));

    var sheet = el('aside', {
      id: 'ac-day-sheet', cls: 'ac-drawer ac-drawer--day',
      attrs: { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'ac-day-sheet-title',
               'data-ac-date': ymd, 'data-ac-cohort': state.cohortKey }
    }, [
      el('header', { cls: 'ac-drawer__head' }, [
        el('h2', { id: 'ac-day-sheet-title', cls: 'ac-drawer__title',
                   text: dt.formatHuman(ymd, 'EEEE d MMMM yyyy'), attrs: { tabindex: '-1' } }),
        el('p', { cls: 'ac-drawer__sub', text: fmt.cohortLabel(state.cohortKey) }),
        el('button', { cls: 'ac-drawer__close', text: '×',
          attrs: { type: 'button', 'data-ac-action': 'close-layer', 'aria-label': 'Close' } })
      ]),
      body, actions
    ]);

    openLayer(sheet, 'DAY_SHEET');
  }

  /* ---------- 11.11 Metrics — COMPONENTS.md §12 ---------- */

  function renderMetrics(root) {
    if (!env.metrics) {
      replaceChildrenWith(root, [ skeleton('MONTH') ]);
      var terms = (env.lookups && env.lookups.terms) || [];
      var r = terms.length
        ? { start: terms[0].startDate, end: terms[terms.length - 1].endDate }
        : rangeForView('METRICS', state.anchorDate);
      net.call('apiGetMetrics', { start: r.start, end: r.end, scope: { mode: 'ALL' },
                                  granularity: 'WEEK', gradeTokens: [] },
        function (data) { env.metrics = data; render(); },
        function (err) { replaceChildrenWith($('ac-view-root'),
          [ errorBlock(err.code, 'We couldn’t load the metrics.', err.message,
                       err.code + '/' + ((env.meta && env.meta.requestId) || '')) ]); });
      return;
    }

    var m = env.metrics;
    var wrap = el('div', { id: 'ac-metrics', cls: 'ac-metrics' });

    /* No <h2> here: #ac-view-heading in the shell is the single heading for
       this view, and a second copy printed the same sentence twice. */
    var head = el('div', { cls: 'ac-metrics__head' }, [
      el('p', { cls: 'ac-eyebrow ac-eyebrow--gold',
                text: ((m.range && m.range.label) || 'This year').toUpperCase() +
                      ((m.range && m.range.start)
                        ? ' · ' + dt.formatHuman(m.range.start, 'd MMM') + ' – ' +
                          dt.formatHuman(m.range.end, 'd MMM')
                        : '') })
    ]);
    if (env.caps && env.caps.canExport) {
      head.appendChild(el('button', { cls: 'ac-btn ac-btn--ghost', text: 'Export CSV',
        attrs: { type: 'button', 'data-ac-action': 'export' } }));
    }
    wrap.appendChild(head);

    /* Stat tiles. The ONLY place --aisa-gold is used for a numeral, and only
       at display size. */
    var ch = m.coverageHeadline || {};
    var stats = el('ul', { cls: 'ac-stats', attrs: { role: 'list' } }, [
      statTile('GRADES WITH RECENT ENTRIES', ch.gradesWithRecentEntries,
               ' of ' + ch.gradesTotal, 'in the last 7 days'),
      statTile('EMPTIEST GRADE', ch.minCoveragePct, '%',
               (ch.minCoverageLabel || '') + ' · coverage across the term', 'ALERT'),
      statTile('MEDIAN NOTICE', m.leadTime && m.leadTime.medianDays, ' days',
               'target ' + ((m.leadTime && m.leadTime.targetDays) || '—') + ' days'),
      statTile('DAYS OVER THE LIMIT', m.pressure && m.pressure.daysOverDayLimit, '',
               'across every grade this term')
    ]);
    wrap.appendChild(stats);

    /* Coverage is FIRST: an empty grade is the thing that makes teachers stop
       trusting the tool, so it outranks every other number here. */
    wrap.appendChild(coveragePanel(m));
    wrap.appendChild(warningsPanel(m));
    wrap.appendChild(leadTimePanel(m));

    replaceChildrenWith(root, [wrap]);
  }

  function statTile(eyebrow, num, suffix, sub, tone) {
    var numEl = el('p', { cls: 'ac-stat__num' }, [
      document.createTextNode(num === null || num === undefined ? '—' : String(num)),
      suffix ? el('span', { cls: 'ac-stat__of', text: suffix }) : null
    ]);
    return el('li', { cls: 'ac-stat', attrs: { role: 'listitem', 'data-ac-tone': tone || null } }, [
      el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: eyebrow }),
      numEl,
      el('p', { cls: 'ac-stat__sub', text: sub })
    ]);
  }

  function coveragePanel(m) {
    var rows = m.coverage || [];
    var tbody = el('tbody');
    rows.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (r) {
        var bar = el('span', { cls: 'ac-bar', attrs: { role: 'img',
                               'aria-label': r.coveragePct + ' percent' } });
        var fill = el('i');
        /* The one inline style JsApp is permitted, per COMPONENTS.md §17. */
        fill.style.width = Math.max(0, Math.min(100, r.coveragePct)) + '%';
        bar.appendChild(fill);
        tbody.appendChild(el('tr', { attrs: { 'data-ac-status': r.status } }, [
          el('th', { text: r.label, attrs: { scope: 'row' } }),
          el('td', { text: String(r.entries) }),
          el('td', { text: r.weeksWithAtLeastOneEntry + ' / ' + r.weeksInRange }),
          el('td', {}, [bar, el('span', { cls: 'ac-bar__num', text: r.coveragePct + '%' })]),
          el('td', { text: String(r.activeTeachers) }),
          el('td', { text: r.lastEntryDate ? dt.formatHuman(r.lastEntryDate, 'd MMM') : '—' }),
          el('td', {}, [ el('span', { cls: 'ac-pill ' + (r.status === 'HEALTHY' ? 'ac-pill--ok' : ''),
                                      text: titleCase(r.status) }) ])
        ]));
      });

    var table = el('table', { cls: 'ac-table' }, [
      el('thead', {}, [ el('tr', {}, ['Grade', 'Entries', 'Weeks covered', 'Coverage',
                                      'Teachers', 'Last entry', 'Status'].map(function (h) {
        return el('th', { text: h, attrs: { scope: 'col' } });
      })) ]),
      tbody
    ]);

    var ch = m.coverageHeadline || {};
    return el('section', { cls: 'ac-card-panel', attrs: { 'aria-labelledby': 'ac-m-coverage' } }, [
      el('h3', { id: 'ac-m-coverage', cls: 'ac-panel__title', text: 'Coverage by grade' }),
      el('p', { cls: 'ac-panel__lede',
                text: ch.gradesWithRecentEntries + ' of ' + ch.gradesTotal +
                      ' grades have entries in the last 7 days.' }),
      el('div', { cls: 'ac-tablewrap' }, [table])
    ]);
  }

  function warningsPanel(m) {
    var w = m.warningOutcomes || {};
    return el('section', { cls: 'ac-card-panel', attrs: { 'aria-labelledby': 'ac-m-warnings' } }, [
      el('h3', { id: 'ac-m-warnings', cls: 'ac-panel__title',
                 text: 'Warnings, and what happened next' }),
      el('ul', { cls: 'ac-stats ac-stats--inline', attrs: { role: 'list' } }, [
        miniStat(w.warned, 'warned'),
        miniStat(w.movedAfterWarning, 'moved after a warning'),
        miniStat(w.savedDespiteWarning, 'saved anyway')
      ]),
      /* Mandatory wherever a number is a proxy. A dashboard reporting only
         "clashes avoided" is propaganda; avoided alongside "saved anyway" is a
         management conversation. */
      el('p', { cls: 'ac-panel__note', text: (m.meta && m.meta.note) ||
        '“Moved after warning” counts checks that warned and were followed within 60 ' +
        'minutes by a save of the same proposal on a different date. It is a proxy for clashes ' +
        'avoided, not a census.' })
    ]);
  }

  function leadTimePanel(m) {
    var lt = m.leadTime || {};
    var buckets = lt.buckets || [];
    var max = buckets.reduce(function (acc, b) { return Math.max(acc, b.count); }, 1);
    var tbody = el('tbody');
    buckets.forEach(function (b) {
      var bar = el('span', { cls: 'ac-bar', attrs: { role: 'img',
                             'aria-label': b.count + ' assessments' } });
      var fill = el('i');
      fill.style.width = Math.round((b.count / max) * 100) + '%';
      bar.appendChild(fill);
      tbody.appendChild(el('tr', {}, [
        el('th', { text: b.label, attrs: { scope: 'row' } }),
        el('td', {}, [bar, el('span', { cls: 'ac-bar__num', text: String(b.count) })])
      ]));
    });
    return el('section', { cls: 'ac-card-panel', attrs: { 'aria-labelledby': 'ac-m-lead' } }, [
      el('h3', { id: 'ac-m-lead', cls: 'ac-panel__title', text: 'How much notice students get' }),
      el('p', { cls: 'ac-panel__lede',
                text: 'Median ' + (lt.medianDays === undefined ? '—' : lt.medianDays) +
                      ' days between an entry being added and the assessment happening.' }),
      el('div', { cls: 'ac-tablewrap' }, [ el('table', { cls: 'ac-table' }, [
        el('thead', {}, [ el('tr', {}, [ el('th', { text: 'Notice given', attrs: { scope: 'col' } }),
                                         el('th', { text: 'Assessments', attrs: { scope: 'col' } }) ]) ]),
        tbody ]) ])
    ]);
  }

  function miniStat(n, label) {
    return el('li', { cls: 'ac-stat', attrs: { role: 'listitem' } }, [
      el('p', { cls: 'ac-stat__num', text: (n === null || n === undefined) ? '—' : String(n) }),
      el('p', { cls: 'ac-stat__sub', text: label })
    ]);
  }

  function titleCase(s) {
    s = String(s || '');
    return s.charAt(0) + s.slice(1).toLowerCase();
  }

  /* ==========================================================================
     12. THE BOOKING FLOW — COMPONENTS.md §10
     This flow IS the product. Everything else is scaffolding around it.

     The shape of it: choose cohort and date FIRST, see that cohort's existing
     day and week load BEFORE being asked for a single other field, then decide.
     A form that collects a title, a type and a subject before telling you the
     day is full has wasted the teacher's time and taught them nothing.
     ========================================================================== */

  function openBooking(opts) {
    opts = opts || {};
    var sel = parseCohort(state.cohortKey);
    var d = opts.date || state.selection.dayDate || dt.today();

    env.booking = {
      mode: opts.mode || 'CREATE',
      step: 1,
      id: opts.id || null,
      expectedVersion: opts.expectedVersion || null,
      dirty: false,
      saving: false,
      evaluation: null,
      evaluating: false,
      clientRequestId: newRequestId(),
      draft: assign({
        id: opts.id || null,
        title: '',
        typeId: defaultTypeId(),
        subjectId: '',
        grades: sel.grade ? [sel.grade] : [],
        sections: sel.section ? [sel.section] : [],
        startDate: d,
        endDate: d,
        durationMinutes: null,
        periodOrBlock: null,
        notes: '',
        teacherName: (env.user && env.user.displayName) || '',
        teacherEmail: (env.user && env.user.email) || null
      }, opts.draft || {})
    };

    renderBookingDrawer();
    scheduleEvaluate();
  }

  function newRequestId() {
    /* An idempotency key. Math.random is fine here — it never touches a date
       and a collision would only mean one save is treated as a duplicate. */
    return 'idm_' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
  }

  function defaultTypeId() {
    var types = (env.lookups && env.lookups.types) || [];
    for (var i = 0; i < types.length; i++) if (types[i].countsTowardLoad) return types[i].code;
    return types.length ? types[0].code : '';
  }

  function renderBookingDrawer() {
    var b = env.booking;
    if (!b) return;

    var existing = $('ac-booking');
    var hadFocusId = document.activeElement && document.activeElement.id;
    var scrollTop = existing ? (existing.querySelector('.ac-form') || {}).scrollTop : 0;

    var drawer = el('aside', {
      id: 'ac-booking', cls: 'ac-drawer ac-drawer--booking',
      attrs: { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'ac-booking-title',
               'data-ac-step': String(b.step), 'data-ac-mode': b.mode }
    });

    drawer.appendChild(el('header', { cls: 'ac-drawer__head' }, [
      el('p', { cls: 'ac-eyebrow ac-eyebrow--gold',
                text: b.mode === 'EDIT' ? 'EDIT ASSESSMENT' : 'NEW ASSESSMENT' }),
      el('h2', { id: 'ac-booking-title', cls: 'ac-drawer__title', attrs: { tabindex: '-1' },
                 text: b.mode === 'EDIT' ? 'Edit this assessment' : 'Add an assessment' }),
      el('button', { cls: 'ac-drawer__close', text: '×',
        attrs: { type: 'button', 'data-ac-action': 'close-layer', 'aria-label': 'Close' } })
    ]));

    drawer.appendChild(buildContextBar());
    drawer.appendChild(buildSteps());
    drawer.appendChild(buildBookingForm());
    drawer.appendChild(buildBookingActions());

    if (existing) {
      existing.parentNode.replaceChild(drawer, existing);
      if (hadFocusId) { var again = $(hadFocusId); if (again) again.focus(); }
      var form = drawer.querySelector('.ac-form');
      if (form && scrollTop) form.scrollTop = scrollTop;
    } else {
      openLayer(drawer, 'BOOKING');
    }
  }

  /* The sticky context bar. Present at every step and every breakpoint — the
     chosen cohort, date and resulting load are never scrolled away, because on
     a phone the form is long and the whole point is the load. */
  function buildContextBar() {
    var b = env.booking;
    var ev = b.evaluation;
    var level = ev ? ev.severity : 'NONE';
    var loadText = 'checking…';

    if (ev && ev.cohorts && ev.cohorts.length) {
      var c0 = ev.cohorts[0];
      var day = c0.days && c0.days[0];
      var wk = c0.week && c0.week.projected;
      if (day && day.projected) {
        /* Say what the DAY would be, in the day's own words, then name the week
           separately when the week is the thing that is over. Collapsing the two
           into one severity produced "would be 1 — over limit" on a day that was
           actually at the limit, not over it. */
        loadText = 'would be ' + day.projected.counted + ' that day · ' +
                   fmt.levelWord(day.projected.level).toLowerCase();
        if (wk && wk.level === 'OVER') {
          loadText += ' · ' + wk.counted + ' that week, over the limit';
        }
      }
    }

    return el('div', { cls: 'ac-context-bar',
      attrs: { 'data-ac-level': level, 'aria-live': 'off' } }, [
      el('span', { cls: 'ac-context-bar__cohort', text: bookingCohortLabel() }),
      el('span', { cls: 'ac-context-bar__date',
                   text: b.draft.startDate ? dt.formatHuman(b.draft.startDate, 'EEE d MMM')
                                           : 'No date yet' }),
      el('span', { cls: 'ac-context-bar__load', text: loadText })
    ]);
  }

  function bookingCohortLabel() {
    var d = env.booking.draft;
    if (d.sections && d.sections.length) {
      return d.sections.map(function (s) { return s.replace('-', ''); }).join(', ');
    }
    if (d.grades && d.grades.length) {
      return d.grades.map(function (g) { return g === 'K' ? 'Kindergarten' : 'Grade ' + g; }).join(', ');
    }
    return 'No cohort yet';
  }

  function buildSteps() {
    var b = env.booking;
    var labels = ['1 · Cohort and date', '2 · Details', '3 · Review'];
    var ol = el('ol', { cls: 'ac-steps', attrs: { 'aria-label': 'Steps' } });
    labels.forEach(function (t, i) {
      var n = i + 1;
      ol.appendChild(el('li', {
        cls: 'ac-steps__item' + (b.step === n ? ' is-current' : ''),
        text: t,
        attrs: { 'aria-current': b.step === n ? 'step' : null,
                 'data-ac-action': 'goto-step', 'data-ac-value': String(n) }
      }));
    });
    return ol;
  }

  function buildBookingForm() {
    var b = env.booking;
    var form = el('form', { id: 'ac-booking-form', cls: 'ac-form', attrs: { novalidate: true } });

    var errs = el('div', { id: 'ac-booking-errors', cls: 'ac-form__errors',
                           attrs: { role: 'alert' }, hidden: true });
    form.appendChild(errs);

    form.appendChild(buildStep1());
    form.appendChild(buildStep2());
    form.appendChild(buildStep3());
    return form;
  }

  /* ---------- Step 1: cohort and date, then the collision readout ---------- */

  function buildStep1() {
    var b = env.booking;
    var fs = el('fieldset', { cls: 'ac-form__step', attrs: { 'data-ac-step': '1' } });
    fs.hidden = b.step !== 1;
    fs.appendChild(el('legend', { cls: 'ac-u-visually-hidden', text: 'Cohort and date' }));

    /* Grades */
    var active = (env.config && env.config.activeDivisions) || ['ES', 'MS', 'HS'];
    var grades = ((env.lookups && env.lookups.grades) || [])
      .filter(function (g) { return g.active !== false && active.indexOf(g.division) >= 0; })
      .sort(function (a, c) { return fmt.gradeRank(a.token) - fmt.gradeRank(c.token); });

    var gradeTokens = el('div', { cls: 'ac-tokens',
      attrs: { role: 'group', 'aria-labelledby': 'ac-f-grades-lbl' } });
    grades.forEach(function (g) {
      var on = b.draft.grades.indexOf(g.token) >= 0;
      gradeTokens.appendChild(el('button', {
        cls: 'ac-token', text: g.token,
        attrs: { type: 'button', 'aria-pressed': on ? 'true' : 'false',
                 'data-ac-action': 'toggle-grade', 'data-ac-value': g.token,
                 'aria-label': g.label || ('Grade ' + g.token) }
      }));
    });
    fs.appendChild(el('div', { cls: 'ac-field' }, [
      el('span', { cls: 'ac-field__label', id: 'ac-f-grades-lbl', text: 'Grade(s)' }),
      gradeTokens
    ]));

    /* Sections — shown when the selected grade's division schedules by section,
       or that grade simply has sections defined. */
    var secWrap = el('div', { cls: 'ac-field', id: 'ac-f-sections-wrap' });
    var relevantSections = sectionsForDraft();
    if (relevantSections.length) {
      secWrap.hidden = false;
      var note = sectionExplainer();
      secWrap.appendChild(el('span', { cls: 'ac-field__label', id: 'ac-f-sections-lbl',
                                       text: 'Section(s)' }));
      if (note) secWrap.appendChild(el('p', { cls: 'ac-field__hint', text: note }));
      var secTokens = el('div', { cls: 'ac-tokens',
        attrs: { role: 'group', 'aria-labelledby': 'ac-f-sections-lbl' } });
      var wholeOn = !b.draft.sections.length;
      secTokens.appendChild(el('button', {
        cls: 'ac-token ac-token--wide', text: 'Whole grade',
        attrs: { type: 'button', 'aria-pressed': wholeOn ? 'true' : 'false',
                 'data-ac-action': 'toggle-section', 'data-ac-value': '' }
      }));
      relevantSections.forEach(function (s) {
        var on = b.draft.sections.indexOf(s.id) >= 0;
        secTokens.appendChild(el('button', {
          cls: 'ac-token', text: compactSectionLabel(s),
          attrs: { type: 'button', 'aria-pressed': on ? 'true' : 'false',
                   'data-ac-action': 'toggle-section', 'data-ac-value': s.id,
                   'aria-label': s.label || s.id }
        }));
      });
      secWrap.appendChild(secTokens);
    } else {
      secWrap.hidden = true;
    }
    fs.appendChild(secWrap);

    /* Start date */
    fs.appendChild(el('div', { cls: 'ac-field' }, [
      el('label', { cls: 'ac-field__label', text: 'Start date', attrs: { 'for': 'ac-f-start' } }),
      el('input', { id: 'ac-f-start', cls: 'ac-input',
        attrs: { type: 'date', name: 'startDate', required: true,
                 value: b.draft.startDate || '',
                 'data-ac-action': 'change-date',
                 'aria-describedby': 'ac-f-start-hint' } }),
      el('p', { cls: 'ac-field__hint', id: 'ac-f-start-hint',
                text: 'School days are Monday to Friday.' })
    ]));

    /* Multi-day */
    var multiOn = b.draft.endDate && b.draft.endDate !== b.draft.startDate;
    var cb = el('input', { id: 'ac-f-multiday', cls: 'ac-checkbox',
      attrs: { type: 'checkbox', 'data-ac-action': 'toggle-multiday' } });
    if (multiOn) cb.setAttribute('checked', 'checked');
    fs.appendChild(el('div', { cls: 'ac-field ac-field--inline' }, [
      cb,
      el('label', { cls: 'ac-field__label', text: 'Runs over more than one day',
                    attrs: { 'for': 'ac-f-multiday' } })
    ]));

    var endWrap = el('div', { cls: 'ac-field', id: 'ac-f-end-wrap' }, [
      el('label', { cls: 'ac-field__label', text: 'End date', attrs: { 'for': 'ac-f-end' } }),
      el('input', { id: 'ac-f-end', cls: 'ac-input',
        attrs: { type: 'date', name: 'endDate', value: b.draft.endDate || '',
                 'data-ac-action': 'change-date' } })
    ]);
    endWrap.hidden = !multiOn;
    fs.appendChild(endWrap);

    /* THE COLLISION READOUT — occupies the rest of the step the instant a
       cohort and a start date both exist, before any other field is asked for. */
    fs.appendChild(buildEvalPanel('ac-eval-panel'));
    return fs;
  }

  function sectionsForDraft() {
    var b = env.booking;
    var out = [];
    (b.draft.grades || []).forEach(function (g) {
      ((env.lookups && env.lookups.sections) || [])
        .filter(function (s) { return s.grade === g && s.active !== false; })
        .forEach(function (s) { out.push(s); });
    });
    return out.sort(function (a, c) { return (a.sortOrder || 0) - (c.sortOrder || 0); });
  }

  function sectionExplainer() {
    var b = env.booking;
    var top = (b.draft.grades || []).map(fmt.gradeRank).reduce(function (a, c) {
      return Math.max(a, c); }, -1);
    if (top >= 9) {
      return 'Grade ' + top + ' students take different option blocks. Choosing sections ' +
             'shows what one class actually has.';
    }
    return null;
  }

  /* ---------- Step 2: the details ---------- */

  function buildStep2() {
    var b = env.booking;
    var fs = el('fieldset', { cls: 'ac-form__step', attrs: { 'data-ac-step': '2' } });
    fs.hidden = b.step !== 2;
    fs.appendChild(el('legend', { cls: 'ac-u-visually-hidden', text: 'Details' }));

    var maxTitle = (env.config && env.config.maxTitleLen) || 120;
    fs.appendChild(el('div', { cls: 'ac-field' }, [
      el('label', { cls: 'ac-field__label', text: 'Title', attrs: { 'for': 'ac-f-title' } }),
      el('input', { id: 'ac-f-title', cls: 'ac-input',
        attrs: { type: 'text', name: 'title', required: true, minlength: '3',
                 maxlength: String(maxTitle), value: b.draft.title || '',
                 'data-ac-action': 'change-field', 'data-ac-field': 'title',
                 'aria-describedby': 'ac-f-title-count' } }),
      el('p', { cls: 'ac-field__count', id: 'ac-f-title-count',
                text: (b.draft.title || '').length + ' of ' + maxTitle })
    ]));

    /* The type select teaches the policy while it is used: every option says
       whether it counts toward load. */
    var typeSel = el('select', { id: 'ac-f-type', cls: 'ac-select',
      attrs: { name: 'typeId', required: true, 'data-ac-action': 'change-type',
               'aria-describedby': 'ac-f-type-hint' } });
    ((env.lookups && env.lookups.types) || []).forEach(function (t) {
      if (t.active === false) return;
      var o = el('option', { text: t.label + (t.countsTowardLoad ? ' — counts toward load'
                                                                : ' — not counted'),
        attrs: { value: t.code, 'data-ac-counts': t.countsTowardLoad ? 'true' : 'false' } });
      if (t.code === b.draft.typeId) o.setAttribute('selected', 'selected');
      typeSel.appendChild(o);
    });
    var selType = fmt.findType(b.draft.typeId);
    fs.appendChild(el('div', { cls: 'ac-field' }, [
      el('label', { cls: 'ac-field__label', text: 'Assessment type',
                    attrs: { 'for': 'ac-f-type' } }),
      typeSel,
      el('p', { cls: 'ac-field__hint', id: 'ac-f-type-hint',
                text: (selType && selType.description) || '' })
    ]));

    var subjSel = el('select', { id: 'ac-f-subject', cls: 'ac-select',
      attrs: { name: 'subjectId', required: true,
               'data-ac-action': 'change-field', 'data-ac-field': 'subjectId' } });
    subjSel.appendChild(el('option', { text: 'Choose a subject…', attrs: { value: '' } }));
    ((env.lookups && env.lookups.subjects) || []).forEach(function (s) {
      if (s.active === false) return;
      var o = el('option', { text: s.label, attrs: { value: s.code } });
      if (s.code === b.draft.subjectId) o.setAttribute('selected', 'selected');
      subjSel.appendChild(o);
    });
    fs.appendChild(el('div', { cls: 'ac-field' }, [
      el('label', { cls: 'ac-field__label', text: 'Subject', attrs: { 'for': 'ac-f-subject' } }),
      subjSel
    ]));

    fs.appendChild(el('div', { cls: 'ac-field' }, [
      el('label', { cls: 'ac-field__label', text: 'Duration in minutes',
                    attrs: { 'for': 'ac-f-duration' } }),
      el('input', { id: 'ac-f-duration', cls: 'ac-input ac-input--num',
        attrs: { type: 'number', name: 'durationMinutes', min: '5', max: '480',
                 inputmode: 'numeric', value: b.draft.durationMinutes || '',
                 'data-ac-action': 'change-field', 'data-ac-field': 'durationMinutes' } })
    ]));

    var maxNotes = (env.config && env.config.maxNotesLen) || 1000;
    /* The no-student-names hint is MANDATORY and PERMANENT. Free text is the
       only realistic path by which student data could enter this system. */
    fs.appendChild(el('div', { cls: 'ac-field' }, [
      el('label', { cls: 'ac-field__label', text: 'Notes', attrs: { 'for': 'ac-f-notes' } }),
      el('textarea', { id: 'ac-f-notes', cls: 'ac-textarea', text: b.draft.notes || '',
        attrs: { name: 'notes', maxlength: String(maxNotes),
                 'data-ac-action': 'change-field', 'data-ac-field': 'notes',
                 'aria-describedby': 'ac-f-notes-hint' } }),
      el('p', { cls: 'ac-field__hint ac-field__hint--strong', id: 'ac-f-notes-hint',
                text: (env.config && env.config.notesHintText) ||
                      'Logistics only — no student names.' })
    ]));

    var canOnBehalf = env.caps && env.caps.canEnterOnBehalf;
    if (canOnBehalf) {
      var tsel = el('select', { id: 'ac-f-teacher', cls: 'ac-select',
        attrs: { name: 'teacherEmail', 'data-ac-action': 'change-field',
                 'data-ac-field': 'teacherEmail' } });
      ((env.lookups && env.lookups.teachers) || []).forEach(function (t) {
        var o = el('option', { text: t.displayName, attrs: { value: t.email } });
        if (t.email === b.draft.teacherEmail) o.setAttribute('selected', 'selected');
        tsel.appendChild(o);
      });
      fs.appendChild(el('div', { cls: 'ac-field' }, [
        el('label', { cls: 'ac-field__label', text: 'Teacher', attrs: { 'for': 'ac-f-teacher' } }),
        tsel,
        el('p', { cls: 'ac-field__hint', id: 'ac-f-teacher-hint',
                  text: 'You can enter this on behalf of another teacher.' })
      ]));
    } else {
      fs.appendChild(el('div', { cls: 'ac-field' }, [
        el('label', { cls: 'ac-field__label', text: 'Teacher', attrs: { 'for': 'ac-f-teacher' } }),
        el('input', { id: 'ac-f-teacher', cls: 'ac-input',
          attrs: { readonly: true, value: b.draft.teacherName || '',
                   'aria-describedby': 'ac-f-teacher-hint' } }),
        el('p', { cls: 'ac-field__hint', id: 'ac-f-teacher-hint', text: 'This is your entry.' })
      ]));
    }
    return fs;
  }

  /* ---------- Step 3: review, and the override reason when one is required ---------- */

  function buildStep3() {
    var b = env.booking;
    var fs = el('fieldset', { cls: 'ac-form__step', attrs: { 'data-ac-step': '3' } });
    fs.hidden = b.step !== 3;
    fs.appendChild(el('legend', { cls: 'ac-u-visually-hidden', text: 'Review' }));

    var d = b.draft;
    var type = fmt.findType(d.typeId);
    var subj = fmt.findSubject(d.subjectId);
    var rows = [
      ['Cohort', bookingCohortLabel()],
      ['Date', d.startDate ? (dt.formatHuman(d.startDate, 'EEEE d MMMM yyyy') +
        (d.endDate && d.endDate !== d.startDate
          ? ' – ' + dt.formatHuman(d.endDate, 'EEEE d MMMM yyyy') : '')) : '—'],
      ['Title', d.title || '—'],
      ['Type', type ? type.label : d.typeId],
      ['Subject', subj ? subj.label : d.subjectId],
      ['Duration', d.durationMinutes ? d.durationMinutes + ' minutes' : '—'],
      ['Teacher', d.teacherName || '—']
    ];
    var dl = el('dl', { cls: 'ac-difflist' });
    rows.forEach(function (r) {
      dl.appendChild(el('dt', { text: r[0] }));
      dl.appendChild(el('dd', { text: r[1] }));
    });
    fs.appendChild(el('div', { cls: 'ac-summary' }, [dl]));

    fs.appendChild(buildEvalPanel('ac-eval-panel-final'));

    var ev = b.evaluation;
    var needsReason = !!(ev && ev.requiresOverrideReason && ev.verdict === 'WARN');
    var minChars = (ev && ev.overrideReasonMinChars) || 10;
    var reasonWrap = el('div', { cls: 'ac-field', id: 'ac-f-reason-wrap' }, [
      el('label', { cls: 'ac-field__label', text: 'Reason for scheduling anyway',
                    attrs: { 'for': 'ac-f-reason' } }),
      el('textarea', { id: 'ac-f-reason', cls: 'ac-textarea', text: b.overrideReason || '',
        attrs: { name: 'overrideReason', minlength: String(minChars),
                 'data-ac-action': 'change-field', 'data-ac-field': 'overrideReason',
                 'aria-describedby': 'ac-f-reason-hint' } }),
      el('p', { cls: 'ac-field__hint', id: 'ac-f-reason-hint',
                text: 'At least ' + minChars + ' characters. This is stored and reviewed with ' +
                      ((env.config && env.config.supportLabel) || 'Teaching & Learning') + '.' })
    ]);
    reasonWrap.hidden = !needsReason;
    fs.appendChild(reasonWrap);
    return fs;
  }

  /* ---------- The action row ---------- */

  function buildBookingActions() {
    var b = env.booking;
    var ev = b.evaluation;
    var verdict = ev ? ev.verdict : null;
    var footer = el('footer', { cls: 'ac-drawer__actions' });

    /* The discard question, asked here rather than in a native modal. */
    if (b.confirmDiscard) {
      footer.appendChild(el('p', { cls: 'ac-field__hint ac-field__hint--strong',
        text: 'Discard this assessment? Nothing has been saved yet.' }));
      footer.appendChild(el('button', { cls: 'ac-btn ac-btn--primary', text: 'Discard it',
        attrs: { type: 'button', 'data-ac-action': 'discard-confirm' } }));
      footer.appendChild(el('button', { cls: 'ac-btn ac-btn--secondary', text: 'Keep editing',
        attrs: { type: 'button', 'data-ac-action': 'discard-cancel' } }));
      return footer;
    }

    if (b.step < 3) {
      footer.appendChild(el('button', { cls: 'ac-btn ac-btn--primary', text: 'Continue',
        attrs: { type: 'button', 'data-ac-action': 'continue' } }));
    } else {
      var label = b.saving ? 'Saving…'
                : verdict === 'WARN' ? 'Save anyway'
                : verdict === 'BLOCK' ? 'Save'
                : (b.mode === 'EDIT' ? 'Save changes' : 'Save assessment');
      var blocked = verdict === 'BLOCK' || b.saving || state.ui.offline;

      var save = el('button', {
        cls: 'ac-btn ac-btn--primary' + (b.saving ? ' is-loading' : ''),
        text: state.ui.offline ? 'Waiting for connection…' : label,
        attrs: { type: 'button', 'data-ac-action': 'save',
                 /* aria-disabled, NOT disabled: the control stays focusable so a
                    screen-reader user lands on it and hears why, instead of
                    tabbing past a dead button. */
                 'aria-disabled': blocked ? 'true' : 'false',
                 'aria-describedby': blocked ? 'ac-save-why' : null }
      });
      footer.appendChild(save);

      /* On WARN, "Change the date" is a VISUALLY EQUAL secondary, not a
         de-emphasised link. The whole tool exists to make moving the date the
         easy option. */
      if (verdict === 'WARN' || verdict === 'BLOCK') {
        footer.appendChild(el('button', { cls: 'ac-btn ac-btn--secondary', text: 'Change the date',
          attrs: { type: 'button', 'data-ac-action': 'goto-step', 'data-ac-value': '1' } }));
      }

      if (blocked) {
        var why = state.ui.offline
          ? 'You’re offline. Nothing is queued — when you reconnect this will be ' +
            're-checked against the latest calendar before it saves.'
          : (verdict === 'BLOCK'
              ? 'This date is blocked by an assessment policy. Change the date, or ask ' +
                ((env.config && env.config.supportLabel) || 'Teaching & Learning') + ' for an exception.'
              : 'Saving…');
        footer.appendChild(el('p', { id: 'ac-save-why', cls: 'ac-field__hint', text: why }));

        if (verdict === 'BLOCK' && !state.ui.offline) {
          if (ev && ev.canRequestApproval) {
            footer.appendChild(el('button', { cls: 'ac-btn ac-btn--secondary',
              text: 'Request approval instead',
              attrs: { type: 'button', 'data-ac-action': 'request-approval' } }));
          }
          var c = env.config || {};
          if (c.supportEmail) {
            footer.appendChild(el('a', { cls: 'ac-btn ac-btn--ghost',
              text: 'Email ' + (c.supportLabel || 'T&L') + ' to request an exception',
              attrs: { href: exceptionMailto() } }));
          }
        }
      }
    }

    footer.appendChild(el('button', { cls: 'ac-btn ac-btn--ghost', text: 'Cancel',
      attrs: { type: 'button', 'data-ac-action': 'close-layer' } }));
    return footer;
  }

  /* The exception request carries cohort, date and finding codes — and NO
     student data, the same constraint as everything else in this system. */
  function exceptionMailto() {
    var b = env.booking, ev = b.evaluation, c = env.config || {};
    var codes = ev && ev.findings ? ev.findings.map(function (f) { return f.ruleId; }).join(', ') : '';
    var body = 'Requesting an exception for:\n\n' +
      'Cohort: ' + bookingCohortLabel() + '\n' +
      'Date: ' + (b.draft.startDate ? dt.formatHuman(b.draft.startDate, 'EEEE d MMMM yyyy') : '') + '\n' +
      'Type: ' + (b.draft.typeId || '') + '\n' +
      'Rules triggered: ' + codes + '\n\nReason:\n';
    return 'mailto:' + encodeURIComponent(c.supportEmail) +
           '?subject=' + encodeURIComponent('Assessment calendar — exception request') +
           '&body=' + encodeURIComponent(body);
  }

  /* ==========================================================================
     13. THE EVALUATION PANEL — COMPONENTS.md §11
     Must be readable in under ten seconds, in exactly this vertical order:
       severity chip -> headline -> day strip -> week meter -> what is already
       booked -> next steps -> secondary findings.
     ========================================================================== */

  function buildEvalPanel(id) {
    var b = env.booking;
    var ev = b.evaluation;

    var panel = el('div', { id: id, cls: 'ac-eval' + (b.evaluating && !ev ? ' is-loading' : ''),
      attrs: { 'aria-live': 'polite', 'aria-atomic': 'true',
               'data-ac-verdict': ev ? ev.verdict : null,
               'data-ac-level': ev ? ev.severity : null } });

    if (!b.draft.startDate || !(b.draft.grades || []).length) {
      panel.appendChild(el('p', { cls: 'ac-u-muted',
        text: 'Choose a grade and a date to see what those students already have.' }));
      return panel;
    }

    if (!ev) {
      panel.appendChild(el('p', { cls: 'ac-u-muted', text: 'Checking that day…' }));
      return panel;
    }

    /* While a re-check is in flight the PREVIOUS result stays visible and
       dimmed. The panel never blanks — a blank panel reads as "all clear". */
    if (b.evaluating) panel.classList.add('is-dimmed');

    var c0 = (ev.cohorts && ev.cohorts[0]) || null;
    var primary = (ev.findings && ev.primaryFindingIndex >= 0)
      ? ev.findings[ev.primaryFindingIndex] : null;

    /* 1. Severity chip */
    panel.appendChild(el('p', { cls: 'ac-eval__chip', attrs: { 'data-ac-level': ev.severity } }, [
      el('span', { cls: 'ac-eval__glyph', text: ev.verdict === 'OK' ? '○'
                                                : fmt.levelGlyph(ev.severity),
                   attrs: { 'aria-hidden': 'true' } }),
      el('span', { cls: 'ac-eval__word',
                   text: ev.verdict === 'OK' ? 'Clear' : fmt.levelWord(ev.severity) })
    ]));

    /* 2. Headline */
    if (primary && primary.message) {
      panel.appendChild(el('h3', { cls: 'ac-eval__headline', text: primary.message.headline }));
      if (primary.message.detail) {
        panel.appendChild(el('p', { cls: 'ac-eval__detail', text: primary.message.detail }));
      }
    } else {
      panel.appendChild(el('h3', { cls: 'ac-eval__headline',
        text: 'Nothing else is scheduled for ' + bookingCohortLabel() + ' that day.' }));
    }

    /* 3. The day strip — the single most useful object on the screen. It
          answers "then when?" without another click. */
    if (c0 && c0.week && c0.week.dayStrip) {
      panel.appendChild(buildDayStrip(c0.week.dayStrip));
    }

    /* 4. Week meter */
    if (c0 && c0.week) {
      panel.appendChild(buildEvalWeek(c0.week));
    }

    /* 5. What is already booked that day */
    var day0 = c0 && c0.days && c0.days[0];
    if (day0 && day0.existing && day0.existing.length) {
      panel.appendChild(el('p', { cls: 'ac-eyebrow ac-eyebrow--muted',
                                  text: 'ALREADY SCHEDULED THAT DAY' }));
      var ul = el('ul', { cls: 'ac-list ac-list--compact', attrs: { role: 'list' } });
      day0.existing.forEach(function (e) {
        ul.appendChild(el('li', { attrs: { role: 'listitem' } }, [
          el('span', { cls: 'ac-chip__badge', text: e.typeShortCode || '?',
                       attrs: { 'data-ac-color': e.typeColorToken || 'type-other',
                                'aria-hidden': 'true' } }),
          el('span', { cls: 'ac-chip__title',
                       text: e.title + ' — ' + (e.subjectLabel || e.subjectId) +
                             (e.teacherName ? ', ' + e.teacherName : '') })
        ]));
      });
      panel.appendChild(ul);
    }

    /* 6. Next steps. Date suggestions are REAL BUTTONS that rewrite the form
          and re-check — the fastest possible path to a better date. */
    var steps = [];
    (ev.suggestions || []).forEach(function (s) {
      steps.push(el('li', {}, [
        el('button', { cls: 'ac-btn ac-btn--suggest', text: s.label || ('Use ' +
            dt.formatHuman(s.startDate, 'EEE d MMM')),
          attrs: { type: 'button', 'data-ac-action': 'use-date',
                   'data-ac-date': s.startDate } })
      ]));
    });
    if (primary && primary.message && primary.message.steps) {
      primary.message.steps.forEach(function (t) {
        /* A suggestion already rendered as a button is not repeated as text. */
        if ((ev.suggestions || []).some(function (s) { return s.label === t; })) return;
        steps.push(el('li', { cls: 'ac-eval__step-text', text: t }));
      });
    }
    if (steps.length) {
      panel.appendChild(el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: 'QUIETER NEARBY' }));
      panel.appendChild(el('ul', { cls: 'ac-eval__steps', attrs: { role: 'list' } }, steps));
    }

    /* 7. Secondary findings — two in full, the rest collapsed. */
    var others = (ev.findings || []).filter(function (f, i) { return i !== ev.primaryFindingIndex; });
    if (others.length) {
      var list = el('ul', { cls: 'ac-eval__findings', attrs: { role: 'list' } });
      others.slice(0, b.findingsExpanded ? others.length : 2).forEach(function (f) {
        list.appendChild(el('li', { cls: 'ac-finding',
          attrs: { 'data-ac-rule': f.ruleId, 'data-ac-enforcement': f.enforcement } }, [
          el('span', { cls: 'ac-finding__glyph', text: f.enforcement === 'BLOCK' ? '▲' : '◐',
                       attrs: { 'aria-hidden': 'true' } }),
          el('p', { cls: 'ac-finding__headline', text: f.message ? f.message.headline : f.ruleId }),
          f.message && f.message.detail
            ? el('p', { cls: 'ac-finding__detail', text: f.message.detail }) : null
        ]));
      });
      panel.appendChild(list);
      if (others.length > 2 && !b.findingsExpanded) {
        panel.appendChild(el('button', { cls: 'ac-btn ac-btn--link',
          text: '+' + (others.length - 2) + ' more',
          attrs: { type: 'button', 'data-ac-action': 'expand-findings' } }));
      }
    }

    /* Data gaps are stated plainly rather than silently degrading the answer. */
    (ev.dataGaps || []).forEach(function (g) {
      panel.appendChild(el('p', { cls: 'ac-u-muted', text: g.message }));
    });

    return panel;
  }

  function buildDayStrip(strip) {
    var ol = el('ol', { cls: 'ac-daystrip',
      attrs: { 'aria-label': 'That week for ' + bookingCohortLabel() } });
    strip.forEach(function (d) {
      var closed = d.isSchoolDay === false;
      var li = el('li', {
        cls: 'ac-daystrip__day' + (d.isProposed ? ' is-proposed' : '') +
             (closed ? ' ac-daystrip__day--closed' : ''),
        attrs: { 'data-ac-date': d.date, 'data-ac-level': d.level,
                 'data-ac-daytype': d.dayType || null }
      });

      if (closed) {
        li.appendChild(el('span', {
          attrs: { 'aria-label': dt.formatHuman(d.date, 'EEEE d MMMM') + '. ' +
                                 dayTypeWord(d.dayType) + '. Not a school day.' } }, [
          el('span', { cls: 'ac-daystrip__dow', text: dt.formatHuman(d.date, 'EEE'),
                       attrs: { 'aria-hidden': 'true' } }),
          el('span', { cls: 'ac-daystrip__closed', text: shortDayType(d.dayType),
                       attrs: { 'aria-hidden': 'true' } })
        ]));
      } else {
        li.appendChild(el('button', {
          attrs: { type: 'button', 'data-ac-action': 'use-date', 'data-ac-date': d.date,
                   'aria-label': dt.formatHuman(d.date, 'EEEE d MMMM') + '. ' +
                                 d.counted + ' assessment' + (d.counted === 1 ? '' : 's') + '. ' +
                                 fmt.levelWord(d.level) + '.' +
                                 (d.isProposed ? ' Currently chosen.' : '') } }, [
          el('span', { cls: 'ac-daystrip__dow', text: dt.formatHuman(d.date, 'EEE'),
                       attrs: { 'aria-hidden': 'true' } }),
          el('span', { cls: 'ac-daystrip__glyph', text: fmt.levelGlyph(d.level),
                       attrs: { 'aria-hidden': 'true' } }),
          el('span', { cls: 'ac-daystrip__n', text: String(d.counted),
                       attrs: { 'aria-hidden': 'true' } })
        ]));
      }
      ol.appendChild(li);
    });
    return ol;
  }

  function shortDayType(t) {
    return { PD_DAY: 'PD', HOLIDAY: 'Hol', BREAK: 'Brk', WEEKEND: '—',
             HALF_DAY: '½', EXAM_WINDOW: 'Exam', NO_ASSESSMENT: 'No', TRIP: 'Trip',
             SCHOOL_EVENT: 'Event' }[t] || '—';
  }

  function buildEvalWeek(week) {
    var policyOn = !!(env.config && env.config.policy && env.config.policy.enabled);
    var proj = week.projected || week;
    var cap = policyOn ? week.cap : null;

    var wrap = el('div', { cls: 'ac-eval__week', attrs: { 'data-ac-level': proj.level } });
    wrap.appendChild(el('p', { cls: 'ac-eyebrow ac-eyebrow--muted',
      text: 'THAT WEEK (' + dt.formatHuman(week.weekStartDate, 'd').toUpperCase() + '–' +
            dt.formatHuman(week.weekEndDate, 'd MMM').toUpperCase() + ')' }));
    wrap.appendChild(buildMeter(proj.level, proj.counted, cap, { large: true, visibleText: false }));

    var stat = el('p', { cls: 'ac-eval__weekstat' });
    stat.appendChild(el('span', { cls: 'ac-stat-num', text: String(proj.counted) }));
    stat.appendChild(document.createTextNode(
      (cap || cap === 0) ? (' of ' + cap + ' maximum')
                         : (' assessment' + (proj.counted === 1 ? '' : 's') + ' that week')));
    wrap.appendChild(stat);

    var pro = el('p', { cls: 'ac-eval__proration' });
    if (week.prorated) {
      pro.textContent = 'Short week — ' + week.segmentDays + ' school days, so the weekly ' +
        'limit is ' + week.cap + ' instead of ' + week.baseCap + '.';
      pro.hidden = false;
    } else { pro.hidden = true; }
    wrap.appendChild(pro);
    return wrap;
  }

  /* ---------- 13.1 Running the evaluation ---------- */

  var evalTimer = null;

  function scheduleEvaluate() {
    var b = env.booking;
    if (!b) return;
    if (!b.draft.startDate || !(b.draft.grades || []).length) { renderBookingDrawer(); return; }
    if (evalTimer) window.clearTimeout(evalTimer);
    b.evaluating = true;
    renderBookingDrawer();
    evalTimer = window.setTimeout(runEvaluate, EVAL_DEBOUNCE_MS);
  }

  function runEvaluate() {
    var b = env.booking;
    if (!b) return;
    var req = {
      draft: {
        id: b.id,
        title: b.draft.title,
        typeId: b.draft.typeId,
        subjectId: b.draft.subjectId,
        grades: b.draft.grades,
        sections: b.draft.sections,
        startDate: b.draft.startDate,
        endDate: b.draft.endDate || b.draft.startDate,
        durationMinutes: b.draft.durationMinutes,
        teacherEmail: b.draft.teacherEmail
      },
      context: b.mode === 'EDIT' ? 'EDIT' : 'BOOKING'
    };

    net.call('apiEvaluate', req, function (data) {
      if (!env.booking) return;
      env.booking.evaluation = data;
      env.booking.evaluating = false;
      renderBookingDrawer();
      /* Announced once, as a complete sentence, 600 ms after the last change. */
      a11y.announceSettled(verdictSentence(data), data.verdict === 'BLOCK');
    }, function (err) {
      if (!env.booking) return;
      env.booking.evaluating = false;
      renderBookingDrawer();
      if (err.code !== 'TRANSPORT') toastFromError(err);
    }, { supersedeKey: 'evaluate' });
  }

  function verdictSentence(ev) {
    if (!ev) return '';
    var c0 = (ev.cohorts && ev.cohorts[0]) || null;
    var day = c0 && c0.days && c0.days[0];
    var when = env.booking && env.booking.draft.startDate
      ? dt.formatHuman(env.booking.draft.startDate, 'EEEE d MMMM') : 'that day';
    if (ev.verdict === 'OK') {
      return 'Clear. ' + bookingCohortLabel() + ' would have ' +
             ((day && day.projected && day.projected.counted) || 1) +
             ' assessment on ' + when + '.';
    }
    var primary = ev.findings && ev.primaryFindingIndex >= 0 ? ev.findings[ev.primaryFindingIndex] : null;
    var lead = ev.verdict === 'BLOCK' ? 'Blocked. ' : 'Warning. ';
    return lead + (primary && primary.message ? primary.message.headline
                                              : (bookingCohortLabel() + ' has a clash on ' + when + '.'));
  }

  /* ---------- 13.2 Saving ---------- */

  function doSave(requestApproval) {
    var b = env.booking;
    if (!b || b.saving) return;
    var ev = b.evaluation;

    if (state.ui.offline) {
      toast('You’re offline. Nothing is queued — reconnect and this will be re-checked ' +
            'before it saves.', 'WARN');
      return;
    }
    if (ev && ev.verdict === 'BLOCK' && !requestApproval) return;

    var problems = validateDraft();
    if (problems.length) { showFormErrors(problems); return; }

    if (ev && ev.requiresOverrideReason && ev.verdict === 'WARN') {
      var min = ev.overrideReasonMinChars || 10;
      if (!b.overrideReason || b.overrideReason.trim().length < min) {
        showFormErrors([{ field: 'overrideReason',
          message: 'Give a reason of at least ' + min + ' characters for scheduling anyway.' }]);
        return;
      }
    }

    b.saving = true;
    renderBookingDrawer();

    var payload = {
      draft: {
        title: b.draft.title, typeId: b.draft.typeId, subjectId: b.draft.subjectId,
        grades: b.draft.grades, sections: b.draft.sections,
        startDate: b.draft.startDate, endDate: b.draft.endDate || b.draft.startDate,
        durationMinutes: b.draft.durationMinutes, periodOrBlock: b.draft.periodOrBlock,
        notes: b.draft.notes, teacherName: b.draft.teacherName, teacherEmail: b.draft.teacherEmail
      },
      evaluationToken: ev ? ev.evaluationToken : null,
      proposalHash: ev ? ev.proposalHash : null,
      checkId: ev ? ev.checkId : null,
      overrideReason: b.overrideReason || null,
      requestApproval: !!requestApproval,
      clientRequestId: b.clientRequestId
    };

    var fn = b.mode === 'EDIT' ? 'apiUpdate' : 'apiSave';
    if (b.mode === 'EDIT') {
      payload = { id: b.id, expectedVersion: b.expectedVersion, patch: payload.draft,
                  evaluationToken: payload.evaluationToken, proposalHash: payload.proposalHash,
                  checkId: payload.checkId, overrideReason: payload.overrideReason,
                  requestApproval: payload.requestApproval,
                  clientRequestId: payload.clientRequestId };
    }

    net.call(fn, payload, function (data) {
      onSaveSuccess(data, ev);
    }, function (err) {
      if (!env.booking) return;
      env.booking.saving = false;
      onSaveFailure(err);
    });
  }

  function onSaveSuccess(data, priorEval) {
    var a = data.assessment;
    var b = env.booking;
    var cohortLabel = bookingCohortLabel();

    /* Fire-and-forget: did the warning change what the teacher did? This is
       the only honest source for the "moved after a warning" metric. */
    if (priorEval && priorEval.checkId) {
      net.call('apiReportOutcome', {
        checkId: priorEval.checkId,
        outcome: 'PROCEEDED',
        finalStartDate: a.startDate,
        assessmentId: a.id
      }, null, function () {}, { quiet: true });
    }

    env.booking = null;
    env.ranges = {};                   /* the load figures everywhere are now stale */
    env.pendingFocusId = a.id;
    closeLayer();

    var projected = data.evaluation && data.evaluation.cohorts && data.evaluation.cohorts[0];
    var day = projected && projected.days && projected.days[0];
    var n = day ? day.counted : null;
    var sentence = 'Saved.' + (n !== null
      ? (' ' + cohortLabel + ' now has ' + n + ' assessment' + (n === 1 ? '' : 's') +
         ' on ' + dt.formatHuman(a.startDate, 'EEEE d MMMM') + '.')
      : '');
    a11y.announce(sentence);
    toastSaved(sentence, a);

    state.anchorDate = a.startDate;
    fetchRange({ force: true });
  }

  function onSaveFailure(err) {
    var b = env.booking;

    /* This is exactly the race the tool exists to catch: the day filled up
       while the teacher was typing. The drawer STAYS OPEN, nothing typed is
       lost, and the announcement is assertive. */
    if (err.code === 'POLICY_BLOCK' || err.code === 'STALE_PROPOSAL') {
      if (err.details && err.details.evaluation) b.evaluation = err.details.evaluation;
      renderBookingDrawer();
      var msg = err.code === 'STALE_PROPOSAL'
        ? 'This day changed while you were typing. Here is the current picture.'
        : 'This day filled up while you were typing. ' + verdictSentence(b.evaluation);
      a11y.announce(msg, true);
      showInlineDrawerError(msg);
      return;
    }

    if (err.code === 'CONFLICT') {
      renderConflictCard(err.details || {});
      return;
    }

    if (err.code === 'VALIDATION') {
      var fieldErrors = (err.details && err.details.fieldErrors) || [];
      renderBookingDrawer();
      showFormErrors(fieldErrors.length ? fieldErrors
                                        : [{ field: err.field, message: err.message }]);
      return;
    }

    /* Every other failure is shown INLINE in the drawer, never as a toast
       alone — a toast can be missed and the teacher walks away believing they
       booked. */
    renderBookingDrawer();
    showInlineDrawerError(err.message + '  (Ref: ' + err.code + '/' +
                          ((env.meta && env.meta.requestId) || '') + ')');
  }

  function showInlineDrawerError(message) {
    var box = $('ac-booking-errors');
    if (!box) return;
    clear(box);
    box.appendChild(el('h3', { cls: 'ac-form__errors-title', text: 'This wasn’t saved' }));
    box.appendChild(el('p', { text: message }));
    box.hidden = false;
    box.scrollIntoView({ block: 'nearest' });
  }

  function validateDraft() {
    var d = env.booking.draft;
    var out = [];
    if (!d.grades || !d.grades.length) out.push({ field: 'grades', message: 'Choose at least one grade.' });
    if (!d.startDate || !dt.isValidYmd(d.startDate)) out.push({ field: 'startDate', message: 'Choose a start date.' });
    if (d.endDate && d.startDate && d.endDate < d.startDate) {
      out.push({ field: 'endDate', message: 'The end date is before the start date.' });
    }
    if (!d.title || d.title.trim().length < 3) out.push({ field: 'title', message: 'Give the assessment a title of at least 3 characters.' });
    if (!d.typeId) out.push({ field: 'typeId', message: 'Choose an assessment type.' });
    if (!d.subjectId) out.push({ field: 'subjectId', message: 'Choose a subject.' });
    return out;
  }

  var FIELD_IDS = { title: 'ac-f-title', typeId: 'ac-f-type', subjectId: 'ac-f-subject',
                    startDate: 'ac-f-start', endDate: 'ac-f-end', notes: 'ac-f-notes',
                    durationMinutes: 'ac-f-duration', overrideReason: 'ac-f-reason',
                    grades: 'ac-f-grades-lbl' };

  function showFormErrors(problems) {
    var box = $('ac-booking-errors');
    if (!box) return;
    clear(box);
    box.appendChild(el('h3', { cls: 'ac-form__errors-title', text: 'Check these before saving' }));
    var ul = el('ul', { cls: 'ac-form__errors-list', attrs: { role: 'list' } });
    problems.forEach(function (p) {
      var target = FIELD_IDS[p.field] || '';
      ul.appendChild(el('li', {}, [
        el('a', { text: p.message,
          attrs: { href: '#' + target, 'data-ac-action': 'focus-field', 'data-ac-value': target } })
      ]));
      var input = target && $(target);
      if (input && input.setAttribute) input.setAttribute('aria-invalid', 'true');
    });
    box.appendChild(ul);
    box.hidden = false;

    /* Step back to whichever step holds the first offender, so the fix is one
       action away rather than a hunt. */
    var first = problems[0];
    if (first && ['grades', 'startDate', 'endDate'].indexOf(first.field) >= 0) {
      env.booking.step = 1; renderBookingDrawer();
    } else if (first && first.field !== 'overrideReason' && env.booking.step === 3) {
      env.booking.step = 2; renderBookingDrawer();
    }
    var firstEl = $(FIELD_IDS[first && first.field] || '');
    if (firstEl && firstEl.focus) firstEl.focus();
    a11y.announce(problems.length + ' thing' + (problems.length === 1 ? '' : 's') +
                  ' to fix before this can be saved.', true);
  }

  /* ---------- 13.3 Conflict card — no silent overwrite, ever ---------- */

  function renderConflictCard(details) {
    var drawer = $('ac-booking');
    if (!drawer) return;
    drawer.setAttribute('data-ac-mode', 'CONFLICT');
    var current = details.current || {};
    var mine = env.booking.draft;

    function diffList(obj, isMine) {
      var dl = el('dl', { cls: 'ac-difflist' });
      [['Title', 'title'], ['Date', 'startDate'], ['Type', 'typeId'],
       ['Subject', 'subjectId']].forEach(function (row) {
        dl.appendChild(el('dt', { text: row[0] }));
        var v = obj[row[1]];
        if (row[1] === 'startDate' && v) v = dt.formatHuman(v, 'EEE d MMM yyyy');
        dl.appendChild(el('dd', { text: v === null || v === undefined ? '—' : String(v) }));
      });
      return dl;
    }

    var card = el('div', { cls: 'ac-conflict', attrs: { role: 'alert' } }, [
      el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: 'THIS CHANGED WHILE YOU WERE EDITING' }),
      el('h3', { cls: 'ac-conflict__title',
        text: (details.changedByName || 'Someone') + ' changed this ' +
              fmt.relativeTime(Date.now() - (fmt.isoToMs(details.changedAt) || Date.now())) + '.' }),
      el('div', { cls: 'ac-conflict__cols' }, [
        el('section', { cls: 'ac-conflict__col', attrs: { 'aria-label': 'Your version' } },
           [el('h4', { text: 'Your version' }), diffList(mine, true)]),
        el('section', { cls: 'ac-conflict__col', attrs: { 'aria-label': 'Now on the calendar' } },
           [el('h4', { text: 'Now on the calendar' }), diffList(current, false)])
      ]),
      el('div', { cls: 'ac-conflict__actions' }, [
        el('button', { cls: 'ac-btn ac-btn--primary', text: 'Keep mine',
          attrs: { type: 'button', 'data-ac-action': 'keep-mine' } }),
        el('button', { cls: 'ac-btn ac-btn--secondary', text: 'Use theirs',
          attrs: { type: 'button', 'data-ac-action': 'use-theirs' } })
      ])
    ]);

    var form = drawer.querySelector('.ac-form');
    if (form) form.parentNode.insertBefore(card, form);
    a11y.announce('This assessment changed while you were editing. Choose which version to keep.', true);
  }

  /* ==========================================================================
     14. Layers — drawers, sheets, popovers
     The backdrop is a SIBLING of the drawer, never its parent, so the focus
     trap is applied to the drawer itself.
     ========================================================================== */

  function openLayer(node, kind) {
    var root = $('ac-drawer-root');
    var backdrop = $('ac-backdrop');
    if (!root) return;

    env.lastTrigger = document.activeElement;
    env.layerStack.push({ kind: kind, node: node, trigger: env.lastTrigger });

    clear(root);
    root.appendChild(node);
    root.hidden = false;
    if (backdrop) backdrop.hidden = false;

    state.ui.drawer = kind;
    var app = $('ac-app');
    if (app) app.setAttribute('data-ac-drawer', kind);

    a11y.trapFocus(node);
    a11y.focusFirstIn(node);
  }

  function closeLayer() {
    var root = $('ac-drawer-root');
    var backdrop = $('ac-backdrop');
    var top = env.layerStack.pop();

    a11y.releaseFocus();
    if (root) { clear(root); root.hidden = true; }
    if (backdrop) backdrop.hidden = true;
    state.ui.drawer = 'NONE';
    var app = $('ac-app');
    if (app) app.removeAttribute('data-ac-drawer');

    /* Focus returns to the EXACT trigger. A keyboard user who opened a day
       cell must land back on that day cell, not at the top of the page. */
    if (top && top.trigger && document.contains(top.trigger)) {
      try { top.trigger.focus(); } catch (e) {}
    } else {
      var main = $('ac-main');
      if (main) main.focus();
    }
    closePopover();
  }

  function confirmDiscardThenClose() {
    var b = env.booking;
    if (b && b.dirty && !b.saving && !b.confirmDiscard) {
      /* NEVER window.confirm here. Inside a sandboxed iframe a blocked modal
         returns false silently, so Cancel, the X and Escape all did nothing and
         the teacher was trapped in the drawer with no way out. The question is
         asked in the drawer itself instead. */
      b.confirmDiscard = true;
      renderBookingDrawer();
      var first = document.querySelector('[data-ac-action="discard-confirm"]');
      if (first) first.focus();
      a11y.announce('Discard this assessment? Nothing has been saved yet.', true);
      return;
    }
    env.booking = null;
    closeLayer();
  }

  /* ---------- 14.1 Popover (filter menus) ---------- */

  var popoverNode = null;

  function openPopover(anchor, facet) {
    closePopover();
    var label = facet === 'subjects' ? 'Subject' : 'Assessment type';
    var pop = el('div', { cls: 'ac-popover',
      attrs: { role: 'listbox', 'aria-multiselectable': 'true', 'aria-label': label } });

    function optRow(value, text, count) {
      var input = el('input', { attrs: { type: 'checkbox', 'data-ac-action': 'toggle-facet',
                                         'data-ac-facet': facet, 'data-ac-value': value } });
      if (state.filters[facet].indexOf(value) >= 0) input.setAttribute('checked', 'checked');
      return el('label', { cls: 'ac-popover__opt' }, [
        input,
        el('span', { cls: 'ac-popover__label', text: text }),
        el('span', { cls: 'ac-popover__count', text: String(count) })
      ]);
    }

    if (facet === 'subjects') {
      ((env.lookups && env.lookups.subjects) || []).forEach(function (s) {
        if (s.active === false) return;
        pop.appendChild(optRow(s.code, s.label, countBy('subjectId', s.code)));
      });
    } else {
      /* Grouped by whether the type counts toward load, so a teacher learns the
         policy while using the filter. */
      var types = ((env.lookups && env.lookups.types) || []).filter(function (t) { return t.active !== false; });
      [[true, 'Counts toward load'], [false, 'Does not count toward load']].forEach(function (grp) {
        var members = types.filter(function (t) { return !!t.countsTowardLoad === grp[0]; });
        if (!members.length) return;
        var g = el('div', { attrs: { role: 'group', 'aria-label': grp[1] } });
        g.appendChild(el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: grp[1].toUpperCase() }));
        members.forEach(function (t) { g.appendChild(optRow(t.code, t.label, countBy('typeId', t.code))); });
        pop.appendChild(g);
      });
    }

    document.body.appendChild(pop);
    var r = anchor.getBoundingClientRect();
    pop.style.position = 'absolute';
    pop.style.top = (r.bottom + window.pageYOffset + 4) + 'px';
    pop.style.left = Math.max(8, Math.min(r.left + window.pageXOffset,
                       (window.innerWidth - pop.offsetWidth - 8))) + 'px';
    anchor.setAttribute('aria-expanded', 'true');
    popoverNode = { node: pop, anchor: anchor };
    var firstInput = pop.querySelector('input');
    if (firstInput) firstInput.focus();
  }

  function closePopover() {
    if (!popoverNode) return;
    if (popoverNode.anchor) popoverNode.anchor.setAttribute('aria-expanded', 'false');
    if (popoverNode.node && popoverNode.node.parentNode) {
      popoverNode.node.parentNode.removeChild(popoverNode.node);
    }
    popoverNode = null;
  }

  function countBy(field, value) {
    var all = (env.data && env.data.entries) || [];
    var n = 0;
    for (var i = 0; i < all.length; i++) if (all[i][field] === value) n++;
    return n;
  }

  /* ---------- 14.2 Filters drawer ---------- */

  function openFiltersDrawer() {

      var ty = el('div', { cls: 'ac-tokens' });
      ((env.lookups && env.lookups.types) || []).forEach(function (t) {
        if (t.active === false) return;

        ty.appendChild(el('button', { cls: 'ac-token', text: t.label,
          attrs: { type: 'button', 'aria-pressed': on ? 'true' : 'false',
