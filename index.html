<!--
  ============================================================================
  AISA Assessment Calendar — Index.html
  ----------------------------------------------------------------------------
  RESPONSIBILITY
  The app shell, and nothing else. This file owns:
    1. the <head> (charset, viewport, DM Sans, <base target="_top">),
    2. the HtmlService include() calls for Styles.html and JsApp.html,
    3. the inlined bootstrap JSON (<script id="ac-bootstrap-data">), so that
       first paint costs ZERO RPCs (CONTRACT.md §5.15, §5.16),
    4. the static landmark skeleton from COMPONENTS.md §2 — every container
       with its frozen id, class and ARIA role, empty and waiting for JsApp.

  WHAT THIS FILE MUST NEVER CONTAIN
    - inline style attributes or <style> blocks   -> Styles.html owns all CSS
    - inline <script> logic                       -> JsApp.html owns all JS
    - anything dynamic beyond the three scriptlets below

  CONTRACT WITH JsApp.html  (read this before editing either file)
    Every container below already exists in the DOM at first paint. JsApp
    POPULATES them by id (document.getElementById('ac-header') etc.); it must
    NOT create a second element with any of these ids. The live regions and the
    landmarks exist from first paint deliberately: a live region created on
    demand is not announced by most screen readers, and a page with no <main>
    and no <h1> before hydration is a page with no landmarks at all.

  CONTRACT WITH WebApp.gs  (the only file that renders this template)
    This template is rendered with HtmlService.createTemplateFromFile('Index')
    and requires exactly one template variable:

      bootstrapJson : a STRING that is already safe to drop into a raw-text
                      <script> element. WebApp.gs must produce it as

        JSON.stringify(payload)
          .replace(/</g,  '\\u003c')
          .replace(/>/g,  '\\u003e')
          .replace(/&/g,  '\\u0026')
          .replace(/ /g, '\\u2028')
          .replace(/ /g, '\\u2029')

    WHY NOT THE ESCAPING SCRIPTLET <?= ?> AS SHOWN IN CONTRACT.md §5.15:
    <script> is an HTML *raw text* element, so the parser does NOT decode
    character references inside it. HTML-escaping the JSON would leave literal
    "&quot;" sequences in .textContent and JSON.parse() would throw on every
    single page load. The printing scriptlet <?!= ?> plus a JSON-level
    \u00xx encoding of < > & is the only combination that is both XSS-safe
    (no "</script>" can ever appear) and parseable. This is the one place this
    file knowingly departs from the letter of the contract; see
    BUILD/STYLE_NOTES.md.

    If bootstrapJson is missing, the guard below emits "null" rather than
    throwing a ReferenceError, so a misconfigured deployment shows the app's
    own error state instead of a blank Apps Script stack trace.
  ============================================================================
-->

<title>AISA Assessment Calendar</title>

<!-- Apps Script serves this document inside an iframe. Without a _top base
