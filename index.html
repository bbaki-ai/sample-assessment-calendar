  .ac-card.is-flash{ animation: none !important; box-shadow: 0 0 0 3px var(--aisa-purple); }
  .ac-progress::after{ width: 100%; }
}

   segments visible by re-expressing them in system colours. The count numeral
   and the level word are real text and survive untouched. */

  .ac-day-cell,

<!-- ===== PREVIEW RUNTIME (not part of the deployed app) ===== -->
<script>
/* ============================================================================
   AISA Assessment Calendar — PREVIEW MOCK SERVER
   ----------------------------------------------------------------------------
   Stands in for Api.gs so the real UI runs in an ordinary browser, from
   file://, with no Google account and no deployment.

   It implements all fourteen functions from BUILD/CONTRACT.md §5 with the same
   request shapes and the same {ok, data, meta} envelopes, and it computes load
   the way Rules.gs does — because the client deliberately never computes load
   itself, so a mock that fudged it would demo a different product.

   The dataset is DETERMINISTIC: fixed dates in the 2026-27 academic year and a
   seeded pseudo-random generator, so the demo looks identical on every reload
   and in every meeting. Nothing here uses the real clock for a calendar date.

   Demo settings ride in location.hash so they survive the reload that applies
   them (localStorage is unreliable on file:// in some browsers).
   ============================================================================ */
(function () {
  'use strict';

  var TODAY = '2026-09-14';           /* the fixed "today" for the whole demo */
  var YEAR_ID = '2026-27';
  var LATENCY = [150, 300];           /* so loading states are actually visible */

  /* ---------- demo settings ---------- */

  function parseHash() {
    var out = { role: 'TEACHER', unit: 'GRADE', policy: 'WARN', approval: '0' };
    (window.location.hash || '').replace(/^#/, '').split('&').forEach(function (p) {
      if (!p) return;
      var kv = p.split('=');
      out[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });
    return out;
  }
  function queryParams() {
    var out = {};
    (window.location.search || '').replace(/^\?/, '').split('&').forEach(function (p) {
      if (!p) return;
      var kv = p.split('=');
      out[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
    });
    return out;
  }

  var DEMO = parseHash();
  window.__DEMO__ = DEMO;

  var POLICY_ENABLED = DEMO.policy !== 'OFF';
  var ENFORCEMENT = DEMO.policy === 'OFF' ? 'OFF' : DEMO.policy;   /* WARN | BLOCK */
  var APPROVAL_ON = DEMO.approval === '1';
  var UNIT = DEMO.unit === 'SECTION' ? 'SECTION' : 'GRADE';
  var ROLE = DEMO.role || 'TEACHER';

  var MAX_PER_DAY = 1;
  var MAX_PER_WEEK = 3;
  var MIN_NOTICE_DAYS = 5;

  /* ---------- date helpers (string-only, same rules as the app) ---------- */

  function parts(s) { return [ +s.slice(0,4), +s.slice(5,7), +s.slice(8,10) ]; }
  function toDate(s) { var p = parts(s); return new Date(p[0], p[1]-1, p[2]); }
  function pad2(n) { return n < 10 ? '0'+n : ''+n; }
  function fromDate(d) { return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function addDays(s, n) { var d = toDate(s); d.setDate(d.getDate()+n); return fromDate(d); }
  function isoDow(s) { var j = toDate(s).getDay(); return j === 0 ? 7 : j; }
  function weekStartOf(s) { return addDays(s, -((isoDow(s) - 1))); }
  function weekKeyOf(s) { return 'W' + weekStartOf(s); }
  function rangeOf(a, b) { var o = [], c = a, g = 0; while (c <= b && g++ < 500) { o.push(c); c = addDays(c,1); } return o; }
  function daysBetween(a, b) { return Math.round((toDate(b) - toDate(a)) / 86400000); }

  var MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var DOW_TOK = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  function human(s, withDow) {
    var p = parts(s);
    return (withDow ? DOW_SHORT[toDate(s).getDay()] + ' ' : '') + p[2] + ' ' + MON_SHORT[p[1]-1];
  }
  function isoStamp(ymd, hh, mm) { return ymd + 'T' + pad2(hh) + ':' + pad2(mm) + ':00+04:00'; }

  /* ---------- seeded RNG so the demo never changes between reloads ---------- */

  var seed = 20260914;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
  function chance(p) { return rnd() < p; }

  /* ---------- lookups ---------- */

  var DIVISIONS = [
    { code:'ES', label:'Elementary', grades:['K','1','2','3','4','5'], sortOrder:1 },
    { code:'MS', label:'Middle',     grades:['6','7','8'],            sortOrder:2 },
    { code:'HS', label:'High',       grades:['9','10','11','12'],     sortOrder:3 }
  ];

  var GRADES = [];
  DIVISIONS.forEach(function (d) {
    d.grades.forEach(function (t) {
      var rank = t === 'K' ? -1 : +t;
      GRADES.push({ token:t, label: t === 'K' ? 'Kindergarten' : 'Grade ' + t,
                    division:d.code, rank:rank, sortOrder:rank+1, active:true });
    });
  });
  GRADES.sort(function (a,b) { return a.rank - b.rank; });

  var SECTIONS = [];
  ['6','7','8'].forEach(function (g) {
    ['A','B','C'].forEach(function (c, i) {
      SECTIONS.push({ id:g+'-'+c, grade:g, code:c, label:'Grade '+g+c, division:'MS',
                      kind:'HOMEROOM', subjectId:null, active:true,
                      sortOrder:(+g)*100+i, confirmed:false });
    });
  });
  ['9','10','11','12'].forEach(function (g) {
    [['BIO','Biology HL'],['CHEM','Chemistry SL'],['ECON','Economics HL'],['ART','Visual Arts SL']]
      .forEach(function (b, i) {
        SECTIONS.push({ id:g+'-'+b[0], grade:g, code:b[0], label:'Grade '+g+' '+b[1],
                        division:'HS', kind:'OPTION_BLOCK', subjectId:null, active:true,
                        sortOrder:(+g)*100+i, confirmed:false });
      });
  });

  var SUBJECTS = [
    ['MATH','Mathematics','Mathematics',20], ['ENG','English','English',30],
    ['ARA','Arabic','Languages',40], ['SCI','Science','Science',50],
    ['BIO','Biology','Science',52], ['CHEM','Chemistry','Science',54],
    ['PHYS','Physics','Science',56], ['HIST','History','Humanities',60],
    ['GEOG','Geography','Humanities',62], ['ECON','Economics','Humanities',64],
    ['ISL','Islamic Studies','Humanities',70], ['UAE','UAE Social Studies','Humanities',72],
    ['ART','Visual Arts','Arts',80], ['MUS','Music','Arts',82],
    ['PE','Physical Education','PE',90], ['CS','Computer Science','Science',58]
  ].map(function (s) {
    return { code:s[0], label:s[1], department:s[2], divisions:['ALL'], active:true, sortOrder:s[3] };
  });

  var TYPES = [
    ['SUMM','Summative Assessment','SUM',true, 1,  'type-summ','SOLID','exam',10,'End-of-unit graded task.'],
    ['EXAM','Examination','EXM',       true, 1.5,'type-exam','SOLID','exam',12,'Formal examination.'],
    ['ESSAY','Extended Essay / Written Task','ESY',true,1,'type-essay','SOLID','doc',14,'Major written piece.'],
    ['PROJ','Project / Portfolio','PRJ',true, 1,  'type-proj','DIAGONAL','folder',16,'Multi-session project submission.'],
    ['PRACT','Practical / Lab Assessment','LAB',true,1,'type-pract','GRID','flask',18,'Assessed practical work.'],
    ['ORAL','Oral / Speaking Assessment','ORL',true,1,'type-oral','DOTS','mic',20,'Assessed speaking task.'],
    ['PRES','Presentation','PRS',      true, 1,  'type-pres','DOTS','slides',22,'Assessed presentation.'],
    ['QUIZ','Quiz','QZ',              true, 0.5,'type-quiz','OUTLINE','check',24,'Short graded check.'],
    ['FORM','Formative Check','FRM',   false,0,  'type-form','OUTLINE','check',30,'Not counted toward load.'],
    ['EXT','External Testing (MAP, CAT4)','EXT',true,2,'type-ext','GRID','globe',34,'Externally scheduled testing.'],
    ['OTHER','Other','OTH',            false,0,  'type-other','OUTLINE','dot',40,'Anything else.']
  ].map(function (t) {
    return { code:t[0], label:t[1], shortCode:t[2], countsTowardLoad:t[3], weight:t[4],
             colorToken:t[5], patternToken:t[6], iconToken:t[7], divisions:['ALL'],
             requiresApproval:false, createsBlackout:false, multiDayLoad:'', active:true,
             sortOrder:t[8], description:t[9] };
  });

  var TEACHERS = [
    ['a.khan@aisa.sch.ae','Aisha Khan','Mathematics',false],
    ['s.ahmed@aisa.sch.ae','Sara Ahmed','Mathematics',false],
    ['l.ortiz@aisa.sch.ae','Luis Ortiz','English',false],
    ['r.mendes@aisa.sch.ae','Rui Mendes','Science',true],
    ['n.haddad@aisa.sch.ae','Nadia Haddad','Humanities',true],
    ['t.hall@aisa.sch.ae','Tessa Hall','Teaching & Learning',true],
    ['j.okoro@aisa.sch.ae','Jide Okoro','Arts',false],
    ['m.silva@aisa.sch.ae','Marta Silva','Languages',false],
    ['k.brennan@aisa.sch.ae','Kate Brennan','Elementary',false],
    ['d.park@aisa.sch.ae','Dae Park','PE',false]
  ].map(function (t) { return { email:t[0], displayName:t[1], department:t[2], isLead:t[3] }; });

  var ME = TEACHERS[0];

  var TERMS = [
    { id:'T1', label:'Term 1', startDate:'2026-08-24', endDate:'2026-12-10',
      reportsDueDate:'2026-12-03', confirmed:false, note:'TODO - confirm with T&L' },
    { id:'T2', label:'Term 2', startDate:'2027-01-04', endDate:'2027-03-25',
      reportsDueDate:'2027-03-18', confirmed:false, note:'TODO - confirm with T&L' },
    { id:'T3', label:'Term 3', startDate:'2027-04-05', endDate:'2027-06-24',
      reportsDueDate:'2027-06-17', confirmed:false, note:'TODO - confirm with T&L' }
  ];

  /* Non-plain days only. Everything else is an ordinary Monday-to-Friday
     school day, and Saturday/Sunday are derived, never listed. */
  var CALENDAR_DAYS = {};
  function markDay(ymd, dayType, label, blocks, counts) {
    CALENDAR_DAYS[ymd] = { dayType:dayType, label:label, blocksScheduling:!!blocks,
                           countsAsSchoolDay:!!counts, confirmed:false,
                           displayStyle:'BAND', divisions:['ES','MS','HS'], grades:['ALL'] };
  }
  markDay('2026-09-23','PD_DAY','Professional development day', true, false);
  markDay('2026-11-04','SCHOOL_EVENT','Whole-school sports day', true, false);
  ['2026-12-01','2026-12-02','2026-12-03'].forEach(function (d) {
    markDay(d,'HOLIDAY','Eid al-Etihad / UAE National Day', true, false);
  });
  rangeOf('2026-12-11','2027-01-03').forEach(function (d) {
    markDay(d,'BREAK','Winter break', true, false);
  });
  /* The MAP window is a blackout, not a closure: school runs, but it is the
     kind of week a new summative should not land in. */
  rangeOf('2026-10-12','2026-10-16').forEach(function (d) {
    if (isoDow(d) <= 5) markDay(d,'EXAM_WINDOW','MAP testing window (Autumn)', true, true);
  });

  function dayInfo(ymd) {
    var dow = isoDow(ymd);
    if (dow > 5) return { dayType:'WEEKEND', label:DOW_SHORT[toDate(ymd).getDay()],
                          isSchoolDay:false, blocks:true };
    var c = CALENDAR_DAYS[ymd];
    if (c) return { dayType:c.dayType, label:c.label,
                    isSchoolDay:!!c.countsAsSchoolDay, blocks:c.blocksScheduling };
    var inTerm = TERMS.some(function (t) { return ymd >= t.startDate && ymd <= t.endDate; });
    if (!inTerm) return { dayType:'BREAK', label:'Outside term dates', isSchoolDay:false, blocks:true };
    return { dayType:'SCHOOL', label:null, isSchoolDay:true, blocks:false };
  }

  function termIdFor(ymd) {
    for (var i = 0; i < TERMS.length; i++) {
      if (ymd >= TERMS[i].startDate && ymd <= TERMS[i].endDate) return TERMS[i].id;
    }
    return 'UNKNOWN';
  }

  /* ==========================================================================
     THE DATASET
     A scripted spine of deliberate cases the demo must show, plus a
     deterministic background so the calendar looks like a real school's.
     ========================================================================== */

  var ENTRIES = [];
  var idSeq = 0;

  function mk(o) {
    idSeq++;
    var type = TYPES.filter(function (t) { return t.code === o.typeId; })[0] || TYPES[0];
    var subj = SUBJECTS.filter(function (s) { return s.code === o.subjectId; })[0] || SUBJECTS[0];
    var teacher = o.teacher || pick(TEACHERS);
    var start = o.startDate;
    var end = o.endDate || start;
    var grades = o.grades.slice().sort(function (a,b) {
      return (a === 'K' ? -1 : +a) - (b === 'K' ? -1 : +b); });
    var sections = (o.sections || []).slice();
    var spanDays = daysBetween(start, end) + 1;
    var spanSchool = rangeOf(start, end).filter(function (d) { return dayInfo(d).isSchoolDay; }).length;
    var createdOn = addDays(start, -(o.noticeDays === undefined ? 12 : o.noticeDays));
    var status = o.status || (APPROVAL_ON && chance(0.15) ? 'PENDING' : 'APPROVED');

    var e = {
      id: 'AS-' + start.replace(/-/g,'') + '-' + pad2(9 + (idSeq % 8)) + pad2(idSeq % 60) + pad2((idSeq*7) % 60) +
          '-' + ('000' + idSeq).slice(-4),
      academicYear: YEAR_ID,
      title: o.title,
      typeId: type.code, typeLabel: type.label, typeShortCode: type.shortCode,
      typeColorToken: type.colorToken, typePatternToken: type.patternToken,
      typeIconToken: type.iconToken,
      countsTowardLoad: type.countsTowardLoad, weight: type.weight,
      subjectId: subj.code, subjectLabel: subj.label,
      grades: grades,
      gradeLabels: grades.map(function (g) { return g === 'K' ? 'Kindergarten' : 'Grade ' + g; }),
      sections: sections,
      appliesToWholeGrade: sections.length === 0,
      divisions: grades.map(gradeDivision).filter(function (v, i, a) { return a.indexOf(v) === i; }),
      startDate: start, endDate: end,
      spanDays: spanDays, spanSchoolDays: spanSchool,
      durationMinutes: o.durationMinutes || pick([30,40,45,50,60,80,90]),
      periodOrBlock: o.period || null,
      teacherName: teacher.displayName, teacherEmail: teacher.email,
      additionalTeacherEmails: [],
      notes: o.notes || null,
      status: status,
      isProvisional: status === 'PENDING',
      approvedBy: status === 'APPROVED' ? 't.hall@aisa.sch.ae' : null,
      approvedAt: status === 'APPROVED' ? isoStamp(createdOn, 10, 5) : null,
      policyFlag: o.policyFlag || null,
      overrideRuleIds: o.overrideRuleIds || [],
      overrideReason: o.overrideReason || null,
      termId: termIdFor(start),
      weekKey: weekKeyOf(start),
      createdAt: isoStamp(createdOn, 8 + (idSeq % 6), (idSeq * 13) % 60),
      createdBy: teacher.email,
      updatedAt: isoStamp(createdOn, 8 + (idSeq % 6), (idSeq * 13) % 60),
      updatedBy: teacher.email,
      updatedByName: teacher.displayName,
      version: 1,
      isDeleted: false
    };
    ENTRIES.push(e);
    return e;

          /* An integrity rule: it blocks whatever the policy settings say,
             because a closed day is a fact, not a preference. */
          findings.push(finding('NON_SCHOOL_DAY', 'BLOCK', 'INTEGRITY', 95, 'DAY', key, d,
            human(d, true) + ' is not a school day.',
            (info.label || 'The school is closed') + '. Assessments cannot be scheduled then.',
            ['Pick a Monday to Friday date in term time.']));
        } else if (info.dayType === 'EXAM_WINDOW') {
          findings.push(finding('BLACKOUT', POLICY_ENABLED ? ENFORCEMENT : 'INFO', 'POLICY', 90,
            'DAY', key, d,
            human(d, true) + ' is inside the ' + info.label + '.',
            'This window is reserved so the whole cohort sits external testing without other ' +
            'assessments on top.',
            ['Schedule from ' + human('2026-10-19', true) + ' onwards.']));
        } else if (POLICY_ENABLED && proj.counted > MAX_PER_DAY) {
          var names = cur.existing.filter(function (e) { return e.countsTowardLoad; })
            .map(function (e) { return '“' + e.title + '” (' + e.subjectLabel +
                                       ', ' + e.teacherName + ')'; });
          findings.push(finding('DAY_CAP', ENFORCEMENT, 'POLICY', 80, 'DAY', key, d,
            label + ' already has ' + cur.counted + ' assessment' +
              (cur.counted === 1 ? '' : 's') + ' on ' + human(d, true) + '.',
            'The limit for ' + label + ' is ' + MAX_PER_DAY + ' per day.' +
              (names.length ? ' Already booked: ' + names.join(' and ') + '.' : ''),
            stepsFor(key, d, cur.existing)));
        }
        return cur;
      });

      var curWeek = weekLoadFor(key, start, [], excludeId);
      var projWeek = weekLoadFor(key, start, [proposed], excludeId);
      curWeek.projected = { counted: projWeek.counted, load: projWeek.load,
                            level: projWeek.level,
                            levelLabel: levelLabelFor(projWeek.level, projWeek.counted, projWeek.cap) +
                                        (projWeek.level === 'OVER' ? '' : ' this week') };
      if (RANK[projWeek.level] > RANK[worst]) worst = projWeek.level;

      if (POLICY_ENABLED && projWeek.cap !== null && projWeek.counted > projWeek.cap) {
        findings.push(finding('WEEK_CAP', ENFORCEMENT, 'POLICY', 70, 'WEEK', key, start,
          'This would be assessment ' + projWeek.counted + ' for ' + label +
            ' in the week of ' + human(projWeek.weekStartDate) + '.',
          'The weekly limit is ' + projWeek.cap +
            (projWeek.prorated ? ' (reduced from ' + MAX_PER_WEEK +
                                 ' because it is a short week)' : '') + '.',
          ['Try the following week, which is quieter for this cohort.']));
      }

      /* The day strip answers "then when?" without another click, so it is
         built for the proposed date's whole week, always five entries. */
      curWeek.dayStrip = [];
      for (var i = 0; i < 5; i++) {
        var d2 = addDays(projWeek.weekStartDate, i);
        var l2 = dayLoadFor(key, d2, [], excludeId);
        var info2 = dayInfo(d2);
        curWeek.dayStrip.push({
          date: d2, weekday: DOW_TOK[toDate(d2).getDay()], isSchoolDay: info2.isSchoolDay,
          dayType: info2.dayType, counted: l2.counted, load: l2.load,
          level: info2.isSchoolDay ? l2.level : 'NONE',
          isProposed: d2 >= start && d2 <= end
        });
      }

      return { cohort: cohortObject(key), days: days, week: curWeek };
    });

    /* Minimum notice, counted in school days per the config. */
    var notice = rangeOf(TODAY, start).filter(function (d) {
      return d > TODAY && dayInfo(d).isSchoolDay; }).length;
    if (POLICY_ENABLED && start > TODAY && notice < MIN_NOTICE_DAYS) {
      findings.push(finding('MIN_NOTICE', 'WARN', 'POLICY', 60, 'ENTRY', keys[0], start,
        'That is ' + notice + ' school day' + (notice === 1 ? '' : 's') + ' notice.',
        'The agreed minimum is ' + MIN_NOTICE_DAYS + ' school days so students can plan revision.',
        ['If the date is fixed, say why below and it will be recorded.']));
    }

    /* Highest rank first, so findings[0] is the primary one the card leads on. */
    findings.sort(function (a, b) { return b.rank - a.rank; });

    var hasIntegrityBlock = findings.some(function (f) {
      return f.ruleClass === 'INTEGRITY' && f.enforcement === 'BLOCK'; });
    var hasPolicyBlock = POLICY_ENABLED && findings.some(function (f) {
      return f.ruleClass === 'POLICY' && f.enforcement === 'BLOCK'; });

    var verdict = (hasIntegrityBlock || hasPolicyBlock) ? 'BLOCK'
                : (findings.length ? 'WARN' : 'OK');

    clashSeq++;
    return {
      verdict: verdict,
      severity: worst,
      canSave: verdict !== 'BLOCK',
      requiresOverrideReason: verdict === 'WARN' && POLICY_ENABLED,
      overrideReasonMinChars: 10,
      /* An integrity block is never escalatable — no approval makes a public
         holiday into a school day. */
      canRequestApproval: verdict === 'BLOCK' && APPROVAL_ON && !hasIntegrityBlock,
      evaluationToken: 'ev_' + clashSeq,
      proposalHash: hash(JSON.stringify([draft.grades, draft.sections, start, end, draft.typeId])),
      checkId: 'CL-' + TODAY.replace(/-/g, '') + '-' + ('0000' + clashSeq).slice(-4),
      schedulingUnit: UNIT,
      cohorts: cohorts,
      findings: findings,
      primaryFindingIndex: findings.length ? 0 : -1,
      suggestions: suggestFor(keys[0], start, 3),
      nonSchoolDays: rangeOf(start, end).filter(function (d) { return !dayInfo(d).isSchoolDay; })
        .map(function (d) { return { date:d, dayType:dayInfo(d).dayType,
                                     label:dayInfo(d).label || DOW_SHORT[toDate(d).getDay()] }; }),
      dataGaps: TERMS.some(function (t) { return !t.confirmed; })
        ? [{ code:'TERMS_PROVISIONAL', message:'Term dates are still placeholders awaiting T&L.' }]
        : [],
      evaluatedAt: isoStamp(TODAY, 9, 12),
      elapsedMs: 180
    };
  }

  function finding(ruleId, enforcement, ruleClass, rank, scope, cohortKey, date, headline, detail, steps) {
    return { ruleId:ruleId, enforcement:enforcement, ruleClass:ruleClass, rank:rank,
             scope:scope, cohortKey:cohortKey, date:date, field:null,
             message: { headline: headline, detail: detail, steps: steps || [] },
             data: {} };
  }

  function stepsFor(key, d, existing) {
    var s = suggestFor(key, d, 2);
    var out = [];
    if (s.length) out.push('Nearest clear days for ' + cohortObject(key).label + ': ' +
      s.map(function (x) { return human(x.startDate, true); }).join(', ') + '.');
    var names = existing.filter(function (e) { return e.countsTowardLoad; })
      .map(function (e) { return e.teacherName.split(' ')[0]; });
    if (names.length) out.push('Or talk to ' + names.join(' and ') + ' about which one moves.');
    return out;
  }

  function suggestFor(key, fromDate, count) {
    var out = [], d = fromDate, guard = 0;
    while (out.length < count && guard++ < 40) {
      d = addDays(d, 1);
      var info = dayInfo(d);
      if (!info.isSchoolDay || info.blocks) continue;
      var l = dayLoadFor(key, d);
      if (l.level === 'NONE' || l.level === 'LIGHT') {
        out.push({ startDate:d, endDate:d, deltaDays: daysBetween(fromDate, d), level: l.level,
                   label: human(d, true) + ' — ' + (l.counted === 0
                     ? 'nothing scheduled for ' + cohortObject(key).label
                     : l.counted + ' already booked') });
      }
    }
    return out;
  }

  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return (h >>> 0).toString(16);
  }

  function buildMetrics() {
    var caps = capsFor(ROLE);
    var live = ENTRIES.filter(function (a) { return !a.isDeleted; });

    var coverage = GRADES.map(function (g) {
      var mine = live.filter(function (a) { return a.grades.indexOf(g.token) >= 0; });
      var weeks = {};
      mine.forEach(function (a) { weeks[a.weekKey] = 1; });
      var weeksInRange = 16;
      var covered = Object.keys(weeks).length;
      var last = mine.slice().sort(function (x, y) { return x.createdAt < y.createdAt ? 1 : -1; })[0];
      var teachers = {};
      mine.forEach(function (a) { teachers[a.teacherEmail] = 1; });
      var pct = Math.round((covered / weeksInRange) * 100);
      return {
        scopeKey: g.token, label: g.label, division: g.division, rank: g.rank,
        entries: mine.length,
        countedEntries: mine.filter(function (a) { return a.countsTowardLoad; }).length,
        weeksWithAtLeastOneEntry: covered, weeksInRange: weeksInRange, coveragePct: pct,
        activeTeachers: Object.keys(teachers).length,
        lastEntryDate: last ? last.startDate : null,
        lastEntryAt: last ? last.createdAt : null,
        staleDays: last ? Math.max(0, daysBetween(last.createdAt.slice(0,10), TODAY)) : null,
        status: mine.length === 0 ? 'EMPTY' : (pct < 40 ? 'PATCHY' : 'HEALTHY')
      };
    });

    var withRecent = coverage.filter(function (c) { return c.entries > 0 && c.staleDays <= 21; }).length;
    var lowest = coverage.slice().sort(function (a, b) { return a.coveragePct - b.coveragePct; })[0];

    /* Lead time: how much notice students actually got. */
    var leads = live.map(function (a) { return daysBetween(a.createdAt.slice(0,10), a.startDate); })
                    .filter(function (n) { return n >= 0; }).sort(function (a,b) { return a-b; });
    function q(p) { return leads.length ? leads[Math.floor(leads.length * p)] : 0; }
    var buckets = [
      { label:'Same week (0-4 days)', min:0, max:4, count:0 },
      { label:'1-2 weeks', min:5, max:14, count:0 },
      { label:'2-4 weeks', min:15, max:28, count:0 },
      { label:'Over a month', min:29, max:null, count:0 }
    ];
    leads.forEach(function (n) {
      for (var i = 0; i < buckets.length; i++) {
        if (n >= buckets[i].min && (buckets[i].max === null || n <= buckets[i].max)) {
          buckets[i].count++; return;
        }
      }
    });

    var daysOver = 0, weeksOver = 0;
    GRADES.forEach(function (g) {
      var key = 'grade:' + g.token;
      rangeOf('2026-08-24','2026-12-10').forEach(function (d) {
        if (!dayInfo(d).isSchoolDay) return;
        if (dayLoadFor(key, d).level === 'OVER') daysOver++;
      });
    });

    return {
      range: { start:'2026-08-24', end:'2026-12-10', label:'Term 1 2026-27' },
      granularity: 'WEEK',
      coverage: coverage,
      coverageHeadline: { gradesWithRecentEntries: withRecent, gradesTotal: GRADES.length,
                          minCoveragePct: lowest ? lowest.coveragePct : 0,
                          minCoverageLabel: lowest ? lowest.label : '' },
      volume: [],
      leadTime: { medianDays: q(0.5), p25: q(0.25), p75: q(0.75), targetDays: 10,
                  minNoticeDays: MIN_NOTICE_DAYS,
                  underMinNoticeCount: leads.filter(function (n) { return n < MIN_NOTICE_DAYS; }).length,
                  backfilledCount: 0, buckets: buckets },
      pressure: { daysOverDayLimit: daysOver, weeksOverWeekLimit: weeksOver,
                  byScope: [], topDays: [], topWeeks: [] },
      warningOutcomes: { evaluated: 1840, warned: 212, blocked: ENFORCEMENT === 'BLOCK' ? 34 : 0,
                         movedAfterWarning: 147, savedDespiteWarning: 65, deterred: 38,
                         movedAfterWarningPct: 69,
                         topOverrideReasons: [{ reason:'IB deadline fixed', count:11 }] },
      typeMix: TYPES.map(function (t) {
        var n = live.filter(function (a) { return a.typeId === t.code; }).length;
        return { typeId:t.code, label:t.label, count:n, countsTowardLoad:t.countsTowardLoad,
                 sharePct: live.length ? Math.round((n/live.length)*1000)/10 : 0 };
      }).filter(function (t) { return t.count > 0; }),
      adoption: { activeWriters30d: 47, eligibleWriters: 180, adoptionPct: 26,
                  byDivision: { ES:12, MS:18, HS:17 } },
      blackoutPressure: [{ blackoutId:'BO-MAP', name:'MAP Testing Window (Autumn)',
                           findingsFired: 23 }],
      meta: { generatedAt: isoStamp(TODAY, 9, 12),
              note: '“Moved after warning” counts checks that warned and were followed ' +
                    'within 60 minutes by a save of the same proposal on a different date. It is a ' +
                    'proxy for clashes avoided, not a census.' }
    };
  }

<script>
/* ============================================================================
   AISA Assessment Calendar — JsApp.html
   ----------------------------------------------------------------------------
   RESPONSIBILITY
   The entire client application. This file owns exactly ONE global: `AC`.
   It contains ALL JavaScript and NO CSS (Styles.html owns every rule).

   It generates every element described in BUILD/COMPONENTS.md with exactly the
   class names, attributes and child order frozen there, and calls exactly the
   fourteen server functions frozen in BUILD/CONTRACT.md §5.

   THE FIVE RULES THIS FILE MUST NEVER BREAK
   -----------------------------------------
   1. THE CLIENT NEVER COMPUTES LOAD. Severity, counts and caps are rendered
      from what the server returned. Duplicating the load model here would
      guarantee the two drift, and this client only ever holds a filtered
      subset of the range anyway. See CONTRACT.md §9.4.

   2. FILTERS NEVER CHANGE THE METERS. A teacher who filtered to Mathematics
      and saw the Grade 7 meter fall from 3 to 1 would book into a full day.
      Day cells always render the TRUE unfiltered cohort load from days[date]
      and add "1 of 3 shown" while a filter is active. COMPONENTS.md §6.4.

      `new Date('2026-10-05')` is parsed as UTC and rendered in local time,
      which silently moves assessments a day in Asia/Dubai. All date maths in
      this file is done on 'yyyy-MM-dd' strings, or on Date objects built as
      `new Date(y, m-1, d)` in local time. See AC.dt below.

      textContent or AC.fmt.escapeHtml. An assessment title is untrusted input
      typed by a teacher.

      Styles.html owns display and enforces [hidden]{display:none!important}.

   ------------------
   AC.net.call() is the ONLY place in this file that touches google.script.run.
   If google.script.run is absent (the local preview harness, opened from
   file://), it falls back to window.__MOCK_SERVER__, which implements the same
   fourteen functions with the same envelopes. Nothing else in the app knows or
   cares which one it is talking to.

     the colour goes, which is what makes this survive greyscale printing,
     colour blindness and a screen reader. */

    NONE:     { word: 'Clear',      glyph: '—', segs: 0 },
    LIGHT:    { word: 'Light',      glyph: '○', segs: 1 },
    MODERATE: { word: 'Moderate',   glyph: '◐', segs: 2 },
    HEAVY:    { word: 'Heavy',      glyph: '●', segs: 3 },

  var DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MON_LONG  = ['January','February','March','April','May','June',
                   'July','August','September','October','November','December'];
  var MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      var s = Math.max(0, Math.round(msAgo / 1000));

      if (h < 24) return h + ' hour' + (h === 1 ? '' : 's') + ' ago';

  function weekLoad(ymd) {
    var weeks = (env.data && env.data.weeks) || {};
    return weeks[dt.weekKeyOf(ymd, weekStart())] || null;
  }

  function visibleCount() {
    var all = (env.data && env.data.entries) || [];
    var n = 0;
    for (var i = 0; i < all.length; i++) if (entryVisible(all[i])) n++;
    return n;
  }

  /* ==========================================================================
     10. Render dispatcher
     One render path. Every state change ends here.
     ========================================================================== */

  var renderScheduled = false;

  function render() {
    if (renderScheduled) return;
    renderScheduled = true;
    window.requestAnimationFrame(function () {
      renderScheduled = false;
      renderNow();
    });
  }

  function renderNow() {
    var app = $('ac-app');
    if (!app) return;
    app.setAttribute('data-ac-view', state.view);
    app.setAttribute('data-ac-role', (env.user && env.user.role) || 'VIEWER');
    app.setAttribute('data-ac-cohort', state.cohortKey);
    app.setAttribute('data-ac-density', state.ui.density);

    renderHeader();
    renderBanners();
    renderCohortBar();
    renderToolbar();
    renderChipRow();
    renderHeading();
    renderView();
    renderFooter();
    syncOfflineControls();
  }

  /* ---------- 10.1 Header ---------- */

  function renderHeader() {
    var right = document.querySelector('#ac-header .ac-header__right');
    if (!right) return;
    clear(right);

    right.appendChild(buildFreshnessChip());

    right.appendChild(el('button', {
      cls: 'ac-btn ac-btn--ghost ac-btn--icon',
      attrs: { type: 'button', 'data-ac-action': 'copy-link',
               'aria-label': 'Copy a link to this view' }
    }, [ el('span', { text: '🔗', attrs: { 'aria-hidden': 'true' } }),
         el('span', { cls: 'ac-btn__label', text: 'Copy link' }) ]));

    right.appendChild(el('button', {
      cls: 'ac-btn ac-btn--ghost ac-btn--icon ac-u-no-print',
      attrs: { type: 'button', 'data-ac-action': 'print', 'aria-label': 'Print this view',
               title: 'Prints the calendar itself, not the surrounding Google page.' }
    }, [ el('span', { text: '🖨', attrs: { 'aria-hidden': 'true' } }),
         el('span', { cls: 'ac-btn__label', text: 'Print' }) ]));

    var u = env.user || {};
    right.appendChild(el('span', { cls: 'ac-user', attrs: { title: u.email || '' } }, [
      el('span', { cls: 'ac-user__name', text: shortName(u.displayName || u.email || 'Signed in') }),
      el('span', { cls: 'ac-user__role', text: roleWord(u.role),
                   attrs: { 'data-ac-role': u.role || 'VIEWER' } })
    ]));
  }

  function shortName(full) {
    var s = String(full || '').trim();
    if (s.indexOf('@') > 0 && s.indexOf(' ') < 0) return s.split('@')[0];
    var bits = s.split(/\s+/);
    if (bits.length < 2) return s;
    return bits[0] + ' ' + bits[bits.length - 1].charAt(0) + '.';
  }

  function roleWord(role) {
    return { ADMIN: 'Admin', LEAD: 'Grade lead', TEACHER: 'Teacher',
             VIEWER: 'Viewer', PUBLIC: 'Guest' }[role] || 'Viewer';
  }

  /* ---------- 10.2 Freshness chip — COMPONENTS.md §3.1 ---------- */

  function buildFreshnessChip() {
    var st = env.freshnessState;
    var iso = env.lastServerWriteAt || (env.meta && env.meta.serverTimeIso);
    var absolute = fmt.isoToClockAndDate(iso);
    var ago = env.lastSyncAt ? fmt.relativeTime(Date.now() - env.lastSyncAt) : 'just now';

    var glyph, text;
    if (state.ui.offline) {
      st = 'OFFLINE';
      glyph = '⛌';
      text = 'Offline — showing ' + (absolute ? absolute.split(' on ')[0] : 'saved') + ' data';
    } else if (st === 'NEW') {
      glyph = '↻'; text = 'New changes — refresh';
    } else if (st === 'REFRESHING') {
      glyph = '↻'; text = 'Refreshing…';
    } else if (st === 'STALE') {
      glyph = '⚠'; text = 'Last updated ' + ago + ' — refresh';
    } else {
      glyph = '✓'; text = 'Updated ' + ago;
    }

    var full = text + (absolute ? (', at ' + absolute) : '') + '. Press to refresh.';
    var btn = el('button', {
      id: 'ac-freshness',
      cls: 'ac-freshness' + (st === 'REFRESHING' ? ' is-loading' : ''),
      attrs: { type: 'button', 'data-ac-action': 'refresh', 'data-ac-state': st,
               title: full, 'aria-label': full }
    }, [
      el('span', { cls: 'ac-freshness__glyph', text: glyph, attrs: { 'aria-hidden': 'true' } }),
      el('span', { cls: 'ac-freshness__text', text: text })
    ]);
    return btn;
  }

  function renderFreshness() {
    var old = $('ac-freshness');
    if (!old || !old.parentNode) return;
    var hadFocus = document.activeElement === old;
    var fresh = buildFreshnessChip();
    old.parentNode.replaceChild(fresh, old);
    if (hadFocus) fresh.focus();
  }

  /* ---------- 10.3 Banners ---------- */

  function renderBanners() {
    var root = $('ac-banners');
    if (!root) return;
    clear(root);

    /* Offline is first and is NOT dismissible; it is the only assertive one. */
    if (state.ui.offline) {
      root.appendChild(banner('ALERT', 'offline', '⛌',
        'You’re offline. Showing the calendar as last loaded. You can’t add or edit ' +
        'until you reconnect.', false, 'alert'));
    }

    if (state.ui.stale && !state.ui.offline) {
      root.appendChild(banner('WARN', 'stale', '⚠',
        'Couldn’t refresh just now. This is the calendar as last loaded — check the ' +
        'freshness stamp before you rely on it.', true, 'status'));
    }

    /* Server-supplied notices, already audience-filtered server-side. A
       non-admin never sees a config diagnostic: their experience of a broken
       config is a tool that quietly behaves as it did with the defaults. */
    var notices = (env.boot && env.boot.notices) || [];
    notices.forEach(function (n) {
      if (env.dismissedBanners[n.id]) return;
      if (n.audience === 'ADMIN' && !(env.caps && env.caps.canAdmin)) return;
      var sev = n.severity === 'WARN' ? 'GOLD' : (n.severity === 'ALERT' ? 'ALERT' : 'INFO');
      /* The unconfirmed-dates banner is gold and is NOT dismissible. */
      var dismissible = n.id !== 'terms-provisional';
      root.appendChild(banner(sev, n.id, sev === 'GOLD' ? '⚑' : 'i',
                              n.text, dismissible, 'status'));
    });

    var msg = env.config && env.config.bannerMessage;
    if (msg && !env.dismissedBanners['banner-message']) {
      root.appendChild(banner('INFO', 'banner-message', 'i', msg, true, 'status'));
    }
  }

  function banner(severity, id, glyph, text, dismissible, role) {
    var cls = 'ac-banner ac-banner--' +
      (severity === 'ALERT' ? 'alert' : severity === 'GOLD' ? 'gold' :
       severity === 'WARN' ? 'gold' : 'info');
    var kids = [
      el('span', { cls: 'ac-banner__glyph', text: glyph, attrs: { 'aria-hidden': 'true' } }),
      el('p', { cls: 'ac-banner__text', text: text })
    ];
    if (dismissible) {
      kids.push(el('button', {
        cls: 'ac-banner__close', text: '×',
        attrs: { type: 'button', 'data-ac-action': 'dismiss-banner', 'data-ac-id': id,
                 'aria-label': 'Dismiss this message' }
      }));
    }
    return el('div', {
      cls: cls,
      attrs: { 'data-ac-severity': severity, 'data-ac-id': id, role: role || 'status' }
    }, kids);
  }

  /* ---------- 10.4 Cohort bar — COMPONENTS.md §5 ----------
     Cohort is TOP-LEVEL NAVIGATION, above the date controls, because "which
     students" precedes "which day" in every real task. It is not a filter:
     it drives the load maths, while §6 filters only change which entries are
     listed. There is no separate "per-grade page" — this selection IS the
     per-grade view, applied to whichever view is open. */

  function renderCohortBar() {
    var root = $('ac-cohort-bar');
    if (!root) return;
    clear(root);

    root.appendChild(el('p', { cls: 'ac-eyebrow ac-eyebrow--gold', id: 'ac-cohort-eyebrow',
                               text: 'COHORT' }));

    var active = (env.config && env.config.activeDivisions) || ['ES', 'MS', 'HS'];
    var divisions = ((env.lookups && env.lookups.divisions) || [])
      .filter(function (d) { return active.indexOf(d.code) >= 0; });

    /* Row 1 — division segmented control. */
    var seg = el('div', { cls: 'ac-segmented',
                          attrs: { role: 'radiogroup', 'aria-labelledby': 'ac-cohort-eyebrow' } });
    var inDivision = currentDivisionFilter();
    seg.appendChild(cohortOpt('ac-segmented__opt', 'all', 'All', 'All grades',
                              state.cohortKey === 'all'));
    divisions.forEach(function (d) {
      /* Checked when this division IS the cohort, and also when the selected
         grade or section belongs to it - otherwise nothing in this row appears
         selected and the route to another division is invisible. */
      seg.appendChild(cohortOpt('ac-segmented__opt', 'div:' + d.code, d.label, d.label,
                                state.cohortKey === 'div:' + d.code || inDivision === d.code));
    });
    root.appendChild(seg);

    /* Row 2 — grade tokens, ordered by rank. K first, then 1..12. Selecting a
       division narrows this row to that division's grades. */
    var shownDiv = currentDivisionFilter();
    var grades = ((env.lookups && env.lookups.grades) || [])
      .filter(function (g) { return g.active !== false; })
      .filter(function (g) { return active.indexOf(g.division) >= 0; })
      .filter(function (g) { return !shownDiv || g.division === shownDiv; })
      .sort(function (a, b) { return fmt.gradeRank(a.token) - fmt.gradeRank(b.token); });

    if (grades.length) {
      var tokens = el('div', { cls: 'ac-tokens', attrs: { role: 'radiogroup', 'aria-label': 'Grade' } });
      grades.forEach(function (g) {
        tokens.appendChild(cohortOpt('ac-token', 'grade:' + g.token, g.token,
                                     g.label || ('Grade ' + g.token)));
      });
      root.appendChild(tokens);
    }

    /* Row 3 — sections. Rendered when a grade is selected AND that division is
       in SECTION mode, or the grade genuinely has sections. */
    var sel = parseCohort(state.cohortKey);
    if (sel.grade) {
      var secs = ((env.lookups && env.lookups.sections) || [])
        .filter(function (s) { return s.grade === sel.grade && s.active !== false; })
        .sort(function (a, b) { return (a.sortOrder || 0) - (b.sortOrder || 0); });
      var unitForDiv = schedulingUnitFor(sel.division || gradeDivision(sel.grade));
      if (secs.length && (unitForDiv === 'SECTION' || secs.length > 1)) {
        var srow = el('div', { cls: 'ac-tokens ac-tokens--sections',
                               attrs: { role: 'radiogroup', 'aria-label': 'Section' } });
        srow.appendChild(cohortOpt('ac-token ac-token--wide', 'grade:' + sel.grade, 'Whole grade'));
        secs.forEach(function (s) {
          srow.appendChild(cohortOpt('ac-token', 'sec:' + s.id,
                                     compactSectionLabel(s), s.label || s.id));
        });
        root.appendChild(srow);

        /* The section-mode explanation, grades 9-12 only. This is the sentence
           that tells a Head of Department why the HS view is different. */
        var rank = fmt.gradeRank(sel.grade);
        if (rank >= 9) {
          root.appendChild(el('p', { cls: 'ac-cohort-bar__note',
            text: 'Grade ' + sel.grade + ' students take different option blocks. ' +
                  'Section view shows what one class actually has.' }));
        }
      }
    }
  }

  function compactSectionLabel(s) {
    /* "7-A" reads better as "7A" in a 44px token; anything longer keeps its id. */
    var id = s.id || '';
    return /^[K0-9]+-[A-Z]$/.test(id) ? id.replace('-', '') : (s.code || id);
  }

  function cohortOpt(cls, key, label, ariaLabel, checkedOverride) {
    var checked = (checkedOverride === undefined) ? (state.cohortKey === key) : !!checkedOverride;
    return el('button', {
      cls: cls, text: label,
      attrs: {
        type: 'button', role: 'radio', 'aria-checked': checked ? 'true' : 'false',
        tabindex: checked ? '0' : '-1',
        'data-ac-action': 'set-cohort', 'data-ac-cohort': key,
        'aria-label': ariaLabel || label
      }
    });
  }

  function currentDivisionFilter() {
    var c = parseCohort(state.cohortKey);
    if (c.mode === 'DIVISION') return c.division;
    if (c.grade) return gradeDivision(c.grade);
    return null;
  }

  function parseCohort(key) {
    if (!key || key === 'all') return { cohortKey: 'all', mode: 'ALL', division: null, grade: null, section: null };
    if (key.indexOf('div:') === 0) return { cohortKey: key, mode: 'DIVISION', division: key.slice(4), grade: null, section: null };
    if (key.indexOf('grade:') === 0) {
      var g = key.slice(6);
      return { cohortKey: key, mode: 'GRADE', division: gradeDivision(g), grade: g, section: null };
    }
    if (key.indexOf('sec:') === 0) {
      var id = key.slice(4);
      var s = fmt.findSection(id);
      return { cohortKey: key, mode: 'SECTION', division: s ? s.division : null,
               grade: s ? s.grade : id.split('-')[0], section: id };
    }
    return { cohortKey: key, mode: 'ALL', division: null, grade: null, section: null };
  }

  function gradeDivision(token) {
    var g = fmt.findGrade(token);
    return g ? g.division : null;
  }

  function schedulingUnitFor(division) {
    var c = env.config || {};
    var byDiv = c.schedulingUnitByDivision || {};
    return (division && byDiv[division]) || c.schedulingUnit || 'GRADE';
  }

  function isAggregate(key) {
    return !key || key === 'all' || key.indexOf('div:') === 0;
  }

  /* ---------- 10.5 Toolbar — COMPONENTS.md §6 ---------- */

  function renderToolbar() {
    var root = $('ac-toolbar');
    if (!root) return;
    clear(root);

    var isMonth = state.view === 'MONTH';
    var unit = isMonth ? 'month' : 'week';

    var dates = el('div', { cls: 'ac-toolbar__dates' }, [
      el('button', { cls: 'ac-btn ac-btn--icon', text: '‹',
                     attrs: { type: 'button', 'data-ac-action': 'prev',
                              'aria-label': 'Previous ' + unit } }),
      el('span', { cls: 'ac-toolbar__period', text: periodLabel(),
                   attrs: { 'aria-hidden': 'true' } }),
      el('button', { cls: 'ac-btn ac-btn--icon', text: '›',
                     attrs: { type: 'button', 'data-ac-action': 'next',
                              'aria-label': 'Next ' + unit } }),
      el('button', { cls: 'ac-btn ac-btn--ghost', text: 'Today',
                     attrs: { type: 'button', 'data-ac-action': 'today' } })
    ]);
    root.appendChild(dates);

    /* View switcher. Metrics is present only when the caller may view it —
       and a direct ?view=metrics from anyone else renders FORBIDDEN, not a
       blank page (see renderView). */
    var views = [['MONTH', 'Month'], ['WEEK', 'Week']];
    if (env.caps && env.caps.canViewMetrics) views.push(['METRICS', 'Metrics']);
    var seg = el('div', { cls: 'ac-segmented ac-segmented--view',
                          attrs: { role: 'radiogroup', 'aria-label': 'View' } });
    views.forEach(function (v) {
      var checked = state.view === v[0];
      seg.appendChild(el('button', {
        /* Deliberately NOT ac-u-admin-only. Styles.html hides that class for any
           role below ADMIN, but the Metrics tab is only rendered at all when
           capabilities.canViewMetrics is true - which a grade lead can have.
           Adding the class would hide the tab from exactly the person the
           capability was granted to. The capability check above is the gate. */
        cls: 'ac-segmented__opt',
        text: v[1],
        attrs: { type: 'button', role: 'radio', 'aria-checked': checked ? 'true' : 'false',
                 tabindex: checked ? '0' : '-1',
                 'data-ac-action': 'set-view', 'data-ac-value': v[0] }
      }));
    });
    root.appendChild(seg);

    /* Filters. At phone width every facet collapses behind one "Filters (n)"
       button — the count badge is what prevents the classic "why is the
       calendar empty" bug. */
    var filters = el('div', { cls: 'ac-toolbar__filters' });
    if (!isPhone()) {
      filters.appendChild(filterButton('subjects', 'Subject', state.filters.subjects.length));
      filters.appendChild(filterButton('types', 'Assessment type', state.filters.types.length));
      var search = el('div', { cls: 'ac-search' }, [
        el('label', { cls: 'ac-u-visually-hidden', text: 'Search assessments',
                      attrs: { 'for': 'ac-search-input' } }),
        el('input', { id: 'ac-search-input', cls: 'ac-search__input',
                      attrs: { type: 'search', autocomplete: 'off', 'data-ac-action': 'search',
                               placeholder: 'Search title, teacher, subject',
                               value: state.filters.q || '' } })
      ]);
      filters.appendChild(search);
    }
    var moreCount = activeFilterCount();
    var more = el('button', {
      cls: 'ac-btn ac-btn--ghost',
      attrs: { type: 'button', 'data-ac-action': 'open-filters', 'aria-expanded': 'false',
               'aria-controls': 'ac-filters-drawer' }
    }, [
      document.createTextNode(isPhone() ? 'Filters' : 'More filters'),
      el('span', { cls: 'ac-filter-btn__count', text: moreCount ? String(moreCount) : '',
                   hidden: !moreCount })
    ]);
    filters.appendChild(more);
    root.appendChild(filters);

    root.appendChild(buildAddControl());

    root.appendChild(el('div', { id: 'ac-progress', cls: 'ac-progress',
                                 hidden: true, attrs: { 'aria-hidden': 'true' } }));
  }

  /* The Add control has three shapes, driven by capability and WRITE_SCOPE —
     never a dead button that errors when pressed. */
  function buildAddControl() {
    var caps = env.caps || {};
    if (caps.canWrite) {
      var label = (env.config && env.config.writeScope === 'LEADS_ONLY' &&
                   env.config.approval && env.config.approval.enabled)
        ? 'Request assessment' : '+ Add assessment';
      return el('button', {
        cls: 'ac-btn ac-btn--primary ac-u-no-print', text: label,
        attrs: { type: 'button', 'data-ac-action': 'add' }
      });
    }
    /* No write rights. Say who to ask, with a working mailto, rather than
       silently removing the control and leaving the teacher stuck. */
    var lead = leadContact();
    var note = el('p', { cls: 'ac-writescope-note' });
    note.appendChild(document.createTextNode('Entries are added by grade leads. '));
    if (lead && lead.email) {
      note.appendChild(el('a', { text: 'Ask ' + (lead.name || lead.email),
                                 attrs: { href: 'mailto:' + encodeURIComponent(lead.email) +
                                          '?subject=' + encodeURIComponent('Assessment calendar entry') } }));
    } else {
      note.appendChild(document.createTextNode('Contact ' +
        ((env.config && env.config.supportLabel) || 'Teaching & Learning') + '.'));
    }
    return note;
  }

  function leadContact() {
    var t = (env.lookups && env.lookups.teachers) || [];
    for (var i = 0; i < t.length; i++) if (t[i].isLead) return { name: t[i].displayName, email: t[i].email };
    var c = env.config || {};
    return c.supportEmail ? { name: c.supportLabel, email: c.supportEmail } : null;
  }

  function filterButton(facet, label, count) {
    return el('button', {
      cls: 'ac-filter-btn',
      attrs: { type: 'button', 'data-ac-action': 'filter-menu', 'data-ac-facet': facet,
               'aria-haspopup': 'listbox', 'aria-expanded': 'false' }
    }, [
      document.createTextNode(label + ' '),
      el('span', { cls: 'ac-filter-btn__count', text: count ? String(count) : '', hidden: !count }),
      el('span', { text: '▾', attrs: { 'aria-hidden': 'true' } })
    ]);
  }

  function activeFilterCount() {
    var f = state.filters;
    return f.subjects.length + f.types.length + f.teachers.length + f.statuses.length +
           (state.show.cancelled ? 1 : 0) + (state.show.uncounted ? 0 : 1);
  }

  function periodLabel() {
    if (state.view === 'WEEK') {
      var ws = dt.weekStartOf(state.anchorDate, weekStart());
      var we = dt.addDays(ws, gridDays() - 1);
      return 'Week of ' + dt.formatHuman(ws, 'd MMM') + ' – ' + dt.formatHuman(we, 'd MMM yyyy');
    }
    if (state.view === 'METRICS') {
      var terms = (env.lookups && env.lookups.terms) || [];
      return terms.length ? (terms[0].label + ' – ' + terms[terms.length - 1].label)
                          : 'This year';
    }
    return dt.formatHuman(state.anchorDate, 'MMMM yyyy');
  }

  /* ---------- 10.6 Applied-filter chip row ---------- */

  function renderChipRow() {
    var root = $('ac-chiprow');
    if (!root) return;
    clear(root);
    if (!filtersActive() && !state.show.cancelled && state.show.uncounted) {
      root.hidden = true;
      return;
    }
    root.hidden = false;

    function addChip(facet, value, label) {
      root.appendChild(el('span', { cls: 'ac-fchip',
        attrs: { 'data-ac-facet': facet, 'data-ac-value': value } }, [
        document.createTextNode(label + ' '),
        el('button', { cls: 'ac-fchip__x', text: '×',
          attrs: { type: 'button', 'data-ac-action': 'remove-facet',
                   'data-ac-facet': facet, 'data-ac-value': value,
                   'aria-label': 'Remove the ' + label + ' filter' } })
      ]));
    }

    state.filters.subjects.forEach(function (v) {
      var s = fmt.findSubject(v); addChip('subjects', v, s ? s.label : v);
    });
    state.filters.types.forEach(function (v) {
      var t = fmt.findType(v); addChip('types', v, t ? t.label : v);
    });
    state.filters.teachers.forEach(function (v) {
      var t = teacherByEmail(v); addChip('teachers', v, t ? t.displayName : v);
    });
    state.filters.statuses.forEach(function (v) { addChip('statuses', v, statusWord(v)); });
    if (state.filters.q) addChip('q', state.filters.q, '“' + state.filters.q + '”');
    if (state.show.cancelled) addChip('show-cancelled', '1', 'Including cancelled');
    if (!state.show.uncounted) addChip('show-uncounted', '0', 'Counted only');

    root.appendChild(el('button', { cls: 'ac-btn ac-btn--link', text: 'Clear all',
      attrs: { type: 'button', 'data-ac-action': 'clear-filters' } }));
  }

  function teacherByEmail(email) {
    var t = (env.lookups && env.lookups.teachers) || [];
    for (var i = 0; i < t.length; i++) if (t[i].email === email) return t[i];
    return null;
  }

  function statusWord(s) {
    return { DRAFT: 'Draft', PENDING: 'Pending', APPROVED: 'Approved', CANCELLED: 'Cancelled' }[s] || s;
  }

  /* ---------- 10.7 View heading and footer ---------- */

  function renderHeading() {
    var h = $('ac-view-heading');
    if (!h) return;
    var cohort = fmt.cohortLabel(state.cohortKey);
    if (state.view === 'METRICS') {
      var label = env.metrics && env.metrics.range && env.metrics.range.label;
      h.textContent = 'How is this going?' + (label ? ' — ' + label : '');
      return;
    }
    h.textContent = periodLabel() + ' — ' + cohort;
  }

  function renderFooter() {
    var f = $('ac-footer');
    if (!f) return;
    clear(f);
    var c = env.config || {};
    var support = el('span', { cls: 'ac-footer__item' });
    support.appendChild(document.createTextNode((c.supportLabel || 'Teaching & Learning') + ' · '));
    if (c.supportEmail) {
      support.appendChild(el('a', { text: c.supportEmail,
                                    attrs: { href: 'mailto:' + encodeURIComponent(c.supportEmail) } }));
    }
    f.appendChild(support);

    var iso = (env.meta && env.meta.serverTimeIso) || null;
    f.appendChild(el('span', { cls: 'ac-footer__item ac-u-muted',
      text: 'Data as of ' + (fmt.isoToClockAndDate(iso) || 'this session') +
            ' (' + (c.timezone || 'Asia/Dubai') + ')' }));
    f.appendChild(el('span', { cls: 'ac-footer__item ac-u-muted',
      text: 'v' + APP_VERSION + (env.meta && env.meta.configVersion ? ' · ' + env.meta.configVersion : '') }));
    f.appendChild(el('span', { cls: 'ac-footer__item ac-u-muted',
      text: 'No student data is held in this system.' }));
  }

  /* ==========================================================================
     11. Views
     ========================================================================== */

  function renderView() {
    var root = $('ac-view-root');
    if (!root) return;

    if (state.view === 'METRICS') {
      /* A direct ?view=metrics from someone without the capability renders the
         standard FORBIDDEN state, not a blank page. */
      if (!(env.caps && env.caps.canViewMetrics)) {
        replaceChildrenWith(root, [ errorBlock('FORBIDDEN',
          'This view is for Teaching & Learning.',
          'If you think you should have access, email ' +
          ((env.config && env.config.supportLabel) || 'Teaching & Learning') + '.') ]);
        return;
      }
      renderMetrics(root);
      return;
    }

    if (!env.data) {
      replaceChildrenWith(root, [ skeleton(state.view === 'WEEK' ? 'WEEK' : 'MONTH') ]);
      return;
    }

    var empty = emptyKind();
    if (empty) { replaceChildrenWith(root, [ emptyBlock(empty) ]); return; }

    if (state.view === 'WEEK') renderWeek(root);
    else renderMonth(root);
  }

  /* ---------- 11.1 Empty states — COMPONENTS.md §13.2 ----------
     The three kinds are the whole point. "No entries" and "nobody has filled
     this in yet" look identical in a naive calendar, and a teacher who reads
     the second as the first books straight into a clash. */

  function emptyKind() {
    var d = env.data;
    if (!d) return null;
    var cov = d.coverage || {};
    var total = (d.entries || []).length;

    if (!cov.everPopulated) return 'NEVER_POPULATED';

    /* Whole range inside a break: every day in the range is a non-school day. */
    var days = d.days || {};
    var keys = Object.keys(days);
    if (keys.length) {
      var anySchool = false;
      for (var i = 0; i < keys.length; i++) {
        if (days[keys[i]] && days[keys[i]].isSchoolDay) { anySchool = true; break; }
      }
      if (!anySchool) return 'NON_TEACHING';
    }

    if (total === 0) return 'NO_ENTRIES';
    if (visibleCount() === 0 && filtersActive()) return 'FILTERED_OUT';
    return null;
  }

  function emptyBlock(kind) {
    var cohort = fmt.cohortLabel(state.cohortKey);
    var period = periodLabel();
    var cov = (env.data && env.data.coverage) || {};
    var canWrite = env.caps && env.caps.canWrite;
    var kids = [];

    if (kind === 'NEVER_POPULATED') {
      /* The honest, amber-bordered version. Blank does NOT mean free here, and
         the tool says so out loud rather than letting a teacher get burned. */
      kids.push(el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: 'NOT FILLED IN YET' }));
      kids.push(el('h3', { cls: 'ac-empty__title',
                           text: cohort + ' has no entries at all yet.' }));
      kids.push(el('p', { cls: 'ac-empty__body',
        text: 'Treat this view as incomplete — an empty calendar here does not mean a ' +
              'free week. Check with the grade lead before scheduling.' }));
    } else if (kind === 'NO_ENTRIES') {
      kids.push(el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: 'NOTHING HERE YET' }));
      kids.push(el('h3', { cls: 'ac-empty__title',
                           text: 'No assessments recorded for ' + cohort + ' in ' + period + '.' }));
      var last = cov.lastEntryAt
        ? (cohort + ' was last updated ' + fmt.relativeTime(Date.now() - (fmt.isoToMs(cov.lastEntryAt) || Date.now())) +
           (cov.lastEntryByName ? ' by ' + cov.lastEntryByName : '') + '.')
        : '';
      if (last) kids.push(el('p', { cls: 'ac-empty__body', text: last }));
    } else if (kind === 'FILTERED_OUT') {
      var hidden = ((env.data && env.data.entries) || []).length - visibleCount();
      kids.push(el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: 'NOTHING MATCHES' }));
      kids.push(el('h3', { cls: 'ac-empty__title', text: 'No assessments match these filters.' }));
      kids.push(el('p', { cls: 'ac-empty__body',
        text: hidden + ' entr' + (hidden === 1 ? 'y is' : 'ies are') + ' hidden. ' +
              'The day loads below are unfiltered — they always show the true picture.' }));
      kids.push(el('button', { cls: 'ac-btn ac-btn--primary', text: 'Clear filters',
        attrs: { type: 'button', 'data-ac-action': 'clear-filters' } }));
    } else if (kind === 'NON_TEACHING') {
      kids.push(el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: 'NOT A TEACHING PERIOD' }));
      kids.push(el('h3', { cls: 'ac-empty__title', text: 'No school days in ' + period + '.' }));
      kids.push(el('p', { cls: 'ac-empty__body',
        text: 'Assessments are not scheduled during breaks.' }));
      kids.push(el('button', { cls: 'ac-btn ac-btn--primary', text: 'Jump to the next school week',
        attrs: { type: 'button', 'data-ac-action': 'next-school-week' } }));
    }

    if (canWrite && kind !== 'FILTERED_OUT' && kind !== 'NON_TEACHING') {
      kids.push(el('button', { cls: 'ac-btn ac-btn--primary',
        text: '+ Add the first one for ' + cohort,
        attrs: { type: 'button', 'data-ac-action': 'add' } }));
    }

    return el('div', { cls: 'ac-empty', attrs: { 'data-ac-kind': kind, role: 'status' } }, kids);
  }

  function skeleton(shape) {
    var wrap = el('div', { cls: 'ac-skeleton',
                           attrs: { 'aria-hidden': 'true', 'data-ac-shape': shape } });
    var rows = shape === 'WEEK' ? 1 : 6;
    for (var r = 0; r < rows; r++) {
      var row = el('div', { cls: 'ac-skeleton__row' });
      for (var c = 0; c < gridDays(); c++) row.appendChild(el('span', { cls: 'ac-skeleton__cell' }));
      wrap.appendChild(row);
    }
    return wrap;
  }

  function errorBlock(code, title, body, ref) {
    var c = env.config || {};
    var actions = el('div', { cls: 'ac-error__actions' }, [
      el('button', { cls: 'ac-btn ac-btn--primary', text: 'Try again',
                     attrs: { type: 'button', 'data-ac-action': 'retry' } })
    ]);
    if (c.supportEmail) {
      actions.appendChild(el('a', { cls: 'ac-btn ac-btn--ghost',
        text: 'Email ' + (c.supportLabel || 'Teaching & Learning'),
        attrs: { href: 'mailto:' + encodeURIComponent(c.supportEmail) +
                 '?subject=' + encodeURIComponent('Assessment Calendar') } }));
    }
    var kids = [
      el('p', { cls: 'ac-eyebrow ac-eyebrow--muted', text: 'SOMETHING WENT WRONG' }),
      el('h3', { cls: 'ac-error__title', text: title }),
      el('p', { cls: 'ac-error__body', text: body }),
      actions
    ];
    if (ref) kids.push(el('p', { cls: 'ac-error__ref ac-u-muted', text: 'Ref: ' + ref }));
    return el('div', { cls: 'ac-error', attrs: { 'data-ac-code': code, role: 'alert' } }, kids);
  }

  function renderFatalError(err) {
    var root = $('ac-view-root');
    if (!root) return;
    var ref = (err && err.code ? err.code : 'BACKEND') + '/' +
              ((env.meta && env.meta.requestId) || 'no-id');
    replaceChildrenWith(root, [ errorBlock(
      (err && err.code) || 'BACKEND',
      'We couldn’t load the calendar.',
      (err && err.message) || 'Nothing was changed.',
      ref) ]);
  }

  /* ---------- 11.2 Month view — COMPONENTS.md §7 ----------
     Weekend columns are suppressed: the UAE school week is Monday-Friday, so a
     Sat/Sun column can never hold data and would eat 2/7 of the width that
     decides whether a load meter and a title both fit. */

  function renderMonth(root) {
    var ws = weekStart();
    var nDays = gridDays();
    var first = dt.startOfMonth(state.anchorDate);
    var last  = dt.endOfMonth(state.anchorDate);
    var gridStart = dt.weekStartOf(first, ws);
    var lastWeekStart = dt.weekStartOf(last, ws);

    var table = el('table', {
      id: 'ac-month-grid', cls: 'ac-month-grid',
      attrs: { role: 'grid', 'aria-labelledby': 'ac-view-heading',
               'aria-colcount': String(nDays) }
    });

    var headRow = el('tr', { attrs: { role: 'row' } });
    var narrow = isPhone();
    for (var c = 0; c < nDays; c++) {
      var sample = dt.addDays(gridStart, c);
      var dow = dt.toDate(sample).getDay();
      var th = el('th', {
        cls: 'ac-month-grid__dow',
        /* Short form on a phone: at ~70px per column "Wednesday" wraps to
           "Wednesd / ay". The full name stays in the accessible name. */
        text: narrow ? DOW_SHORT[dow] : DOW_LONG[dow],
        attrs: { role: 'columnheader', scope: 'col', abbr: DOW_SHORT[dow] }
      });
      if (narrow) th.appendChild(sr(DOW_LONG[dow]));
      headRow.appendChild(th);
    }
    /* display:table-header-group in the print stylesheet repeats this on every
       printed page. */
    table.appendChild(el('thead', {}, [headRow]));

    var tbody = el('tbody');
    var weekCursor = gridStart;
    var rowCount = 0;
    while (weekCursor <= lastWeekStart && rowCount < 8) {
      tbody.appendChild(buildWeekRow(weekCursor, nDays, first, last));
      weekCursor = dt.addDays(weekCursor, 7);
      rowCount++;
    }
    table.setAttribute('aria-rowcount', String(rowCount));
    table.appendChild(tbody);

    var kids = [table];

    /* The mobile week strip sits below the grid at every width so weekly load
       is legible without leaving Month view. */
    if (!isAggregate(state.cohortKey)) kids.push(buildWeekStrip(state.anchorDate));

    replaceChildrenWith(root, kids);

    a11y.rovingGrid(table, moveGridFocus);
    a11y.setRovingFocus(table, focusableDateInMonth());
  }

  function focusableDateInMonth() {
    var sel = state.selection.dayDate;
    if (sel && sel >= dt.startOfMonth(state.anchorDate) && sel <= dt.endOfMonth(state.anchorDate)) return sel;
    var today = dt.today();
    if (today >= dt.startOfMonth(state.anchorDate) && today <= dt.endOfMonth(state.anchorDate)) return today;
    return firstSchoolDayOfMonth();
  }

  function firstSchoolDayOfMonth() {
    var d = dt.startOfMonth(state.anchorDate);
    var end = dt.endOfMonth(state.anchorDate);
    var guard = 0;
    while (d <= end && guard++ < 40) {
      if (dt.isoDow(d) <= gridDays()) return d;
      d = dt.addDays(d, 1);
    }
    return dt.startOfMonth(state.anchorDate);
  }

  function buildWeekRow(weekStartYmd, nDays, monthFirst, monthLast) {
    var tr = el('tr', { cls: 'ac-month-grid__week',
                        attrs: { role: 'row',
                                 'data-ac-weekkey': dt.weekKeyOf(weekStartYmd, weekStart()) } });
    for (var i = 0; i < nDays; i++) {
      var ymd = dt.addDays(weekStartYmd, i);
      var inMonth = ymd >= monthFirst && ymd <= monthLast;
      tr.appendChild(buildDayCell(ymd, inMonth));
    }
    return tr;
  }

  /* ---------- 11.3 Day cell — child order is EXACTLY as COMPONENTS.md §7.2 ---------- */

  function buildDayCell(ymd, inMonth) {
    var load = dayLoad(ymd);
    var level = load ? load.level : 'NONE';
    var dayType = load ? load.dayType : 'SCHOOL';
    var isSchool = load ? load.isSchoolDay !== false : (dt.isoDow(ymd) <= gridDays());
    var isToday = ymd === dt.today();
    var phone = isPhone();

    /* Non-school day: hatch pattern PLUS the label, so it survives greyscale
       printing and colour-blind readers. Focusable, but no action. */
    if (!isSchool) {
      var closedLabel = (load && load.dayTypeLabel) || dayTypeWord(dayType);
      return el('td', {
        id: 'ac-cell-' + ymd,
        cls: 'ac-day-cell ac-day-cell--closed' + (inMonth ? '' : ' is-dimmed'),
        attrs: {
          role: 'gridcell', tabindex: '-1',
          'data-ac-date': ymd, 'data-ac-level': 'NONE', 'data-ac-daytype': dayType,
          'aria-label': dt.formatHuman(ymd, 'EEEE d MMMM') + '. ' + closedLabel + '. Not a school day.'
        }
      }, [
        el('div', { cls: 'ac-day-cell__head' }, [
          el('span', { cls: 'ac-day-cell__num', text: dt.formatHuman(ymd, 'd') })
        ]),
        el('p', { cls: 'ac-day-cell__closed-label', text: closedLabel })
      ]);
    }

    var aggregate = isAggregate(state.cohortKey);
    var allToday = entriesForDate(ymd, false);
    var shown = entriesForDate(ymd, true);
    var count = load ? load.counted : allToday.length;
    var cap = load ? load.cap : null;

    var cell = el('td', {
      id: 'ac-cell-' + ymd,
      cls: 'ac-day-cell' + (isToday ? ' is-today' : '') + (inMonth ? '' : ' is-dimmed'),
      attrs: {
        role: 'gridcell', tabindex: '-1', 'aria-selected': 'false',
        'data-ac-date': ymd,
        'data-ac-level': level,
        'data-ac-daytype': dayType,
        'data-ac-cohort': state.cohortKey,
        'data-ac-count': String(count),
        'data-ac-action': 'open-day',
        'aria-label': dayCellAriaLabel(ymd, load, shown, isToday, phone)
      }
    });

    var head = el('div', { cls: 'ac-day-cell__head' }, [
      el('span', { cls: 'ac-day-cell__num', text: dt.formatHuman(ymd, 'd') })
    ]);
    if (isToday) head.appendChild(sr('Today'));
    cell.appendChild(head);

    /* THE LOAD METER: four segments + the numeral + the WORD. All three,
       always. The bar is aria-hidden and the adjacent text is real text, so a
       screen reader hears the count and the level word exactly once. */
    cell.appendChild(buildMeter(level, count, cap, {
      mini: phone, visibleText: !phone, aggregate: aggregate,
      aggregateLabel: load && load.levelLabel
    }));

    if (phone) {
      /* The numeral is the readable signal at this size - four small segments
         alone are not legible on a phone held at arm's length between lessons.
         It is aria-hidden because the meter's role="img" label already states
         the count and the level word. */
      cell.appendChild(el('span', { cls: 'ac-meter__count',
        text: level === 'NONE' ? '—' : String(count),
        attrs: { 'aria-hidden': 'true' } }));
    }

    if (!phone) {
      if (aggregate) {
        cell.appendChild(buildGradeStrip(ymd, load));
      } else {
        var chips = el('ul', { cls: 'ac-day-cell__chips', attrs: { role: 'list' } });
        shown.slice(0, 3).forEach(function (a) {
          chips.appendChild(el('li', { attrs: { role: 'listitem' } }, [buildChip(a)]));
        });
        cell.appendChild(chips);

        if (shown.length > 3) {
          cell.appendChild(el('button', {
            cls: 'ac-day-cell__more', text: '+' + (shown.length - 3) + ' more',
            attrs: { type: 'button', 'data-ac-action': 'open-day', 'data-ac-date': ymd }
          }));
        }
      }

      /* "1 of 3 shown" appears ONLY while a filter is active. The meter above
         it still shows the true unfiltered load — rule 2 in the file header. */
      var filteredNote = el('p', { cls: 'ac-day-cell__filtered',
        text: shown.length + ' of ' + allToday.length + ' shown' });
      filteredNote.hidden = !(filtersActive() && allToday.length !== shown.length);
      cell.appendChild(filteredNote);
    }

    /* Always in the DOM so keyboard users reach it; Styles reveals it on hover
       and focus-within. Omitted entirely when the caller cannot write. */
    if (env.caps && env.caps.canWrite) {
      cell.appendChild(el('button', {
        cls: 'ac-day-cell__add ac-u-no-print', text: '+',
        attrs: { type: 'button', 'data-ac-action': 'add-here', 'data-ac-date': ymd,
                 'aria-label': 'Add an assessment on ' + dt.formatHuman(ymd, 'EEEE d MMMM') }
      }));
    }

    return cell;
  }

  function dayCellAriaLabel(ymd, load, shown, isToday, phone) {
    var bits = [dt.formatHuman(ymd, 'EEEE d MMMM') + '.'];
    if (isToday) bits.push('Today.');
    var n = load ? load.counted : shown.length;
    bits.push(n + ' assessment' + (n === 1 ? '' : 's') + '.');
    if (load && load.level === 'MIXED') {
      if (load.levelLabel) bits.push(load.levelLabel + '.');
    } else {
      bits.push(fmt.levelWord(load ? load.level : 'NONE') + ' load.');
      if (load && load.cap !== null && load.cap !== undefined) {
        bits.push('Limit ' + load.cap + '.');
      }
    }
    /* On desktop the first few titles are genuinely useful in the accessible
       name; at 390px the cell has no titles at all, so we do not promise any. */
    if (!phone) {
      shown.slice(0, 3).forEach(function (a) {
        bits.push(a.title + ', ' + (a.subjectLabel || a.subjectId) + '.');
      });
    }
    bits.push('Press Enter for details.');
    return bits.join(' ');
  }

  function dayTypeWord(t) {
    return { WEEKEND: 'Weekend', HOLIDAY: 'Holiday', BREAK: 'Break', PD_DAY: 'PD day',
             HALF_DAY: 'Half day', EXAM_WINDOW: 'Exam window',
             NO_ASSESSMENT: 'No-assessment day', SCHOOL_EVENT: 'School event',
             TRIP: 'Trip', UNKNOWN: 'Not a school day' }[t] || 'Not a school day';
  }

  /* ---------- 11.4 The meter ---------- */

  function buildMeter(level, count, cap, opts) {
    opts = opts || {};
    var segs = fmt.levelSegs(level);
    var word = fmt.levelWord(level);
    var cls = 'ac-meter' + (opts.mini ? ' ac-meter--mini' : '') + (opts.large ? ' ac-meter--lg' : '');

    var bar = el('span', { cls: 'ac-meter__bar', attrs: { 'aria-hidden': 'true' } });
    if (level !== 'MIXED') {
      for (var i = 0; i < 4; i++) {
        bar.appendChild(el('i', { cls: 'ac-meter__seg' + (i < segs ? ' is-on' : '') }));
      }
    }

    var kids = [bar];
    if (opts.visibleText) {
      if (opts.aggregate) {
        kids.push(el('span', { cls: 'ac-meter__count', text: String(count),
                               attrs: { 'aria-hidden': 'true' } }));
        kids.push(el('span', { cls: 'ac-meter__word',
                               text: opts.aggregateLabel || (count + ' assessments'),
                               attrs: { 'aria-hidden': 'true' } }));
      } else {
        kids.push(el('span', { cls: 'ac-meter__count',
                               text: level === 'NONE' ? '—' : String(count),
                               attrs: { 'aria-hidden': 'true' } }));
        kids.push(el('span', { cls: 'ac-meter__word',
                               text: word + (level === 'OVER' && (cap || cap === 0)
                                             ? ' · limit ' + cap : ''),
                               attrs: { 'aria-hidden': 'true' } }));
      }
    }

    var attrs = { 'data-ac-level': level };
    if (opts.visibleText) {
      /* The adjacent text already states the count and the word, so the
         wrapper is hidden from the accessibility tree. NEVER both announced. */
      attrs['aria-hidden'] = 'true';
    } else {
      attrs.role = 'img';
      attrs['aria-label'] = 'Load: ' + word.toLowerCase() + ', ' + count +
        ' assessment' + (count === 1 ? '' : 's') +
        ((cap || cap === 0) ? ' of a maximum ' + cap : '');
    }
    return el('div', { cls: cls, attrs: attrs }, kids);
  }

  /* ---------- 11.5 Assessment chip — COMPONENTS.md §7.4 ---------- */

  function buildChip(a) {
    var counts = a.countsTowardLoad !== false;
    var partial = partialTag(a);

    var badge = el('span', { cls: 'ac-chip__badge', text: a.typeShortCode || '?',
      attrs: { 'data-ac-color': a.typeColorToken || 'type-other', 'aria-hidden': 'true' } });

    var title = el('span', { cls: 'ac-chip__title ac-u-truncate', text: a.title });

    var tag = el('span', { cls: 'ac-chip__tag', text: partial || '' });
    tag.hidden = !partial;

    var btn = el('button', {
      cls: 'ac-chip',
      attrs: {
        type: 'button', 'data-ac-action': 'open-entry', 'data-ac-id': a.id,
        'data-ac-type': a.typeId, 'data-ac-counts': counts ? 'true' : 'false',
        'data-ac-status': a.status,
        'data-ac-span': (a.spanDays && a.spanDays > 1) ? String(a.spanDays) : null,
        'aria-label': chipAriaLabel(a, partial)
      }
    }, [badge, title, tag]);
    return btn;
  }

  function chipAriaLabel(a, partial) {
    var bits = [a.title + '.', (a.typeLabel || a.typeId) + '.',
                (a.subjectLabel || a.subjectId) + '.', (a.teacherName || '') + '.'];
    bits.push((a.gradeLabels && a.gradeLabels.join(', ')) || '');
    if (partial) bits.push(partial + ' only.');
    if (a.spanDays && a.spanDays > 1) {
      bits.push(dt.formatHuman(a.startDate, 'EEE d MMM') + ' to ' +
                dt.formatHuman(a.endDate, 'EEE d MMM') + ', ' +
                a.spanSchoolDays + ' school days.');
    }
    if (a.countsTowardLoad === false) bits.push('Not counted toward load.');
    if (a.status === 'PENDING') bits.push('Awaiting approval.');
    if (a.status === 'CANCELLED') bits.push('Cancelled.');
    return bits.filter(Boolean).join(' ');
  }

  /* The partial marker. Without it, a section-level entry reads as a whole-grade
     booking — precisely the misread that gets a teacher burned. */
  function partialTag(a) {
    var sel = parseCohort(state.cohortKey);
    if (sel.mode === 'GRADE') {
      if (a.sections && a.sections.length) {
        var mine = a.sections.filter(function (s) { return s.indexOf(sel.grade + '-') === 0; });
        if (mine.length) return mine.map(function (s) { return s.replace('-', ''); }).join(', ');
      }
      return null;
    }
    if (sel.mode === 'SECTION') {
      if (a.appliesToWholeGrade) return 'Grade-wide';
      return null;
    }
    return null;
  }

  /* ---------- 11.6 Aggregate cell grade-token strip — COMPONENTS.md §7.5 ---------- */

  function buildGradeStrip(ymd, load) {
    var per = (load && load.perCohort) || {};
    var keys = Object.keys(per).sort(function (a, b) {
      return fmt.gradeRank(a.replace(/^grade:/, '')) - fmt.gradeRank(b.replace(/^grade:/, ''));
    });
    var strip = el('div', { cls: 'ac-gradestrip',
      attrs: { role: 'list', 'aria-label': 'Grades with assessments on ' +
                                            dt.formatHuman(ymd, 'EEEE d MMMM') } });
    keys.forEach(function (k) {
      var info = per[k];
      var token = k.replace(/^grade:/, '').replace(/^sec:/, '');
      var tok = el('button', {
        cls: 'ac-gradestrip__tok',
        attrs: { type: 'button', role: 'listitem',
                 'data-ac-action': 'set-cohort-keep-date', 'data-ac-cohort': k,
                 'data-ac-date': ymd, 'data-ac-level': info.level,
                 'aria-label': fmt.cohortLabel(k) + ', ' + info.counted +
                               ' assessment' + (info.counted === 1 ? '' : 's') + ', ' +
                               fmt.levelWord(info.level).toLowerCase() }
      });
      tok.appendChild(document.createTextNode(token));
      tok.appendChild(el('sup', { text: String(info.counted) }));
      strip.appendChild(tok);
    });
    return strip;
  }

  /* ---------- 11.7 Week strip — COMPONENTS.md §7.7 ---------- */

  function buildWeekStrip(anchorYmd, inline) {
    var ws = dt.weekStartOf(anchorYmd, weekStart());
    var wl = weekLoad(anchorYmd);
    var ol = el('ol', { cls: 'ac-weekstrip__days' + (inline ? ' ac-weekstrip__days--inline' : '') });

    for (var i = 0; i < gridDays(); i++) {
      var ymd = dt.addDays(ws, i);
      var dl = dayLoad(ymd);
      var level = dl ? dl.level : 'NONE';
      var n = dl ? dl.counted : 0;
      var li = el('li', { cls: 'ac-weekstrip__day',
        attrs: { 'data-ac-date': ymd, 'data-ac-level': level } }, [
        el('span', { cls: 'ac-weekstrip__dow', text: dt.formatHuman(ymd, 'EEE') }),
        buildMeter(level, n, dl ? dl.cap : null, { mini: true, visibleText: false }),
        el('span', { cls: 'ac-weekstrip__n', text: String(n) })
      ]);
      ol.appendChild(li);
    }

    if (inline) return ol;

    return el('section', { cls: 'ac-weekstrip',
      attrs: { 'aria-label': 'Week of ' + dt.formatHuman(ws, 'd MMMM') + ', ' +
                             fmt.cohortLabel(state.cohortKey) } }, [
      el('h3', { cls: 'ac-weekstrip__title',
                 text: 'Week of ' + dt.formatHuman(ws, 'd MMMM') + ' · ' +
                       fmt.cohortLabel(state.cohortKey) +
                       (wl ? ' · ' + wl.counted + ' total' : '') }),
      ol
    ]);
  }

  /* ---------- 11.8 Week view — COMPONENTS.md §8 ----------
     The view a teacher actually chooses a date in. Five day columns on desktop;
     a vertical stack of five day sections on a phone (never a horizontally
     scrolling five-column grid). */

  function renderWeek(root) {
    var ws = dt.weekStartOf(state.anchorDate, weekStart());
    var wl = weekLoad(ws);
    var policyOn = !!(env.config && env.config.policy && env.config.policy.enabled);

    var head = el('div', { cls: 'ac-week-head' });
    head.appendChild(el('p', { cls: 'ac-eyebrow ac-eyebrow--gold',
      text: ('WEEK OF ' + dt.formatHuman(ws, 'd MMMM yyyy') + ' · ' +
             fmt.cohortLabel(state.cohortKey)).toUpperCase() }));

    if (wl) {
      var cap = policyOn ? wl.cap : null;
      /* When policy is off the stat reads "5 assessments this week — heavy",
         with NO maximum. Inventing a limit T&L has not agreed to would be
         dishonest, and teachers would notice. */
      var statText = (cap || cap === 0)
        ? (wl.counted + ' of ' + cap + ' maximum')
        : (wl.counted + ' assessment' + (wl.counted === 1 ? '' : 's') + ' this week');

      var loadWrap = el('div', { cls: 'ac-week-head__load', attrs: { 'data-ac-level': wl.level } }, [
        sr('Weekly load:'),
        buildMeter(wl.level, wl.counted, cap, { large: true, visibleText: false }),
        el('span', { cls: 'ac-week-head__stat', text: statText, attrs: { 'aria-hidden': 'true' } }),
        el('span', { cls: 'ac-week-head__word', text: fmt.levelWord(wl.level),
                     attrs: { 'aria-hidden': 'true' } })
      ]);
      head.appendChild(loadWrap);
