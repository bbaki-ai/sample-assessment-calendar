<style>
/* ============================================================================
   AISA Assessment Calendar — Styles.html
   ----------------------------------------------------------------------------
   RESPONSIBILITY
   Every pixel. This file owns :root, every `ac-*` class rule, every
   `[data-ac-*]` styling hook, every `is-*` state style, @media print and
   @media (prefers-reduced-motion). It contains NO JavaScript.

   THE FIVE RULES THAT GOVERN EVERY LINE BELOW
   1. No component rule contains a colour literal. Colour is resolved once, in
      :root, and referenced as var(--…) everywhere else.
   2. Colour is never the only carrier of meaning. Every load level and every
      status is colour + a word + a shape/pattern/numeral. Print it in
      greyscale, simulate deuteranopia, or read it with a screen reader and the
      information survives intact.
   3. Layout is mobile-first. The base rules ARE the 390px phone layout; wider
      screens add to it. This is deliberate — a phone layout derived by
      shrinking a desktop grid is how calendars become illegible between
      lessons, and between lessons is when this tool is actually used.
   4. Focus is never removed. --ac-focus is the one focus treatment.
   5. AA contrast for every foreground/background pair that actually ships.
      --aisa-gold is 2.1:1 on white and is therefore used ONLY as fill, bar or
      accent — never as small text. See the note above --aisa-gold below.

   WHERE TO LOOK
      §0  tokens              §6  toolbar / filters     §12 metrics
      §1  reset + utilities   §7  month grid            §13 system states
      §2  app shell           §8  week view             §14 toast
      §3  header              §9  drawers + day sheet   §15 responsive
      §4  banners             §10 booking form          §16 print
      §5  cohort bar          §11 evaluation panel      §17 motion / contrast
   ========================================================================= */


/* ===========================================================================
   §0  DESIGN TOKENS
   ======================================================================== */
:root{
  /* ---- AISA brand. Mandatory. Non-negotiable. (COMPONENTS.md §1) ---- */
  --aisa-purple:        #21076C;   /* structure: headers, nav, headings, key borders */
  --aisa-gold:          #D8B664;   /* ACCENT ONLY: stat bars, eyebrow rules, CTA highlights */
  --aisa-white:         #FFFFFF;   /* default background — never cream, never beige */
  --aisa-near-black:    #1A1A1A;   /* body copy */
  --aisa-muted-gray:    #555555;   /* captions, metadata */
  --aisa-purple-tint:   #F2EFFA;   /* card fills, alternating rows — THE ONLY off-white allowed */
  --aisa-purple-border: #C8BEE8;   /* dividers, card borders, input outlines */

  --radius: 8px;
  --font-sans: 'DM Sans', sans-serif;     /* 400 / 500 / 700 from Google Fonts */

  /* ---- Load ramp: ONE HUE, five steps. Not a traffic light. ----
     A traffic light would fight the brand, imply a judgement T&L may not have
     agreed to (POLICY_ENABLED can be false), and fail colour-blind readers.
     Intensity within one hue reads as "more" even in greyscale. */
  --load-none:      var(--aisa-white);
  --load-light:     var(--aisa-purple-tint);
  --load-moderate:  #BFB0E6;
  --load-heavy:     #6B4FB8;
  --load-over:      #8C1D18;        /* semantic alert, deliberately outside the brand accents */
  --load-none-ink:     var(--aisa-muted-gray);
  --load-light-ink:    var(--aisa-near-black);
  --load-moderate-ink: var(--aisa-near-black);
  --load-heavy-ink:    var(--aisa-white);
  --load-over-ink:     var(--aisa-white);

  /* ---- Semantic state. Only two, both AA on white. ---- */
  --state-alert:       #8C1D18;     /* blocking errors only            9.2:1 on white */
  --state-warn-border: #A9761B;     /* warning BORDERS only            4.0:1 — never text */
  --state-warn-fill:   #FFF4DA;
  --state-ok:          #1F6B4A;     /*                                 6.4:1 on white */

  /* ---- Assessment-type ramp. Purple family. ALWAYS paired with the shortCode. ----
     Every one of these is >= 4.5:1 against --type-ink (white); the palest,
     --type-form at 4.8:1, sets the floor. */
  --type-summ:  #2F2A6B;
  --type-quiz:  #4A4482;
  --type-form:  #6A639B;
  --type-proj:  #3D5A80;
  --type-essay: #5C3A6B;
  --type-pract: #2F5B5B;
  --type-oral:  #6B4A3A;
  --type-pres:  #7A5C10;
  --type-exam:  #2F3B52;
  --type-ext:   #4A4A4A;
  --type-other: #555555;
  --type-ink:   var(--aisa-white);

  /* ---- Geometry ---- */
  --ac-gutter: 16px;
  --ac-cell-min-h: 118px;
  --ac-cell-min-h-sm: 62px;
  --ac-drawer-w: 480px;
  --ac-sheet-w: 420px;
  --ac-tap: 44px;
  --ac-focus: 0 0 0 2px var(--aisa-white), 0 0 0 4px var(--aisa-purple);

  /* ---- DERIVED TOKENS (added by Styles.html; see BUILD/STYLE_NOTES.md) ----
     Everything here is computed from, or subordinate to, the brand set above.
     No new hue is introduced. */
  --aisa-purple-hover: #33128F;     /* lighter purple for hover/active     13:1 on white  */
  --ac-scrim:          rgb(33 7 108 / 55%);   /* backdrop: --aisa-purple at 55%           */
  --ac-shadow-1: 0 1px 2px rgb(33 7 108 / 8%), 0 2px 8px rgb(33 7 108 / 6%);
  --ac-shadow-2: 0 2px 6px rgb(33 7 108 / 12%), 0 12px 36px rgb(33 7 108 / 18%);
  --ac-max-w: 1440px;

  /* z-index scale — one place, so layers can never fight */
  --ac-z-sticky:   20;
  --ac-z-fab:      40;
  --ac-z-backdrop: 50;
  --ac-z-drawer:   60;
  --ac-z-popover:  70;
  --ac-z-toast:    80;

  /* Per-level cascade. Any element carrying [data-ac-level] republishes these
     for its subtree, so .ac-meter__seg, chips and borders never need to know
     which level they are in. Defaults = NONE. */
  --_lvl:      var(--load-none);
  --_lvl-ink:  var(--load-none-ink);
  --_lvl-seg:  var(--aisa-purple-border);
  --_lvl-edge: var(--aisa-purple-border);
}

/* The level map. ONE place decides what a level looks like.
   --_lvl-seg is the meter-segment fill; it is deliberately NOT identical to the
   cell fill, because --load-light (#F2EFFA) is invisible against white and a
   meter segment you cannot see is a meter segment that carries no meaning. */
[data-ac-level="NONE"]{
  --_lvl: var(--load-none);      --_lvl-ink: var(--load-none-ink);
  --_lvl-seg: transparent;       --_lvl-edge: var(--aisa-purple-border);
}
[data-ac-level="LIGHT"]{
  --_lvl: var(--load-light);     --_lvl-ink: var(--load-light-ink);
  --_lvl-seg: var(--aisa-purple-border); --_lvl-edge: var(--aisa-purple-border);
}
[data-ac-level="MODERATE"]{
  --_lvl: var(--load-moderate);  --_lvl-ink: var(--load-moderate-ink);
  --_lvl-seg: var(--load-moderate);      --_lvl-edge: var(--load-moderate);
}
[data-ac-level="HEAVY"]{
  --_lvl: var(--load-heavy);     --_lvl-ink: var(--load-heavy-ink);
  --_lvl-seg: var(--load-heavy);         --_lvl-edge: var(--load-heavy);
}
[data-ac-level="OVER"]{
  --_lvl: var(--load-over);      --_lvl-ink: var(--load-over-ink);
  --_lvl-seg: var(--load-over);          --_lvl-edge: var(--load-over);
}
[data-ac-level="MIXED"]{
  --_lvl: var(--aisa-purple-tint); --_lvl-ink: var(--aisa-near-black);
  --_lvl-seg: var(--aisa-purple);        --_lvl-edge: var(--aisa-purple);
}


/* ===========================================================================
   §1  RESET, BASE TYPE, UTILITIES
   ======================================================================== */
*, *::before, *::after{ box-sizing: border-box; }

html{
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body{
  margin: 0;
  background: var(--aisa-white);
  color: var(--aisa-near-black);
  font-family: var(--font-sans);
  font-size: 1rem;              /* 16px on phone — below 16px iOS zooms on focus */
  font-weight: 400;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  font-synthesis-weight: none;
}

/* JsApp owns the `hidden` attribute; it must always win. */
[hidden]{ display: none !important; }

h1,h2,h3,h4{ margin: 0; font-weight: 700; color: var(--aisa-purple); line-height: 1.25; }
p{ margin: 0; }
ul,ol{ margin: 0; padding: 0; }
li{ list-style: none; }

a{ color: var(--aisa-purple); text-underline-offset: 2px; }
a:hover{ color: var(--aisa-purple-hover); }

img, svg{ max-width: 100%; }

/* Numerals that are read as quantities must not jitter as they change. */
.ac-meter__count, .ac-day-cell__num, .ac-stat__num, .ac-stat-num,
.ac-bar__num, .ac-weekstrip__n, .ac-daystrip__n, .ac-table td,
.ac-filter-btn__count, .ac-field__count, .ac-gradestrip__tok{
  font-variant-numeric: tabular-nums;
}

/* ---- Focus. Rule 4: never removed, always visible on white AND on tint. ---- */
:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible{
  outline: 2px solid transparent;   /* placeholder so Windows High Contrast paints one */
  outline-offset: 2px;
  box-shadow: var(--ac-focus);
  position: relative;
  z-index: 1;
}
/* Browsers that still lack :focus-visible get the ring on :focus. */
@supports not selector(:focus-visible){
  :where(a, button, input, select, textarea, summary, [tabindex]):focus{
    box-shadow: var(--ac-focus);
  }
}

/* ---- Utilities (ac-u-*) — single purpose only ---- */
.ac-u-visually-hidden{
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  clip: rect(0 0 0 0); clip-path: inset(50%);
  overflow: hidden; white-space: nowrap;
}
.ac-u-truncate{
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ac-u-muted{ color: var(--aisa-muted-gray); }

/* Admin-gated affordances. CSS is the safety net; JsApp must ALSO omit the
   class when capabilities.canViewMetrics is true for a non-ADMIN LEAD, or that
   lead will never see the Metrics tab. */
.ac-app:not([data-ac-role="ADMIN"]) .ac-u-admin-only{ display: none !important; }

/* ---- Skip link ---- */
.ac-skip-link{
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: calc(var(--ac-z-toast) + 1);
  padding: 12px 18px;
  background: var(--aisa-purple);
  color: var(--aisa-white);
  font-weight: 700;
  border-radius: 0 0 var(--radius) 0;
  text-decoration: none;
}
.ac-skip-link:focus{ left: 0; }


/* ===========================================================================
   §2  APP SHELL
   ======================================================================== */
.ac-app{
  max-width: var(--ac-max-w);
  margin-inline: auto;
  padding-inline: var(--ac-gutter);
  /* Bottom room for the FAB and the toast stack on phones. */
  padding-block: 0 calc(96px + env(safe-area-inset-bottom));
}

.ac-main{ outline: none; }
.ac-main:focus-visible{ box-shadow: var(--ac-focus); border-radius: var(--radius); }

.ac-view-heading{
  font-size: 1.1875rem;
  margin: 14px 0 10px;
  letter-spacing: -0.01em;
}
.ac-view-root{ min-height: 200px; }
.ac-view-root[aria-busy="true"]{ opacity: .6; }

/* ---- Eyebrow. ALL CAPS, tracked, always directly above a heading. ----
   THE GOLD DECISION, stated once: --aisa-gold is 2.1:1 on white, which fails
   AA at any size. COMPONENTS.md §1 both permits gold eyebrows and forbids gold
   on small labels; this resolves that contradiction in favour of legibility.
   The gold is present as the 3px accent RULE (an explicitly sanctioned gold
   use); the label text itself is --aisa-purple at 16:1. Nothing is lost
   visually and nothing is unreadable. */
.ac-eyebrow{
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 4px;
  font-size: .6875rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--aisa-muted-gray);
}
.ac-eyebrow--gold{ color: var(--aisa-purple); }
.ac-eyebrow--gold::before{
  content: "";
  flex: none;
  width: 16px;
  height: 3px;
  border-radius: 2px;
  background: var(--aisa-gold);
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.ac-eyebrow--muted{ color: var(--aisa-muted-gray); }

/* ---- Buttons ---- */
.ac-btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--ac-tap);
  padding: 0 16px;
  border: 1.5px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--aisa-purple);
  font: inherit;
  font-weight: 500;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease, color .12s ease;
}
.ac-btn--primary{
  background: var(--aisa-purple);
  border-color: var(--aisa-purple);
  color: var(--aisa-white);
  font-weight: 700;
}
.ac-btn--primary:hover{ background: var(--aisa-purple-hover); border-color: var(--aisa-purple-hover); }

.ac-btn--secondary{
  background: var(--aisa-white);
  border-color: var(--aisa-purple);
  color: var(--aisa-purple);
  font-weight: 700;
}
.ac-btn--secondary:hover{ background: var(--aisa-purple-tint); }

.ac-btn--ghost{
  background: var(--aisa-white);
  border-color: var(--aisa-purple-border);
  color: var(--aisa-purple);
}
.ac-btn--ghost:hover{ background: var(--aisa-purple-tint); border-color: var(--aisa-purple); }

.ac-btn--link{
  min-height: 0;
  padding: 4px 2px;
  border: 0;
  color: var(--aisa-purple);
  font-weight: 500;
  text-decoration: underline;
}
.ac-btn--link:hover{ color: var(--aisa-purple-hover); }

.ac-btn--icon{ padding: 0 12px; }
.ac-btn--sm{ min-height: 32px; padding: 0 10px; font-size: .8125rem; }

/* Suggestion buttons in the evaluation panel: an alternative DATE offered as a
   real control. Green edge + arrow glyph from JS, not colour alone. */
.ac-btn--suggest{
  justify-content: flex-start;
  width: 100%;
  background: var(--aisa-white);
  border-color: var(--state-ok);
  color: var(--aisa-near-black);
  font-weight: 500;
  text-align: left;
}
.ac-btn--suggest:hover{ background: var(--aisa-purple-tint); }

/* Disabled controls stay FOCUSABLE (aria-disabled), so a screen-reader user
   lands on them and hears why. Never `pointer-events:none` — that would stop
   the delegated listener firing, and the reason would never be announced. */
.ac-btn[aria-disabled="true"],
.ac-btn:disabled{
  opacity: .55;
  cursor: not-allowed;
  background: var(--aisa-purple-tint);
  border-color: var(--aisa-purple-border);
  color: var(--aisa-muted-gray);
  /* non-colour cue: a flat, borderless, weight-400 control reads as inert */
  font-weight: 400;
}
.ac-btn.is-loading{ position: relative; color: var(--aisa-white); }

/* ---- Pills (status words, never a bare colour) ---- */
.ac-pill{
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border: 1.5px solid var(--aisa-purple-border);
  border-radius: 999px;
  background: var(--aisa-white);
  color: var(--aisa-near-black);
  font-size: .75rem;
  font-weight: 700;
  white-space: nowrap;
}
.ac-pill--ok{ border-color: var(--state-ok); color: var(--state-ok); }
.ac-pill--pending{
  border-color: var(--state-warn-border);
  background: var(--state-warn-fill);
  color: var(--aisa-near-black);
  border-style: dashed;      /* non-colour cue for "not final" */
}

/* ---- Search-result highlight ---- */
.ac-mark{
  background: var(--state-warn-fill);
  color: var(--aisa-near-black);
  border-bottom: 2px solid var(--state-warn-border);
  padding: 0 1px;
  border-radius: 2px;
}


/* ===========================================================================
   §3  HEADER, FRESHNESS CHIP, FOOTER
   ======================================================================== */
.ac-header{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  padding-block: 14px 12px;
  border-bottom: 1px solid var(--aisa-purple-border);
}
.ac-header__brand{ min-width: 0; }
.ac-header__title{
  font-size: 1.0625rem;
  letter-spacing: -0.01em;
}
.ac-header__right{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

/* ---- 3.1 Freshness chip — permanently visible, never behind a menu ---- */
.ac-freshness{
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 36px;
  padding: 0 12px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: transparent;
  color: var(--aisa-muted-gray);
  font: inherit;
  font-size: .8125rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.ac-freshness__glyph{ font-size: .875rem; line-height: 1; }
.ac-freshness:hover{ background: var(--aisa-purple-tint); color: var(--aisa-purple); }

.ac-freshness[data-ac-state="FRESH"]{ color: var(--aisa-muted-gray); }
.ac-freshness[data-ac-state="STALE"]{
  border-color: var(--state-warn-border);
  background: var(--state-warn-fill);
  color: var(--aisa-near-black);
  font-weight: 700;
}
.ac-freshness[data-ac-state="NEW"]{
  background: var(--aisa-purple);
  border-color: var(--aisa-purple);
  color: var(--aisa-white);
  font-weight: 700;
}
.ac-freshness[data-ac-state="NEW"]:hover{ background: var(--aisa-purple-hover); }
.ac-freshness[data-ac-state="OFFLINE"]{
  border-style: dashed;
  border-color: var(--aisa-muted-gray);
  color: var(--aisa-muted-gray);
}
.ac-freshness[data-ac-state="REFRESHING"] .ac-freshness__glyph{
  animation: ac-spin 1s linear infinite;
}
@keyframes ac-spin{ to{ transform: rotate(360deg); } }

/* ---- User chip ---- */
.ac-user{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: .8125rem;
  color: var(--aisa-near-black);
}
.ac-user__name{ font-weight: 500; }
.ac-user__role{
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--aisa-purple);
  color: var(--aisa-white);
  font-size: .6875rem;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}

/* ---- 3.4 Footer ---- */
.ac-footer{
  display: flex;
  flex-wrap: wrap;
  gap: 6px 20px;
  margin-top: 28px;
  padding-block: 16px 8px;
  border-top: 1px solid var(--aisa-purple-border);
  font-size: .8125rem;
  color: var(--aisa-muted-gray);
}
.ac-footer__item{ min-width: 0; }
.ac-footer a{ color: var(--aisa-purple); }


/* ===========================================================================
   §4  BANNERS
   ======================================================================== */
.ac-banners{ display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.ac-banners:empty{ margin-top: 0; }

.ac-banner{
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 12px;
  border: 1px solid var(--aisa-purple-border);
  border-left-width: 4px;
  border-radius: var(--radius);
  background: var(--aisa-white);
  font-size: .875rem;
  color: var(--aisa-near-black);
}
.ac-banner__glyph{
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--aisa-purple-tint);
  color: var(--aisa-purple);
  font-size: .8125rem;
  font-weight: 700;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.ac-banner__text{ flex: 1 1 auto; min-width: 0; }
.ac-banner__close{
  flex: none;
  width: 32px; height: 32px;
  border: 0; border-radius: var(--radius);
  background: transparent;
  color: var(--aisa-muted-gray);
  font-size: 1.125rem;
  line-height: 1;
  cursor: pointer;
}
.ac-banner__close:hover{ background: var(--aisa-purple-tint); color: var(--aisa-purple); }

/* GOLD — the unconfirmed-dates banner. Gold as a 4px edge + glyph fill with
   purple ink (8.2:1), never as text on white. */
.ac-banner--gold{ border-left-color: var(--aisa-gold); }
.ac-banner--gold .ac-banner__glyph{ background: var(--aisa-gold); color: var(--aisa-purple); }

.ac-banner--info{ border-left-color: var(--aisa-purple); background: var(--aisa-purple-tint); }

.ac-banner--alert{
  border-color: var(--state-alert);
  background: var(--state-warn-fill);
  font-weight: 500;
}
.ac-banner--alert .ac-banner__glyph{ background: var(--state-alert); color: var(--aisa-white); }


/* ===========================================================================
   §5  COHORT BAR — top-level navigation. Cohort is NOT a filter.
   ======================================================================== */
.ac-cohort-bar{
  padding-block: 12px 10px;
  border-bottom: 1px solid var(--aisa-purple-border);
}
.ac-cohort-bar > * + *{ margin-top: 8px; }
.ac-cohort-bar__note{
  font-size: .8125rem;
  color: var(--aisa-muted-gray);
  max-width: 62ch;
}

/* ---- Segmented control ---- */
.ac-segmented{
  display: inline-flex;
  flex: none;                 /* must never be squeezed: a clipped view switcher
                                 is a view the teacher cannot reach */
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}
.ac-segmented__opt{
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 38px;
  padding: 0 13px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--aisa-purple);
  font: inherit;
  font-size: .875rem;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
}
.ac-segmented__opt:hover{ background: var(--aisa-purple-tint); }
.ac-segmented__opt[aria-checked="true"]{
  background: var(--aisa-purple);
  color: var(--aisa-white);
  font-weight: 700;           /* weight change = selection survives greyscale */
}
.ac-segmented__opt[aria-checked="true"]:hover{ background: var(--aisa-purple-hover); }

/* ---- Grade / section tokens ---- */
.ac-tokens{
  display: flex;
  gap: 8px;
  flex-wrap: nowrap;
  overflow-x: auto;
  padding-bottom: 4px;        /* room for the focus ring while scrolling */
  scrollbar-width: thin;
  overscroll-behavior-x: contain;
}
.ac-token{
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--ac-tap);
  min-height: var(--ac-tap);
  padding: 0 10px;
  border: 1.5px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
  color: var(--aisa-purple);
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}
.ac-token--wide{ padding: 0 16px; }
.ac-token:hover{ background: var(--aisa-purple-tint); border-color: var(--aisa-purple); }
.ac-token[aria-checked="true"],
.ac-token[aria-pressed="true"]{
  background: var(--aisa-purple);
  border-color: var(--aisa-purple);
  color: var(--aisa-white);
  font-weight: 700;
}
.ac-tokens--sections .ac-token{ border-style: dashed; }   /* sections read as a sub-choice */
.ac-tokens--sections .ac-token[aria-checked="true"],
.ac-tokens--sections .ac-token[aria-pressed="true"]{ border-style: solid; }


/* ===========================================================================
   §6  TOOLBAR, FILTERS, CHIP ROW
   ======================================================================== */
.ac-toolbar{
  position: sticky;
  top: 0;
  z-index: var(--ac-z-sticky);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding-block: 10px;
  background: var(--aisa-white);
  border-bottom: 1px solid var(--aisa-purple-border);
}
.ac-toolbar__dates{
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1 1 auto;
  min-width: 0;
}
.ac-toolbar__period{
  min-width: 0;
  padding-inline: 4px;
  font-size: 1rem;
  font-weight: 700;
  color: var(--aisa-purple);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ac-toolbar__filters{
  position: relative;          /* anchor for .ac-popover — see STYLE_NOTES */
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  flex: 1 1 260px;
  min-width: 0;
}

/* The 2px progress bar under the toolbar. One of the four sanctioned gold uses. */
.ac-progress{
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  overflow: hidden;
  background: var(--aisa-purple-tint);
}
.ac-progress::after{
  content: "";
  display: block;
  width: 40%;
  height: 100%;
  background: var(--aisa-gold);
  animation: ac-progress 1.1s ease-in-out infinite;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
@keyframes ac-progress{
  0%{ transform: translateX(-100%); }
  100%{ transform: translateX(250%); }
}

/* ---- Filter buttons ---- */
.ac-filter-btn{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: var(--ac-tap);
  padding: 0 12px;
  border: 1.5px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
  color: var(--aisa-purple);
  font: inherit;
  font-size: .875rem;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
}
.ac-filter-btn:hover{ background: var(--aisa-purple-tint); border-color: var(--aisa-purple); }
.ac-filter-btn[aria-expanded="true"]{ border-color: var(--aisa-purple); background: var(--aisa-purple-tint); }
/* The count badge is the affordance that prevents "why is my calendar empty?" */
.ac-filter-btn__count{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px; height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--aisa-purple);
  color: var(--aisa-white);
  font-size: .6875rem;
  font-weight: 700;
}

/* ---- Search ---- */
.ac-search{ flex: 1 1 180px; min-width: 140px; }
.ac-search__input{
  width: 100%;
  min-height: var(--ac-tap);
  padding: 0 12px;
  border: 1.5px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
  color: var(--aisa-near-black);
  font: inherit;
  font-size: 1rem;              /* keep >=16px: iOS zooms the whole app otherwise */
}
.ac-search__input::placeholder{ color: var(--aisa-muted-gray); opacity: 1; }
.ac-search__input:hover{ border-color: var(--aisa-purple); }

/* Note explaining WRITE_SCOPE='LEADS_ONLY' where the Add button would be. */
.ac-writescope-note{
  flex: 1 1 100%;
  font-size: .8125rem;
  color: var(--aisa-muted-gray);
}

/* ---- 6.1 Filter popover ----
   Anchored to .ac-toolbar__filters (the nearest positioned ancestor). JsApp
   must insert it as a child of that container; see BUILD/STYLE_NOTES.md. */
.ac-popover{
  position: absolute;
  top: calc(100% + 6px);
  inset-inline-start: 0;
  z-index: var(--ac-z-popover);
  min-width: 240px;
  max-width: min(340px, calc(100vw - 2 * var(--ac-gutter)));
  max-height: 60vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
  box-shadow: var(--ac-shadow-2);
}
.ac-popover [role="group"]{ padding-block: 4px; }
.ac-popover__opt{
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--ac-tap);
  padding: 0 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: .875rem;
}
.ac-popover__opt:hover{ background: var(--aisa-purple-tint); }
.ac-popover__opt:focus-within{ box-shadow: var(--ac-focus); }
.ac-popover__label{ flex: 1 1 auto; min-width: 0; }
.ac-popover__count{ flex: none; color: var(--aisa-muted-gray); font-size: .8125rem; }

/* ---- 6.3 Applied-filter chip row ---- */
.ac-chiprow{
  display: flex;
  align-items: center;
  gap: 8px;
  padding-block: 10px;
  overflow-x: auto;
  scrollbar-width: thin;
  overscroll-behavior-x: contain;
}
.ac-fchip{
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 4px 4px 11px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: 999px;
  background: var(--aisa-purple-tint);
  color: var(--aisa-near-black);
  font-size: .8125rem;
  font-weight: 500;
  white-space: nowrap;
}
.ac-fchip__x{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px; height: 26px;
  border: 0; border-radius: 50%;
  background: transparent;
  color: var(--aisa-purple);
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
}
.ac-fchip__x:hover{ background: var(--aisa-white); }


/* ===========================================================================
   §7  MONTH VIEW — five school-day columns, Monday to Friday
   ======================================================================== */
.ac-month-grid{
  width: 100%;
  table-layout: fixed;
  border-collapse: separate;
  /* Separate spacing (not collapse) so every cell is its own rounded card and
     the severity marker on the left edge unambiguously belongs to THAT day. */
  border-spacing: 2px;
  margin-top: 8px;
}
.ac-month-grid__dow{
  padding: 6px 4px;
  border-radius: 6px;
  background: var(--aisa-purple-tint);
  color: var(--aisa-purple);
  font-size: .6875rem;
  font-weight: 700;
  letter-spacing: .04em;
  text-align: center;
  /* Wrap rather than clip at 390px / 200% zoom — "Monday" must stay "Monday". */
  white-space: normal;
  overflow-wrap: anywhere;
}

/* ---- 7.2 / 7.6 Day cell ----
   A <td> stays a table-cell (display:flex would break the row), so the children
   flow in normal block order. Child order is frozen by COMPONENTS.md §7.2. */
.ac-day-cell{
  position: relative;
  vertical-align: top;
  height: var(--ac-cell-min-h-sm);      /* on a td, height behaves as a minimum */
  padding: 4px 3px;
  border: 1px solid var(--aisa-purple-border);
  border-left-width: 3px;
  border-left-color: var(--aisa-purple-border);
  border-radius: 6px;
  background: var(--aisa-white);
  color: var(--aisa-near-black);
  text-align: center;
  cursor: pointer;
  overflow: hidden;
}
.ac-day-cell:hover{ border-color: var(--aisa-purple); }
.ac-day-cell:focus-visible{
  /* An inset outline: never clipped by the cell's own overflow. */
  outline: 3px solid var(--aisa-purple);
  outline-offset: -3px;
  box-shadow: none;
}
.ac-day-cell.is-selected{ outline: 2px solid var(--aisa-purple); outline-offset: -2px; }
/* "Today" = ring PLUS a filled day numeral PLUS the visually-hidden word
   "Today" that JsApp renders. The numeral treatment is what survives while the
   cell also has a focus outline. */
.ac-day-cell.is-today{ box-shadow: inset 0 0 0 2px var(--aisa-purple); }
.ac-day-cell.is-today .ac-day-cell__num{
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--aisa-purple);
  color: var(--aisa-white);
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}

.ac-day-cell__head{
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 4px;
}
.ac-day-cell__num{
  font-size: .875rem;
  font-weight: 700;
  color: var(--aisa-purple);
  line-height: 1.2;
}

/* --- Level treatments. COMPONENTS.md §7.3, exactly. ---
   The cell fill NEVER uses saturated --load-heavy / --load-over: those live in
   the meter segments and the left border, so the grid stays a white/tint
   surface and severity reads as a marker, not a wash. */
.ac-day-cell[data-ac-level="NONE"]{
  background: var(--load-none);
  border-left-width: 1px;
  border-left-color: var(--aisa-purple-border);
}
.ac-day-cell[data-ac-level="LIGHT"]{
  background: var(--load-light);
  border-left-width: 1px;
  border-left-color: var(--aisa-purple-border);
}
.ac-day-cell[data-ac-level="MODERATE"]{
  background: var(--load-light);
  border-left: 3px solid var(--load-moderate);
}
.ac-day-cell[data-ac-level="HEAVY"]{
  background: var(--load-light);
  border-left: 3px solid var(--load-heavy);
}
.ac-day-cell[data-ac-level="OVER"]{
  background: var(--state-warn-fill);
  border-left: 4px double var(--load-over);   /* a DOUBLE rule: a shape cue, not a hue cue */
}
.ac-day-cell[data-ac-level="MIXED"]{
  background: var(--aisa-purple-tint);
  border-left: 1px solid var(--aisa-purple-border);
}
.ac-day-cell[data-ac-level="OVER"] .ac-meter__count{
  color: var(--load-over);
  font-weight: 700;
}

/* --- Non-school days: 45 degree hatch PLUS the label. Pattern + words, so it
       survives greyscale printing and colour-blind readers. --- */
.ac-day-cell--closed{
  cursor: default;
  background-color: var(--aisa-white);
  background-image: repeating-linear-gradient(
    45deg,
    var(--aisa-purple-border) 0 1px,
    transparent 1px 7px
  );
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.ac-day-cell--closed:hover{ border-color: var(--aisa-purple-border); }
.ac-day-cell__closed-label{
  margin-top: 2px;
  font-size: .625rem;
  font-weight: 500;
  color: var(--aisa-muted-gray);
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.ac-day-cell__chips{
  display: none;               /* no titles at 390px — see §7.6 rationale */
  flex-direction: column;
  gap: 3px;
  margin-top: 4px;
  overflow: hidden;
}
.ac-day-cell__more{
  display: none;
  width: 100%;
  margin-top: 3px;
  padding: 2px 4px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--aisa-purple);
  font: inherit;
  font-size: .6875rem;
  font-weight: 700;
  text-align: left;
  text-decoration: underline;
  cursor: pointer;
}
.ac-day-cell__more:hover{ background: var(--aisa-white); }

/* The "N of M shown" line. Present only while a filter is active — the meter
   above it always shows the TRUE unfiltered cohort load (COMPONENTS.md §6.4). */
.ac-day-cell__filtered{
  margin-top: 2px;
  font-size: .625rem;
  font-style: italic;
  color: var(--aisa-muted-gray);
}

/* Always in the DOM so keyboard users reach it; only ever conditionally
   VISIBLE. Hidden on coarse pointers, where the whole cell is the tap target
   and the FAB is the add affordance. */
.ac-day-cell__add{
  position: absolute;
  top: 2px; right: 2px;
  width: 28px; height: 28px;      /* >= WCAG 2.2 AA 24px minimum for fine pointers */
  display: none;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--aisa-purple-border);
  border-radius: 6px;
  background: var(--aisa-white);
  color: var(--aisa-purple);
  font: inherit;
  font-size: 1rem;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
}
.ac-day-cell__add:hover{ background: var(--aisa-purple); color: var(--aisa-white); }

/* ---- THE LOAD METER. Four segments + numeral + word. All three, always. ---- */
.ac-meter{
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  /* Shrink-to-fit so the severity pattern behind it is a compact BAND around
     the reading, not a wash across the whole cell. */
  width: fit-content;
  max-width: 100%;
  margin: 3px auto 0;
  font-size: .75rem;
  line-height: 1.2;
}
.ac-meter > *{ position: relative; z-index: 1; }

/* Severity pattern sits BEHIND the meter row: sparse dots at MODERATE,
   diagonal hatch at HEAVY, dense cross-hatch at OVER. Nothing depends on it
   surviving — it is the fourth signal, after count, numeral and word. */
.ac-meter::before{
  content: "";
  position: absolute;
  inset: -3px -5px;
  z-index: 0;
  border-radius: 5px;
  pointer-events: none;
  opacity: .55;
  color: var(--_lvl);
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
/* Both forms are needed: the level attribute sits on the day cell (ancestor) in
   the month grid, but on the meter itself in the day sheet and week header. */
[data-ac-level="MODERATE"] .ac-meter::before,
.ac-meter[data-ac-level="MODERATE"]::before{
  background-image: radial-gradient(currentColor .9px, transparent 1.1px);
  background-size: 6px 6px;
}
[data-ac-level="HEAVY"] .ac-meter::before,
.ac-meter[data-ac-level="HEAVY"]::before{
  background-image: repeating-linear-gradient(45deg, currentColor 0 1px, transparent 1px 7px);
  opacity: .38;
}
[data-ac-level="OVER"] .ac-meter::before,
.ac-meter[data-ac-level="OVER"]::before{
  background-image:
    repeating-linear-gradient(45deg,  currentColor 0 1px, transparent 1px 4px),
    repeating-linear-gradient(-45deg, currentColor 0 1px, transparent 1px 4px);
  opacity: .35;
}

.ac-meter__bar{
  display: inline-flex;
  gap: 2px;
  flex: none;
}
.ac-meter__seg{
  display: block;
  width: 8px;
  height: 7px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: 2px;
  background: transparent;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.ac-meter__seg.is-on{
  background: var(--_lvl-seg);
  border-color: var(--_lvl-edge);
}
.ac-meter__count{
  font-size: .8125rem;
  font-weight: 700;
  color: var(--aisa-near-black);
}
.ac-meter__word{
  color: var(--aisa-muted-gray);
  font-size: .6875rem;
  font-weight: 500;
  white-space: nowrap;
}
.ac-meter--mini{ gap: 3px; margin-top: 2px; }
.ac-meter--mini .ac-meter__seg{ width: 6px; height: 6px; }
.ac-meter--lg{ gap: 10px; margin: 0; justify-content: flex-start; }
.ac-meter--lg .ac-meter__seg{ width: 16px; height: 12px; border-radius: 3px; }
.ac-meter--lg .ac-meter__count{ font-size: 1.375rem; }
.ac-meter--lg .ac-meter__word{ font-size: .875rem; font-weight: 700; color: var(--aisa-near-black); }

/* ---- 7.4 Assessment chip ---- */
.ac-chip{
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
  min-height: 24px;
  padding: 2px 5px 2px 2px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: 5px;
  background: var(--aisa-white);
  color: var(--aisa-near-black);
  font: inherit;
  font-size: .75rem;
  text-align: left;
  cursor: pointer;
}
.ac-chip:hover{ border-color: var(--aisa-purple); background: var(--aisa-purple-tint); }
.ac-chip__badge{
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 30px;
  padding: 2px 4px;
  border-radius: 3px;
  background: var(--type-other);
  color: var(--type-ink);
  font-size: .625rem;
  font-weight: 700;
  letter-spacing: .03em;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
/* The ELEVEN type tokens. data-ac-color carries a TOKEN NAME, never a hex. */
.ac-chip__badge[data-ac-color="type-summ"] { background: var(--type-summ);  }
.ac-chip__badge[data-ac-color="type-quiz"] { background: var(--type-quiz);  }
.ac-chip__badge[data-ac-color="type-form"] { background: var(--type-form);  }
.ac-chip__badge[data-ac-color="type-proj"] { background: var(--type-proj);  }
.ac-chip__badge[data-ac-color="type-essay"]{ background: var(--type-essay); }
.ac-chip__badge[data-ac-color="type-pract"]{ background: var(--type-pract); }
.ac-chip__badge[data-ac-color="type-oral"] { background: var(--type-oral);  }
.ac-chip__badge[data-ac-color="type-pres"] { background: var(--type-pres);  }
.ac-chip__badge[data-ac-color="type-exam"] { background: var(--type-exam);  }
.ac-chip__badge[data-ac-color="type-ext"]  { background: var(--type-ext);   }
.ac-chip__badge[data-ac-color="type-other"]{ background: var(--type-other); }

.ac-chip__title{ flex: 1 1 auto; min-width: 0; font-weight: 500; }
/* The PARTIAL marker (§7.4.1): revealed only when the entry does not cover the
   whole selected cohort. Without it a 7-B entry reads as a whole-grade booking,
   which is exactly the misread that gets a teacher burned. */
.ac-chip__tag{
  flex: none;
  padding: 1px 5px;
  border: 1px solid var(--aisa-purple);
  border-radius: 3px;
  color: var(--aisa-purple);
  font-size: .625rem;
  font-weight: 700;
}

/* Uncounted: dashed edge + the "·" prefix JsApp adds + the accessible name. */
.ac-chip[data-ac-counts="false"]{ border-style: dashed; }
.ac-chip[data-ac-status="PENDING"] .ac-chip__badge{
  background-image: repeating-linear-gradient(45deg,
    rgb(255 255 255 / 45%) 0 2px, transparent 2px 5px);
}
.ac-chip[data-ac-status="CANCELLED"]{ opacity: .72; }
.ac-chip[data-ac-status="CANCELLED"] .ac-chip__title{ text-decoration: line-through; }
.ac-chip[data-ac-span]{ border-left: 3px solid var(--aisa-purple); }

/* ---- 7.5 Aggregate cell: the grade-token strip ----
   Token size scales with LEVEL (CSS cannot read a count without an inline
   style, and JsApp may not write one). Heavier grades therefore read larger. */
.ac-gradestrip{
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 3px;
  margin-top: 4px;
}
.ac-gradestrip__tok{
  display: inline-flex;
  align-items: baseline;
  justify-content: center;
  min-width: 22px;
  padding: 1px 4px;
  border: 1px solid var(--_lvl-edge);
  border-radius: 4px;
  background: var(--aisa-white);
  color: var(--aisa-near-black);
  font: inherit;
  font-size: .6875rem;
  font-weight: 700;
  cursor: pointer;
}
.ac-gradestrip__tok:hover{ background: var(--aisa-purple); color: var(--aisa-white); border-color: var(--aisa-purple); }
.ac-gradestrip__tok sup{ font-size: .5625rem; font-weight: 700; margin-left: 1px; }
.ac-gradestrip__tok[data-ac-level="MODERATE"]{ font-size: .75rem;   background: var(--load-light); }
.ac-gradestrip__tok[data-ac-level="HEAVY"]   { font-size: .8125rem; background: var(--load-moderate); }
.ac-gradestrip__tok[data-ac-level="OVER"]    { font-size: .875rem;  background: var(--state-warn-fill); border-width: 2px; }

/* ---- 7.7 Week strip ---- */
.ac-weekstrip{
  margin-top: 14px;
  padding: 12px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-purple-tint);
}
.ac-weekstrip__title{ font-size: .875rem; margin-bottom: 8px; }
.ac-weekstrip__days{
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 4px;
}
.ac-weekstrip__day{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-height: var(--ac-tap);
  padding: 6px 2px;
  border: 1px solid var(--aisa-purple-border);
  border-left: 3px solid var(--_lvl-edge);
  border-radius: 6px;
  background: var(--aisa-white);
}
.ac-weekstrip__dow{ font-size: .6875rem; font-weight: 700; color: var(--aisa-purple); }
.ac-weekstrip__n{ font-size: .8125rem; font-weight: 700; }
.ac-weekstrip__days--inline{ margin-top: 6px; }


/* ===========================================================================
   §8  WEEK VIEW — the view you choose a date in
   ======================================================================== */
.ac-week{ margin-top: 8px; }

.ac-week-head{
  padding: 14px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-purple-tint);
  margin-bottom: 12px;
}
.ac-week-head__load{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  margin-top: 8px;
  border: 1px solid var(--aisa-purple-border);
  border-left: 5px solid var(--_lvl-edge);
  border-radius: var(--radius);
  background: var(--aisa-white);
}
.ac-week-head__stat{ font-size: 1.125rem; font-weight: 700; color: var(--aisa-near-black); }
.ac-week-head__word{
  padding: 2px 9px;
  border: 1.5px solid var(--_lvl-edge);
  border-radius: 999px;
  font-size: .8125rem;
  font-weight: 700;
  color: var(--aisa-near-black);
}
/* Proration MUST render whenever week.prorated — a cap that silently changed
   is a cap nobody trusts. */
.ac-week-head__proration{
  margin-top: 8px;
  padding: 8px 10px;
  border-left: 3px solid var(--aisa-gold);
  border-radius: 0 6px 6px 0;
  background: var(--aisa-white);
  font-size: .8125rem;
  color: var(--aisa-near-black);
}
.ac-week-head__meta{
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin-top: 10px;
  font-size: .8125rem;
  color: var(--aisa-muted-gray);
}

/* Base = phone: five stacked day sections, never a side-scrolling grid. */
.ac-week__cols{ display: grid; grid-template-columns: 1fr; gap: 10px; }

.ac-week-col{
  border: 1px solid var(--aisa-purple-border);
  border-left: 4px solid var(--_lvl-edge);
  border-radius: var(--radius);
  background: var(--aisa-white);
  overflow: hidden;
}
.ac-week-col__head{
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 10px 12px;
  background: var(--aisa-purple-tint);
  border-bottom: 1px solid var(--aisa-purple-border);
}
.ac-week-col__title{ display: flex; align-items: baseline; gap: 6px; font-size: .9375rem; }
.ac-week-col__dow{ font-weight: 700; }
.ac-week-col__date{ font-weight: 500; color: var(--aisa-muted-gray); font-size: .8125rem; }
.ac-week-col__daytype{
  padding: 2px 8px;
  border: 1px dashed var(--aisa-muted-gray);
  border-radius: 999px;
  font-size: .75rem;
  color: var(--aisa-muted-gray);
}
.ac-week-col__head .ac-meter{ margin: 0 0 0 auto; }   /* pushed right on phone */
.ac-week-col__list{ display: flex; flex-direction: column; gap: 8px; padding: 10px; }
.ac-week-col__list:empty{ padding: 0; }

/* ---- 8.3 Assessment card ---- */
.ac-card{
  position: relative;
  padding: 10px 40px 10px 14px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
  overflow: hidden;
}
.ac-card__accent{
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--type-other);
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.ac-card__head{ display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 4px; }
.ac-card__typelabel{ font-size: .75rem; font-weight: 500; color: var(--aisa-muted-gray); }
.ac-card__title{ font-size: .9375rem; color: var(--aisa-near-black); overflow-wrap: anywhere; }
.ac-card__meta{
  display: flex;
  flex-wrap: wrap;
  gap: 2px 12px;
  margin-top: 3px;
  font-size: .8125rem;
  color: var(--aisa-near-black);
}
.ac-card__meta.ac-u-muted{ color: var(--aisa-muted-gray); }
.ac-card__subject{ font-weight: 500; }
.ac-card__uncounted{
  display: inline-block;
  margin-top: 6px;
  padding: 1px 8px;
  border: 1px dashed var(--aisa-muted-gray);
  border-radius: 999px;
  font-size: .75rem;
  color: var(--aisa-muted-gray);
}
.ac-card__menu{
  position: absolute;
  top: 6px; right: 6px;
  width: 32px; height: 32px;
  border: 0; border-radius: 6px;
  background: transparent;
  color: var(--aisa-purple);
  font: inherit;
  font-size: 1rem;
  cursor: pointer;
}
.ac-card__menu:hover{ background: var(--aisa-purple-tint); }

.ac-card[data-ac-counts="false"]{ border-style: dashed; }
.ac-card[data-ac-status="CANCELLED"] .ac-card__title{ text-decoration: line-through; }
.ac-card[data-ac-status="CANCELLED"]{ background: var(--aisa-purple-tint); }
.ac-card--span{ border-left: 4px solid var(--aisa-purple); }

/* The same eleven tokens, applied to the card accent bar. */
.ac-card[data-ac-type="SUMM"]  .ac-card__accent{ background: var(--type-summ);  }
.ac-card[data-ac-type="QUIZ"]  .ac-card__accent{ background: var(--type-quiz);  }
.ac-card[data-ac-type="FORM"]  .ac-card__accent{ background: var(--type-form);  }
.ac-card[data-ac-type="PROJ"]  .ac-card__accent{ background: var(--type-proj);  }
.ac-card[data-ac-type="ESSAY"] .ac-card__accent{ background: var(--type-essay); }
.ac-card[data-ac-type="PRACT"] .ac-card__accent{ background: var(--type-pract); }
.ac-card[data-ac-type="ORAL"]  .ac-card__accent{ background: var(--type-oral);  }
.ac-card[data-ac-type="PRES"]  .ac-card__accent{ background: var(--type-pres);  }
.ac-card[data-ac-type="EXAM"]  .ac-card__accent{ background: var(--type-exam);  }
.ac-card[data-ac-type="EXT"]   .ac-card__accent{ background: var(--type-ext);   }

/* ---- Shared lists ---- */
.ac-list{ display: flex; flex-direction: column; gap: 8px; }
.ac-list--compact{ gap: 4px; }
.ac-list--dimmed{ opacity: .6; }
.ac-list--dimmed .ac-card{ border-style: dashed; }


/* ===========================================================================
   §9  LAYERS — backdrop, drawers, day sheet
   ======================================================================== */
.ac-backdrop{
  position: fixed;
  inset: 0;
  z-index: var(--ac-z-backdrop);
  background: var(--ac-scrim);
  animation: ac-fade-in .18s ease;
}
@keyframes ac-fade-in{ from{ opacity: 0; } }

.ac-drawer-root{ position: relative; z-index: var(--ac-z-drawer); }

/* Base = phone: a full-screen sheet. Desktop turns it into a side drawer.
   The open animation is a mount animation, NOT a `.is-open` transform: a
   drawer parked off-screen by CSS that JS forgets to un-park is an invisible
   dialog with a trapped focus ring, and that failure is silent. */
.ac-drawer{
  position: fixed;
  inset: 0;
  z-index: var(--ac-z-drawer);
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 100%;
  background: var(--aisa-white);
  box-shadow: var(--ac-shadow-2);
  transition: transform .22s ease, opacity .22s ease;
  animation: ac-sheet-in .22s ease;
}
@keyframes ac-sheet-in{ from{ transform: translateY(14px); opacity: 0; } }
.ac-drawer__head{
  position: relative;
  flex: none;
  padding: 14px calc(var(--ac-tap) + 8px) 12px var(--ac-gutter);
  border-bottom: 1px solid var(--aisa-purple-border);
  background: var(--aisa-white);
  padding-top: calc(14px + env(safe-area-inset-top));
}
.ac-drawer__title{ font-size: 1.125rem; outline: none; }
.ac-drawer__title:focus-visible{ box-shadow: var(--ac-focus); border-radius: 4px; }
.ac-drawer__sub{ margin-top: 2px; font-size: .875rem; color: var(--aisa-muted-gray); }
.ac-drawer__close{
  position: absolute;
  top: calc(10px + env(safe-area-inset-top));
  right: 10px;
  width: var(--ac-tap); height: var(--ac-tap);
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--aisa-purple);
  font: inherit;
  font-size: 1.375rem;
  line-height: 1;
  cursor: pointer;
}
.ac-drawer__close:hover{ background: var(--aisa-purple-tint); border-color: var(--aisa-purple-border); }

.ac-drawer__body{
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: var(--ac-gutter);
}
.ac-drawer__body > * + *{ margin-top: 12px; }

.ac-drawer__actions{
  flex: none;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px var(--ac-gutter);
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--aisa-purple-border);
  background: var(--aisa-white);
}
.ac-drawer__actions .ac-btn{ flex: 1 1 160px; }

/* Day sheet on phone = a bottom sheet. It is the primary way to read a day. */
.ac-drawer--day{
  top: auto;
  max-height: 88vh;
  border-radius: 16px 16px 0 0;
  border-top: 1px solid var(--aisa-purple-border);
}
.ac-daytype{
  padding: 8px 10px;
  border: 1px dashed var(--aisa-muted-gray);
  border-radius: var(--radius);
  font-size: .875rem;
  color: var(--aisa-muted-gray);
}

/* Scroll lock. JsApp toggles `is-locked` on <body> when a layer opens; a class
   is used rather than an inline style because §17 forbids JS inline styles. */
body.is-locked{ overflow: hidden; }


/* ===========================================================================
   §10  BOOKING DRAWER AND FORM — this flow is the product
   ======================================================================== */
/* Sticky context bar: cohort, date and current load, at EVERY step and EVERY
   breakpoint. Context is never scrolled away. */
.ac-context-bar{
  flex: none;
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  padding: 9px var(--ac-gutter);
  border-bottom: 1px solid var(--aisa-purple-border);
  border-left: 5px solid var(--_lvl-edge);
  background: var(--aisa-purple-tint);
  font-size: .875rem;
}
.ac-context-bar__cohort{ font-weight: 700; color: var(--aisa-purple); }
.ac-context-bar__date{ font-weight: 500; }
.ac-context-bar__load{
  margin-inline-start: auto;
  padding: 2px 9px;
  border: 1.5px solid var(--_lvl-edge);
  border-radius: 999px;
  background: var(--aisa-white);
  font-weight: 700;
  white-space: nowrap;
}

.ac-steps{
  flex: none;
  display: flex;
  gap: 4px;
  padding: 10px var(--ac-gutter) 0;
}
.ac-steps__item{
  flex: 1 1 0;
  padding: 6px 4px;
  border-top: 3px solid var(--aisa-purple-border);
  font-size: .75rem;
  font-weight: 500;
  color: var(--aisa-muted-gray);
}
.ac-steps__item.is-current{
  border-top-color: var(--aisa-purple);
  color: var(--aisa-purple);
  font-weight: 700;
}

.ac-form{
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--ac-gutter);
}
.ac-form__step{ border: 0; margin: 0; padding: 0; }
.ac-form__step > * + *{ margin-top: 16px; }

.ac-form__errors{
  padding: 12px;
  border: 2px solid var(--state-alert);
  border-radius: var(--radius);
  background: var(--state-warn-fill);
  margin-bottom: 16px;
}
.ac-form__errors-title{ font-size: .9375rem; color: var(--aisa-near-black); }
.ac-form__errors-list{ margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
.ac-form__errors-list li{ list-style: disc; margin-left: 18px; }
.ac-form__errors-list a{ color: var(--state-alert); font-weight: 500; }

.ac-field{ display: flex; flex-direction: column; gap: 6px; }
.ac-field--inline{ flex-direction: row; align-items: center; gap: 10px; }
.ac-field__label{ font-size: .875rem; font-weight: 700; color: var(--aisa-purple); }
.ac-field__hint{ font-size: .8125rem; color: var(--aisa-muted-gray); }
/* The "no student names" hint. Mandatory, permanent, and visually load-bearing:
   free-text notes are the only realistic PII leak path in this system. */
.ac-field__hint--strong{
  padding: 7px 10px;
  border-left: 3px solid var(--state-warn-border);
  border-radius: 0 6px 6px 0;
  background: var(--state-warn-fill);
  color: var(--aisa-near-black);
  font-weight: 500;
}
.ac-field__count{ align-self: flex-end; font-size: .75rem; color: var(--aisa-muted-gray); }

.ac-input, .ac-select, .ac-textarea{
  width: 100%;
  min-height: var(--ac-tap);
  padding: 9px 12px;
  border: 1.5px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
  color: var(--aisa-near-black);
  font: inherit;
  font-size: 1rem;              /* keep >=16px on phones */
}
.ac-input:hover, .ac-select:hover, .ac-textarea:hover{ border-color: var(--aisa-purple); }
.ac-input[readonly]{ background: var(--aisa-purple-tint); color: var(--aisa-muted-gray); }
.ac-input--num{ max-width: 9rem; }
.ac-textarea{ min-height: 88px; resize: vertical; line-height: 1.45; }
.ac-select{
  appearance: none;
  padding-right: 34px;
  /* Chevron drawn in CSS so no image request is needed inside the sandbox. */
  background-image:
    linear-gradient(45deg, transparent 50%, var(--aisa-purple) 50%),
    linear-gradient(135deg, var(--aisa-purple) 50%, transparent 50%);
  background-position: calc(100% - 18px) calc(50% + 2px), calc(100% - 12px) calc(50% + 2px);
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
}
/* Invalid: a 2px solid edge AND the error-summary link AND aria-describedby
   text. Colour is the third signal, never the first. */
.ac-input[aria-invalid="true"],
.ac-select[aria-invalid="true"],
.ac-textarea[aria-invalid="true"]{
  border-width: 2px;
  border-color: var(--state-alert);
  background: var(--state-warn-fill);
}
.ac-checkbox{
  width: 22px; height: 22px;
  margin: 0;
  accent-color: var(--aisa-purple);
  flex: none;
}
.ac-field--inline .ac-field__label{ min-height: var(--ac-tap); display: flex; align-items: center; }

.ac-summary{
  padding: 12px 14px;
  border: 1px solid var(--aisa-purple-border);
  border-left: 4px solid var(--aisa-gold);
  border-radius: var(--radius);
  background: var(--aisa-purple-tint);
  font-size: .875rem;
}
.ac-summary dt{ font-weight: 700; color: var(--aisa-purple); font-size: .75rem;
                text-transform: uppercase; letter-spacing: .06em; }
.ac-summary dd{ margin: 0 0 8px; }

/* ---- 10.1 Conflict card. No silent overwrite, ever. ---- */
.ac-conflict{
  padding: 14px;
  border: 2px solid var(--state-alert);
  border-radius: var(--radius);
  background: var(--state-warn-fill);
}
.ac-conflict__title{ font-size: 1rem; color: var(--aisa-near-black); margin-bottom: 10px; }
.ac-conflict__cols{ display: grid; grid-template-columns: 1fr; gap: 10px; }
.ac-conflict__col{
  padding: 10px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
}
.ac-conflict__col h4{ font-size: .8125rem; text-transform: uppercase; letter-spacing: .06em; }
.ac-conflict__actions{ display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.ac-conflict__actions .ac-btn{ flex: 1 1 150px; }

.ac-difflist{ margin-top: 6px; font-size: .8125rem; }
.ac-difflist dt{ font-weight: 700; color: var(--aisa-muted-gray); font-size: .75rem; }
.ac-difflist dd{ margin: 0 0 6px; color: var(--aisa-near-black); }


/* ===========================================================================
   §11  EVALUATION PANEL — readable in under ten seconds
   ======================================================================== */
.ac-eval{
  padding: 14px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
}
.ac-eval > * + *{ margin-top: 10px; }
.ac-eval[data-ac-verdict="WARN"]{
  border: 2px solid var(--state-warn-border);
  background: var(--state-warn-fill);
}
.ac-eval[data-ac-verdict="BLOCK"]{
  border: 2px solid var(--state-alert);
  background: var(--state-warn-fill);
}
/* A re-check in flight keeps the PREVIOUS result dimmed. It never blanks — a
   blank panel reads as "nothing scheduled", which is the one lie this tool
   must never tell. */
.ac-eval.is-loading{ opacity: .62; }

/* 1. Severity chip — glyph + word + colour, at heading size */
.ac-eval__chip{
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 12px;
  border: 2px solid var(--_lvl-edge);
  border-radius: 999px;
  background: var(--aisa-white);
  color: var(--aisa-near-black);
  font-size: .9375rem;
  font-weight: 700;
}
.ac-eval__chip[data-ac-level="NONE"]{ border-color: var(--state-ok); color: var(--state-ok); }
.ac-eval__glyph{ font-size: 1rem; line-height: 1; }
.ac-eval__word{ letter-spacing: .01em; }

/* 2. Headline — largest text on the card */
.ac-eval__headline{ font-size: 1.0625rem; color: var(--aisa-near-black); }
.ac-eval__detail{ font-size: .875rem; color: var(--aisa-near-black); }

/* 3. Day strip — answers "then when?" without another click */
.ac-daystrip{
  display: flex;
  gap: 6px;
  padding-bottom: 4px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  overscroll-behavior-x: contain;
  scrollbar-width: thin;
}
.ac-daystrip__day{ flex: 1 0 60px; scroll-snap-align: center; }
.ac-daystrip__day > button,
.ac-daystrip__day > span{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  width: 100%;
  min-height: var(--ac-tap);
  padding: 6px 4px;
  border: 1px solid var(--aisa-purple-border);
  border-top: 4px solid var(--_lvl-edge);
  border-radius: 6px;
  background: var(--aisa-white);
  color: var(--aisa-near-black);
  font: inherit;
  cursor: pointer;
}
.ac-daystrip__day > span{ cursor: default; }
.ac-daystrip__day > button:hover{ background: var(--aisa-purple-tint); border-color: var(--aisa-purple); }
.ac-daystrip__dow{ font-size: .6875rem; font-weight: 700; color: var(--aisa-purple); }
.ac-daystrip__glyph{ font-size: .75rem; line-height: 1; }
.ac-daystrip__n{ font-size: .875rem; font-weight: 700; }
.ac-daystrip__closed{ font-size: .625rem; font-weight: 700; color: var(--aisa-muted-gray); }
/* The currently chosen day: a solid ring, not just a tint. */
.ac-daystrip__day.is-proposed > button{
  box-shadow: inset 0 0 0 2px var(--aisa-purple);
  font-weight: 700;
}
.ac-daystrip__day--closed > span{
  background-image: repeating-linear-gradient(45deg,
    var(--aisa-purple-border) 0 1px, transparent 1px 7px);
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}

/* 4. Week meter */
.ac-eval__week{
  padding: 10px 12px;
  border: 1px solid var(--aisa-purple-border);
  border-left: 5px solid var(--_lvl-edge);
  border-radius: var(--radius);
  background: var(--aisa-white);
}
.ac-eval__weekstat{ margin-top: 6px; font-size: .875rem; color: var(--aisa-near-black); }
/* The one "stat numeral" in the booking flow. Purple, not gold: gold is 2.1:1
   on white and this number is the thing a teacher must read fastest. The gold
   accent lives on the card edge instead. */
.ac-stat-num{
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1;
  color: var(--aisa-purple);
  margin-right: 4px;
}
.ac-eval__proration{
  margin-top: 8px;
  padding: 7px 10px;
  border-left: 3px solid var(--aisa-gold);
  border-radius: 0 6px 6px 0;
  background: var(--aisa-purple-tint);
  font-size: .8125rem;
}

/* 6. Next steps */
.ac-eval__steps{ display: flex; flex-direction: column; gap: 6px; }
.ac-eval__step-text{ font-size: .875rem; color: var(--aisa-near-black); }

/* 7. Secondary findings */
.ac-eval__findings{ display: flex; flex-direction: column; gap: 8px; }
.ac-finding{
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 8px;
  padding: 9px 11px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
}
.ac-finding[data-ac-enforcement="WARN"]{ border-left: 4px solid var(--state-warn-border); }
.ac-finding[data-ac-enforcement="BLOCK"]{ border-left: 4px solid var(--state-alert); }
.ac-finding[data-ac-enforcement="INFO"]{ border-left: 4px solid var(--aisa-purple-border); }
.ac-finding__glyph{ grid-row: 1 / span 2; font-size: .9375rem; line-height: 1.3; }
.ac-finding__headline{ font-size: .875rem; font-weight: 700; color: var(--aisa-near-black); }
.ac-finding__detail{ font-size: .8125rem; color: var(--aisa-muted-gray); }


/* ===========================================================================
   §12  METRICS VIEW
   ======================================================================== */
.ac-metrics > * + *{ margin-top: 16px; }
.ac-metrics__head{
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  padding-top: 8px;
}

.ac-stats{ display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.ac-stats--inline{ grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.ac-stat{
  padding: 12px 14px 14px;
  border: 1px solid var(--aisa-purple-border);
  border-top: 4px solid var(--aisa-gold);   /* sanctioned gold: a card accent bar */
  border-radius: var(--radius);
  background: var(--aisa-purple-tint);
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.ac-stat[data-ac-tone="ALERT"]{ border-top-color: var(--state-alert); background: var(--state-warn-fill); }
.ac-stat[data-ac-tone="OK"]{ border-top-color: var(--state-ok); }
/* COMPONENTS.md §12.1 PERMITS --aisa-gold here; it does not require it. At
   2.1:1 on any background we ship, a gold numeral would fail AA even as large
   text, so the numeral is purple (16:1) and the gold is the bar above it. */
.ac-stat__num{
  font-size: 2.125rem;
  font-weight: 700;
  line-height: 1.05;
  color: var(--aisa-purple);
  letter-spacing: -0.02em;
}
.ac-stat__of{ font-size: 1rem; font-weight: 500; color: var(--aisa-muted-gray); }
.ac-stat__sub{ margin-top: 4px; font-size: .8125rem; color: var(--aisa-muted-gray); }

.ac-card-panel{
  padding: 14px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
}
.ac-panel__title{ font-size: 1rem; }
.ac-panel__lede{ margin-top: 4px; font-size: .875rem; color: var(--aisa-muted-gray); }
/* Mandatory wherever a number is a proxy. A dashboard reporting only "clashes
   avoided" is propaganda; avoided alongside "saved anyway" is a conversation. */
.ac-panel__note{
  margin-top: 10px;
  padding: 9px 11px;
  border-left: 3px solid var(--aisa-purple-border);
  border-radius: 0 6px 6px 0;
  background: var(--aisa-purple-tint);
  font-size: .8125rem;
  color: var(--aisa-muted-gray);
}

.ac-tablewrap{
  margin-top: 10px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  border: 1px solid var(--aisa-purple-border);
  border-radius: var(--radius);
}
.ac-table{ width: 100%; border-collapse: collapse; font-size: .875rem; }
.ac-table th, .ac-table td{
  padding: 9px 12px;
  text-align: left;
  border-bottom: 1px solid var(--aisa-purple-border);
  white-space: nowrap;
}
.ac-table thead th{
  background: var(--aisa-purple);
  color: var(--aisa-white);
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.ac-table tbody th{ color: var(--aisa-purple); font-weight: 700; }
.ac-table tbody tr:nth-child(even){ background: var(--aisa-purple-tint); }
.ac-table tbody tr:last-child th,
.ac-table tbody tr:last-child td{ border-bottom: 0; }

/* The bar is decoration; the number beside it is the data. */
.ac-bar{
  display: inline-block;
  vertical-align: middle;
  width: 78px; height: 9px;
  margin-right: 7px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: 999px;
  background: var(--aisa-white);
  overflow: hidden;
}
.ac-bar > i{
  display: block;
  height: 100%;
  background: var(--aisa-purple);   /* JsApp sets only `width` inline */
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.ac-bar__num{ font-weight: 700; font-size: .8125rem; }

.ac-disclosure{
  margin-top: 12px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
}
/* Deliberately NOT display:flex — that suppresses the native disclosure
   triangle in Chrome, and the triangle is the only affordance that says this
   thing opens. */
.ac-disclosure > summary{
  min-height: var(--ac-tap);
  padding: 12px;
  color: var(--aisa-purple);
  font-weight: 700;
  font-size: .875rem;
  cursor: pointer;
}
.ac-disclosure > summary:hover{ background: var(--aisa-purple-tint); }
.ac-disclosure[open] > summary{ border-bottom: 1px solid var(--aisa-purple-border); }
.ac-disclosure .ac-tablewrap{ margin: 0; border: 0; border-radius: 0; }


/* ===========================================================================
   §13  SYSTEM STATES — loading, empty, error, offline
   ======================================================================== */
/* 13.1 Skeleton. Correct 5-column geometry, so nothing shifts when data lands. */
.ac-skeleton{ margin-top: 8px; }
.ac-skeleton__row{
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 2px;
  margin-bottom: 2px;
}
.ac-skeleton__cell{
  display: block;
  height: var(--ac-cell-min-h-sm);
  border-radius: 6px;
  background: var(--aisa-purple-tint);
  background-image: linear-gradient(90deg,
    var(--aisa-purple-tint) 0%, var(--aisa-white) 50%, var(--aisa-purple-tint) 100%);
  background-size: 200% 100%;
  animation: ac-shimmer 1.3s linear infinite;
}
@keyframes ac-shimmer{ to{ background-position: -200% 0; } }

/* 13.2 Empty — three kinds, and the difference is the whole point. */
.ac-empty{
  margin-top: 12px;
  padding: 22px 18px;
  border: 1px solid var(--aisa-purple-border);
  border-radius: var(--radius);
  background: var(--aisa-white);
  text-align: center;
}
.ac-empty__title{ font-size: 1.0625rem; margin-top: 2px; }
.ac-empty__body{ margin-top: 6px; font-size: .875rem; color: var(--aisa-muted-gray); }
.ac-empty .ac-btn{ margin-top: 14px; }
.ac-empty .ac-eyebrow{ justify-content: center; }
/* "Blank does not mean free" — and the tool says so out loud. */
.ac-empty[data-ac-kind="NEVER_POPULATED"]{
  border: 2px solid var(--state-warn-border);
  background: var(--state-warn-fill);
}
.ac-empty[data-ac-kind="NEVER_POPULATED"] .ac-empty__body{ color: var(--aisa-near-black); }
.ac-empty[data-ac-kind="NON_TEACHING"]{
  background-image: repeating-linear-gradient(45deg,
    var(--aisa-purple-border) 0 1px, transparent 1px 9px);
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}

/* 13.3 / 13.4 Error and forbidden */
.ac-error{
  margin-top: 12px;
  padding: 22px 18px;
  border: 2px solid var(--state-alert);
  border-radius: var(--radius);
  background: var(--aisa-white);
}
.ac-error__title{ font-size: 1.125rem; color: var(--aisa-near-black); }
.ac-error__body{ margin-top: 6px; font-size: .9375rem; color: var(--aisa-near-black); }
.ac-error__actions{ display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.ac-error__ref{ margin-top: 10px; font-size: .75rem; font-family: ui-monospace, monospace; }
.ac-error[data-ac-code="FORBIDDEN"],
.ac-error[data-ac-code="DIVISION_INACTIVE"],
.ac-error[data-ac-code="NO_SCRIPT"]{
  border-color: var(--aisa-purple-border);
  border-width: 1px;
  background: var(--aisa-purple-tint);
}
/* The <noscript> copy sits outside .ac-app and therefore needs its own gutter. */
noscript .ac-error{ margin: var(--ac-gutter); }


/* ===========================================================================
   §14  TOAST
   ======================================================================== */
.ac-toast-root{
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(84px + env(safe-area-inset-bottom));   /* clears the FAB on phone */
  z-index: var(--ac-z-toast);
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
  width: min(440px, calc(100vw - 2 * var(--ac-gutter)));
  pointer-events: none;
}
.ac-toast{
  pointer-events: auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
  padding: 11px 12px;
  border: 1px solid var(--aisa-purple-border);
  border-left: 4px solid var(--aisa-purple);
  border-radius: var(--radius);
  background: var(--aisa-white);
  box-shadow: var(--ac-shadow-2);
  font-size: .875rem;
  animation: ac-toast-in .18s ease;
}
@keyframes ac-toast-in{ from{ opacity: 0; transform: translateY(8px); } }
.ac-toast__text{ flex: 1 1 100%; min-width: 0; }
.ac-toast[data-ac-tone="OK"]{ border-left-color: var(--state-ok); }
.ac-toast[data-ac-tone="INFO"]{ border-left-color: var(--aisa-purple); }
.ac-toast[data-ac-tone="WARN"]{ border-left-color: var(--state-warn-border); background: var(--state-warn-fill); }
.ac-toast__close{
  width: 32px; height: 32px;
  border: 0; border-radius: 6px;
  background: transparent;
  color: var(--aisa-muted-gray);
  font-size: 1.125rem;
  line-height: 1;
  cursor: pointer;
  margin-inline-start: auto;
}
.ac-toast__close:hover{ background: var(--aisa-purple-tint); color: var(--aisa-purple); }

/* ---- FAB ---- */
.ac-fab{
  position: fixed;
  right: var(--ac-gutter);
  bottom: calc(var(--ac-gutter) + env(safe-area-inset-bottom));
  z-index: var(--ac-z-fab);
  width: 56px; height: 56px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 50%;
  background: var(--aisa-purple);
  color: var(--aisa-white);
  box-shadow: var(--ac-shadow-2);
  cursor: pointer;
}
.ac-fab:hover{ background: var(--aisa-purple-hover); }
.ac-fab__glyph{ font-size: 1.75rem; font-weight: 400; line-height: 1; }

/* ---- The flash highlight after a save (JsApp toggles is-selected + this) ---- */
.ac-day-cell.is-flash,
.ac-card.is-flash{ animation: ac-flash 1.2s ease-out 1; }
@keyframes ac-flash{
  0%, 40%{ box-shadow: 0 0 0 3px var(--aisa-gold); }
  100%{ box-shadow: 0 0 0 3px transparent; }
}
.is-dimmed{ opacity: .55; }
.is-hidden-by-filter{ opacity: .45; }


/* ===========================================================================
   §15  RESPONSIVE — base above is the 390px phone. These ADD to it.
   ======================================================================== */

/* ---- >= 560px: small tablets and large phones ---- */
@media (min-width: 560px){
  .ac-month-grid{ border-spacing: 3px; }
  .ac-day-cell{ height: 82px; padding: 5px; }
  .ac-month-grid__dow{ font-size: .75rem; }
  .ac-conflict__cols{ grid-template-columns: 1fr 1fr; }
  .ac-toast-root{ bottom: calc(var(--ac-gutter) + env(safe-area-inset-bottom)); }
}

/* ---- >= 768px: the desktop/tablet layout ----
   FAB off, day-cell chips on, drawers become side panels, week becomes five
   real columns. This is the single most important breakpoint in the file. */
@media (min-width: 768px){
  body{ font-size: .9375rem; }

  .ac-app{ padding-block: 0 40px; }

  .ac-fab{ display: none; }

  .ac-view-heading{ font-size: 1.375rem; }

  /* Month grid: full cells with titles */
  .ac-month-grid{ border-spacing: 4px; }
  .ac-month-grid__dow{ padding: 8px 6px; font-size: .75rem; letter-spacing: .06em; }
  .ac-day-cell{
    height: var(--ac-cell-min-h);
    padding: 7px 8px;
    text-align: left;
  }
  .ac-day-cell__head{ justify-content: flex-start; }
  .ac-day-cell__num{ font-size: 1rem; }
  .ac-meter{ justify-content: flex-start; margin-inline: 0; }
  .ac-week-col__head .ac-meter{ margin-inline: 0; }
  .ac-day-cell__chips{ display: flex; }
  .ac-day-cell__more{ display: block; }
  .ac-gradestrip{ justify-content: flex-start; }
  /* Revealed on hover AND focus-within, so keyboard users reach it too. */
  .ac-day-cell:hover .ac-day-cell__add,
  .ac-day-cell:focus-within .ac-day-cell__add{ display: inline-flex; }

  /* The mobile week strip is a phone affordance only. Note this hides the
     .ac-weekstrip SECTION, never the shared .ac-weekstrip__days--inline list
     that Week view and the Day sheet reuse at every breakpoint. */
  .ac-weekstrip{ display: none; }

  .ac-skeleton__cell{ height: var(--ac-cell-min-h); }

  /* Week view: five real columns, full height */
  .ac-week__cols{ grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; align-items: start; }
  .ac-week-col__head{ position: static; flex-direction: column; align-items: flex-start; gap: 6px; }
  .ac-week-col__list{ padding: 8px; }

  /* Drawers become right-hand side panels; the grid stays visible behind them,
     because comparing the chosen day with its neighbours IS the task. */
  .ac-drawer{
    inset: 0 0 0 auto;
    width: var(--ac-sheet-w);
    max-width: 92vw;
    border-left: 1px solid var(--aisa-purple-border);
    border-radius: 0;
  }
  .ac-drawer--booking{ width: var(--ac-drawer-w); }
  .ac-drawer--day{ top: 0; max-height: none; border-top: 0; }
  .ac-drawer__head{ padding-top: 16px; }
  .ac-drawer__close{ top: 12px; }
  .ac-drawer__actions .ac-btn{ flex: 0 1 auto; }

  .ac-steps__item{ font-size: .8125rem; }

  /* Still allowed to wrap here: at 768-1099 the dates, view switch, four
     filter controls and the Add button genuinely do not fit on one line, and a
     nowrap row would push the Add button off the edge. */
  .ac-toolbar{ gap: 12px; padding-block: 12px; }
  .ac-toolbar__dates{ flex: 0 0 auto; }
  .ac-toolbar__period{ min-width: 9.5rem; }
  .ac-toolbar__filters{ flex: 1 1 300px; justify-content: flex-end; }

  .ac-cohort-bar{ display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .ac-cohort-bar > * + *{ margin-top: 0; }
  .ac-cohort-bar__note{ flex: 1 1 100%; }
  .ac-tokens{ flex-wrap: wrap; overflow-x: visible; }

  .ac-toast-root{ left: auto; right: var(--ac-gutter); transform: none; }
}

/* ---- >= 1100px: roomier month cells, toolbar on one line ---- */
@media (min-width: 1100px){
  .ac-day-cell{ height: 132px; padding: 9px 10px; }
  .ac-skeleton__cell{ height: 132px; }
  .ac-meter{ gap: 7px; }
  .ac-chip{ font-size: .78125rem; }
  .ac-week-col__list{ padding: 10px; }
  /* The toolbar still WRAPS rather than compressing. Dates + view switch +
     four filter controls + Add do not fit on one 1100px line without either
     clipping a control or shrinking the search box to uselessness; a second
     row costs 44px and costs nothing else. */
  .ac-toolbar__filters{ flex: 1 1 420px; }
}

/* ---- Density: COMPACT tightens without changing the information ---- */
.ac-app[data-ac-density="COMPACT"] .ac-day-cell{ height: 96px; padding: 5px 6px; }
.ac-app[data-ac-density="COMPACT"] .ac-card{ padding: 7px 36px 7px 12px; }
.ac-app[data-ac-density="COMPACT"] .ac-week-col__list{ gap: 6px; }
.ac-app[data-ac-density="COMPACT"] .ac-drawer__body > * + *{ margin-top: 9px; }

/* ---- Coarse pointers never get hover-only affordances ---- */
@media (hover: none){
  .ac-day-cell__add{ display: none !important; }
}


/* ===========================================================================
   §16  PRINT — a clean month or week on A4, no chrome, ink-efficient,
        readable in greyscale.
        A printed calendar outlives the tab it came from, so the freshness
        stamp and the provisional-dates line are part of the artefact.
   ======================================================================== */
@media print{
  @page{ size: A4 landscape; margin: 12mm; }
  @page ac-portrait{ size: A4 portrait; margin: 12mm; }
  .ac-app[data-ac-view="WEEK"],
  .ac-app[data-ac-view="METRICS"]{ page: ac-portrait; }

  html, body{ background: var(--aisa-white); }
  body{ font-size: 10pt; line-height: 1.35; }

  .ac-app{ max-width: none; padding: 0; }

  /* ---- Chrome off ---- */
  .ac-u-no-print,
  .ac-skip-link,
  #ac-cohort-bar,
  #ac-toolbar,
  #ac-chiprow,
  #ac-fab,
  #ac-drawer-root,
  #ac-backdrop,
  #ac-toast-root,
  #ac-header,
  #ac-banners .ac-banner__close,
  .ac-day-cell__add,
  .ac-card__menu,
  .ac-popover,
  .ac-progress,
  .ac-day-cell__more,
  .ac-btn{ display: none !important; }

  /* ---- Print-only blocks. These carry the `hidden` attribute on screen; the
     id selector out-specifies [hidden]{display:none!important}. AC.print may
     also clear the attribute — this rule simply makes it unnecessary. ---- */
  #ac-print-header[hidden],
  #ac-print-footer[hidden],
  #ac-print-header,
  #ac-print-footer{ display: block !important; }

  .ac-print-header{
    margin-bottom: 8mm;
    padding-bottom: 3mm;
    border-bottom: 1.5pt solid var(--aisa-purple);
    break-inside: avoid;
    break-after: avoid;
  }
  .ac-print-header__title{ font-size: 15pt; margin-top: 2pt; }
  .ac-print-header__filters,
  .ac-print-header__stamp{ font-size: 8.5pt; color: var(--aisa-muted-gray); margin-top: 2pt; }
  /* Mandatory when true. An undated printout is a future clash. */
  .ac-print-header__warn,
  .ac-print-header__prov{
    margin-top: 3pt;
    padding: 2pt 4pt;
    border: 1pt solid var(--aisa-near-black);
    font-size: 8.5pt;
    font-weight: 700;
  }
  .ac-print-footer{
    margin-top: 6mm;
    padding-top: 2mm;
    border-top: .5pt solid var(--aisa-purple-border);
    font-size: 7.5pt;
    color: var(--aisa-muted-gray);
    word-break: break-all;
  }

  /* ---- Month grid ---- */
  .ac-month-grid{ border-spacing: 0; border-collapse: collapse; }
  .ac-month-grid thead{ display: table-header-group; }   /* headers repeat per page */
  .ac-month-grid__dow{
    background: var(--aisa-white);
    border: .5pt solid var(--aisa-near-black);
    border-radius: 0;
    color: var(--aisa-near-black);
    font-size: 8.5pt;
  }
  .ac-month-grid__week{ break-inside: avoid; }

  /* Cells grow to fit: no clipping, no ellipses, no "+N more" anywhere. */
  .ac-day-cell{
    height: auto;
    min-height: 22mm;
    overflow: visible;
    border: .5pt solid var(--aisa-near-black);
    border-radius: 0;
    background: var(--aisa-white) !important;   /* ink-efficient: white paper stays white */
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .ac-day-cell__chips{ display: flex !important; overflow: visible; }
  .ac-chip{ border: .5pt solid var(--aisa-near-black); border-radius: 0; font-size: 7.5pt; }
  .ac-chip__title{ white-space: normal; overflow: visible; text-overflow: clip; }
  .ac-u-truncate{ white-space: normal; overflow: visible; text-overflow: clip; }

  /* Severity survives greyscale: left rule weight + meter segments + numeral +
     word, all four, on white paper. */
  .ac-day-cell[data-ac-level="MODERATE"]{ border-left: 1.5pt solid var(--aisa-near-black); }
  .ac-day-cell[data-ac-level="HEAVY"]{ border-left: 2.5pt solid var(--aisa-near-black); }
  .ac-day-cell[data-ac-level="OVER"]{ border-left: 3pt double var(--aisa-near-black); }
  .ac-meter__seg, .ac-meter::before,
  .ac-day-cell--closed, .ac-chip__badge, .ac-bar > i, .ac-table thead th{
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .ac-meter__word{ color: var(--aisa-near-black); }

  /* ---- Week view and cards ---- */
  .ac-week__cols{ grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2mm; }
  .ac-week-col, .ac-card, .ac-card-panel, .ac-stat{ break-inside: avoid; }
  .ac-card{ border: .5pt solid var(--aisa-near-black); border-radius: 0; padding: 2mm; }
  .ac-week-col__head{ position: static; background: var(--aisa-white); }

  /* ---- Metrics: every chart's data table prints, opened. ---- */

   ======================================================================== */

   instead), no smooth scroll. COMPONENTS.md §0 rule 9. */
@media (prefers-reduced-motion: reduce){

    transition-duration: .001ms !important;
